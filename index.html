      if(sourceRect && targetRect) ballSwapAnim={source:sourceIdx,target:targetIdx,sourceRect,targetRect};
      renderBallQueue();
      return;
    }
    animateDragReturn(info);
  }

  function getCardSellPrice(def){
    return Math.floor((Number(def?.cost)||0) / 2);
  }

  function renderCardHand(){
    cardHandEl.innerHTML = '';
    if(!state.cardHand.length){
      cardHandEl.innerHTML = '<div class="tag-empty">Chưa có thẻ nào trong tay</div>';
      return;
    }
    state.cardHand.forEach((card, idx)=>{
      const isUpgrade = card.kind==='upgrade';
      const def = isUpgrade ? UPGRADE_POOL.find(x=>x.id===card.defId) : POWER_CARD_DEFS[card.defId];
      if(!def) return;
      const chip = document.createElement('div'); chip.className='power-card-chip';
      const nameSpan = document.createElement('span'); nameSpan.className='name'; nameSpan.textContent = def.name;
      attachCardTooltip(chip, def);

      const actions = document.createElement('div'); actions.className='card-actions';
      const btn = document.createElement('button'); btn.textContent='Dùng';
      btn.disabled = !['playing','shop'].includes(state.phase) || !!state.targeting;
      btn.addEventListener('click', ()=> activateCardFromHand(idx, def));

      const sellPrice = getCardSellPrice(def);
      const sellBtn = document.createElement('button');
      sellBtn.className='sell-card-btn';
      sellBtn.textContent=`Bán ${formatMoney(sellPrice)}`;
      sellBtn.disabled = !['playing','shop'].includes(state.phase) || !!state.targeting || sellPrice<=0;
      sellBtn.addEventListener('click', ()=>{
        if(!['playing','shop'].includes(state.phase) || state.targeting || sellPrice<=0) return;
        state.cardHand.splice(idx,1);
        state.money += sellPrice;
        moneyValEl.textContent=formatMoney(state.money);
        render();
        renderTargetBanner();
        scheduleAutoSave();
      });

      actions.appendChild(btn);
      actions.appendChild(sellBtn);
      chip.appendChild(nameSpan);
      chip.appendChild(actions);
      cardHandEl.appendChild(chip);
    });
  }


  // ---------- targeting mode (power cards) ----------
  function targetKindMatches(def, kind){
    if(def.targetKind === 'both') return true;
    if(def.targetKind === 'swap'){
      if(!state.targeting.targets.length) return true;
      return state.targeting.targets[0].kind === kind;
    }
    return def.targetKind === kind;
  }

  function rememberLastUsedCard(def){
    if(!def || def.id==='copy') return;
    state.lastUsedCard={kind:'power',defId:def.id};
  }

  function commitTargeting(){
    const t=state.targeting; if(!t) return false;
    const def=t.def, min=def.targetMinCount||def.targetCount, max=def.targetCount;
    if(t.targets.length<min || t.targets.length>max) return false;
    def.use(t.targets); rememberLastUsedCard(def); syncBallMutationTargets(t.targets); renderBallQueue();
    state.cardHand.splice(t.handIdx,1); state.targeting=null; render(); renderTargetBanner();
    if(state.phase==='shop') refreshOpenShop();
    return true;
  }

  function activateCardFromHand(handIdx, def){
    if(!def) return;
    const card=state.cardHand[handIdx];
    if(!card) return;
    if(card.kind==='upgrade'){
      def.apply();
      state.lastUpgrade=def;
      state.lastUsedCard={kind:'upgrade',defId:def.id};
      state.cardHand.splice(handIdx,1);
      render();
      renderTargetBanner();
      scheduleAutoSave();
      return;
    }
    activatePowerCardFromHand(handIdx, def);
  }

  function activatePowerCardFromHand(handIdx, def){
    if(!def) return;
    if(def.targetCount===0){
      state.cardHand.splice(handIdx,1);
      def.use([]);
      rememberLastUsedCard(def);
      render();
      return;
    }
    startTargeting(handIdx, def);
  }

  function startTargeting(handIdx, def){
    if(def.targetCount===0){
      state.cardHand.splice(handIdx,1);
      def.use([]); rememberLastUsedCard(def); render(); return;
    }
    state.targeting={handIdx,def,need:def.targetCount,targets:[]};
    render();
    renderTargetBanner();
  }

  function cancelTargeting(){
    state.targeting = null;
    inventoryOverlayEl.classList.add('hidden');
    inventoryOverlayEl.innerHTML='';
    render();
    renderTargetBanner();
    if(state.phase==='shop') refreshOpenShop();
  }

  function handleTargetClick(target){
    const t = state.targeting;
    if(!t) return;
    const def = t.def;
    if(!targetKindMatches(def, target.kind)) return;
    const existing = t.targets.findIndex(x=>x.obj===target.obj);
    if(existing>=0){
      t.targets.splice(existing,1);
    } else {
      if(t.targets.length>=t.need) return;
      t.targets.push(target);
    }
    if(t.targets.length >= t.need && !def.manualConfirm){
      commitTargeting();
    } else {
      render();
      renderTargetBanner();
    }
  }

  function renderTargetBanner(){
    const shopIsOpen = !shopOverlayEl.classList.contains('hidden');
    const shopPanel = shopIsOpen ? shopOverlayEl.querySelector('.shop-panel') : null;
    if(!state.targeting){
      targetBannerEl.classList.add('hidden');
      targetBannerEl.innerHTML='';
      shopPanel?.classList.remove('targeting-pass-through');
      return;
    }

    targetBannerEl.classList.remove('hidden');
    shopPanel?.classList.add('targeting-pass-through');
    const t=state.targeting;
    targetBannerEl.innerHTML='';

    const span=document.createElement('span');
    span.textContent=`Chọn mục tiêu cho ${t.def.name} (${t.targets.length}/${t.need})`;
    targetBannerEl.appendChild(span);

    const cancelBtn=document.createElement('button');
    cancelBtn.textContent='Huỷ';
    cancelBtn.addEventListener('click', e=>{
      e.preventDefault();
      e.stopPropagation();
      cancelTargeting();
    });
    targetBannerEl.appendChild(cancelBtn);

    if(t.def.manualConfirm){
      const confirmBtn=document.createElement('button');
      confirmBtn.className='gold';
      confirmBtn.textContent='Xác nhận';
      confirmBtn.disabled=t.targets.length<(t.def.targetMinCount||1);
      confirmBtn.addEventListener('click', e=>{
        e.preventDefault();
        e.stopPropagation();
        if(!confirmBtn.disabled) commitTargeting();
      });
      targetBannerEl.appendChild(confirmBtn);
    }
  }

  // ---------- drag & rotate ----------
  let drag = null;

  function attachHandBlockDrag(slot, idx){
    slot.addEventListener('pointerdown', e=>{
      if(state.targeting){ e.preventDefault(); handleTargetClick({obj: state.hand[idx], kind:'block'}); return; }
      if(state.resolving || state.phase!=='playing') return;
      startDrag(e, {origin:'hand', idx, block: state.hand[idx]});
    });
  }
  function attachBoardBlockDrag(cellEl){
    cellEl.addEventListener('pointerdown', e=>{
      const r=+cellEl.dataset.r, c=+cellEl.dataset.c;
      if(state.targeting){ e.preventDefault(); handleTargetClick({obj: state.cells[r][c].block, kind:'block'}); return; }
      if(state.resolving || state.phase!=='playing') return;
      startDrag(e, {origin:'board', r, c, block: state.cells[r][c].block});
    });
  }
  function startDrag(e, info){
    e.preventDefault();
    drag = Object.assign(info, {startX:e.clientX, startY:e.clientY, moved:false, ghostEl:null});
    window.addEventListener('pointermove', onDragMove);
    window.addEventListener('pointerup', onDragEnd);
  }
  function onDragMove(e){
    if(!drag) return;
    drag.targetX = e.clientX; drag.targetY = e.clientY;
    const dx=e.clientX-drag.startX, dy=e.clientY-drag.startY;
    if(!drag.moved && Math.hypot(dx,dy)>6){
      drag.moved = true;
      drag.ghostEl = document.createElement('div'); drag.ghostEl.className = 'drag-ghost';
      renderBlockArms(drag.ghostEl, drag.block);
      document.body.appendChild(drag.ghostEl);
      drag.curX = e.clientX; drag.curY = e.clientY;
      drag.sourceEl = drag.origin==='hand'
        ? handEl.querySelector(`.hand-slot[data-idx="${drag.idx}"]`)
        : boardEl.querySelector(`.cell[data-r="${drag.r}"][data-c="${drag.c}"]`);
      if(drag.sourceEl) drag.sourceEl.classList.add('drag-source-fade');
      dragGhostLoop(drag);
    }
    if(drag.moved) updateDropHover(e.clientX, e.clientY);
  }

  function dragGhostLoop(dragState){
    if(!dragState || !dragState.moved) return;
    const dx = dragState.targetX - dragState.curX, dy = dragState.targetY - dragState.curY;
    dragState.curX += dx*0.3; dragState.curY += dy*0.3;
    const tilt = Math.max(-16, Math.min(16, dx*0.15));
    dragState.ghostEl.style.left = dragState.curX+'px'; dragState.ghostEl.style.top = dragState.curY+'px';
    dragState.ghostEl.style.transform = `translate(-50%,-50%) rotate(${tilt}deg) scale(1.12)`;
    dragState.raf = requestAnimationFrame(()=>dragGhostLoop(dragState));
  }

  // board-origin drags may land on an occupied cell (swap); hand-origin drags may only land on empty cells
  function dropTargetCell(el){
    const cellEl = el && el.closest ? el.closest('.cell') : null;
    if(!cellEl || cellEl.classList.contains('node') || cellEl.classList.contains('hole') || cellEl.classList.contains('black-block')) return null;
    if(drag.origin==='hand' && cellEl.classList.contains('hasblock')) return null;
    if(drag.origin==='board' && +cellEl.dataset.r===drag.r && +cellEl.dataset.c===drag.c) return null;
    return cellEl;
  }
  function updateDropHover(x,y){
    document.querySelectorAll('.cell.drop-hover,.hand-slot.drop-hover').forEach(c=>c.classList.remove('drop-hover'));
    const el = document.elementFromPoint(x,y);
    const handSlot = el && el.closest ? el.closest('.hand-slot.filled') : null;
    if(handSlot && drag && drag.origin==='hand' && +handSlot.dataset.idx!==drag.idx){ handSlot.classList.add('drop-hover'); return; }
    const cellEl = dropTargetCell(el);
    if(cellEl) cellEl.classList.add('drop-hover');
  }

  function animateDragReturn(info){
    if(!info.ghostEl || !info.sourceEl){
      if(info.sourceEl) info.sourceEl.classList.remove('drag-source-fade');
      return;
    }
    const src=info.sourceEl.querySelector('.ball-chip')?.getBoundingClientRect() || info.sourceEl.getBoundingClientRect();
    const ghost=info.ghostEl.getBoundingClientRect();
    const dx=(src.left+src.width/2)-(ghost.left+ghost.width/2);
    const dy=(src.top+src.height/2)-(ghost.top+ghost.height/2);
    info.ghostEl.style.transition='transform calc(.24s / var(--anim-speed)) cubic-bezier(.22,.8,.24,1), opacity calc(.24s / var(--anim-speed)) ease';
    info.ghostEl.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(0deg) scale(1)`;
    setTimeout(()=>{ if(info.ghostEl) info.ghostEl.remove(); if(info.sourceEl) info.sourceEl.classList.remove('drag-source-fade'); },scaledDuration(250));
  }

  function onDragEnd(e){
    window.removeEventListener('pointermove', onDragMove);
    window.removeEventListener('pointerup', onDragEnd);
    if(!drag) return;

    if(drag.raf) cancelAnimationFrame(drag.raf);

    if(!drag.moved){
      drag.block.rotation = (drag.block.rotation+1)%4;
      const containerEl = drag.origin==='hand'
        ? handEl.querySelector(`.hand-slot[data-idx="${drag.idx}"]`)
        : boardEl.querySelector(`.cell[data-r="${drag.r}"][data-c="${drag.c}"]`);
      const visual = containerEl && containerEl.querySelector('.block-visual');
      if(visual){
        const nextDeg = parseFloat(visual.dataset.deg||'0') + 90;
        visual.dataset.deg = nextDeg;
        visual.style.transform = `rotate(${nextDeg}deg)`;
      }
      syncHoleConnectionsForBlock(drag.r, drag.c);
      drag = null;
      return;
    }

    if(drag.ghostEl) drag.ghostEl.remove();
    document.querySelectorAll('.cell.drop-hover').forEach(c=>c.classList.remove('drop-hover'));

    const el = document.elementFromPoint(e.clientX, e.clientY);

    const handSlot = el && el.closest ? el.closest('.hand-slot.filled') : null;
    if(handSlot && drag.origin==='hand'){
      const targetIdx = +handSlot.dataset.idx;
      if(targetIdx !== drag.idx){
        [state.hand[drag.idx], state.hand[targetIdx]] = [state.hand[targetIdx], state.hand[drag.idx]];
        render();
      }
      drag = null;
      return;
    }

    const cellEl = dropTargetCell(el);

    if(cellEl){
      const r=+cellEl.dataset.r, c=+cellEl.dataset.c;
      if(drag.origin==='hand'){
        state.cells[r][c] = {type:'empty', block: drag.block};
        state.hand[drag.idx] = null;
        refillHand(true);
      } else if(drag.origin==='board'){
        const targetHadBlock=!!state.cells[r][c].block;
        const sourceRect=drag.sourceEl?.getBoundingClientRect();
        const targetRect=cellEl.getBoundingClientRect();
        state.cells[drag.r][drag.c].block = state.cells[r][c].block || null;
        state.cells[r][c].block = drag.block;
        if(targetHadBlock && sourceRect && targetRect) swapAnim={source:{r,c},target:{r:drag.r,c:drag.c},sourceRect,targetRect};
      }
      placeAnimCell = {r,c};
      drag.sourceEl?.classList.remove('drag-source-fade');
    } else {
      animateDragReturn(drag);
    }
    render();
    drag = null;
  }

  function syncHoleConnectionsForBlock(r,c){
    const block=state.cells[r]?.[c]?.block;
    if(!block) return;
    for(const d of [0,1,2,3]){
      const [dx,dy]=DIR_VEC[d], hr=r+dy, hc=c+dx;
      if(hr<0||hr>=state.rows||hc<0||hc>=state.cols||state.cells[hr][hc].type!=='hole') continue;
      const key=`${hr},${hc},${opposite(d)}`;
      const connected=openSides(block).includes(d);
      const holeEl=boardEl.querySelector(`.cell.hole[data-r=\"${hr}\"][data-c=\"${hc}\"]`);
      if(connected){
        if(state.holeConnections.has(key)) continue;
        const connector=document.createElement('div');
        connector.className='hole-connector '+DIR_NAMES[opposite(d)];
        if(holeEl) holeEl.appendChild(connector);
        state.holeConnections.add(key);
      } else if(state.holeConnections.has(key)){
        const connector=holeEl?.querySelector(`.hole-connector.${DIR_NAMES[opposite(d)]}`);
        if(connector){ connector.classList.add('retracting'); setTimeout(()=>connector.remove(),scaledDuration(290)); }
        state.holeConnections.delete(key);
      }
    }
  }

  // ---------- firing / simulation ----------
  function cellPercent(r,c){ return { left:((c+0.5)/state.cols)*100, top:((r+0.5)/state.rows)*100 }; }

  function computeScoreTooltipScale(currentTotal, initialTotal, targetTotal){
    const start = Number.isFinite(initialTotal) && initialTotal > 0 ? initialTotal : 50;
    const target = Number.isFinite(targetTotal) && targetTotal > start ? targetTotal : start + 1;
    const progress = Math.max(0, (currentTotal - start) / (target - start));
    const steps = Math.floor(progress * 10 + 1e-9);
    return Math.min(4, 1 + steps * 0.05);
  }

  function animateScoreTipValue(valueEl, nextTotal, previousTotal, initialTotal, targetTotal, tip){
    if(!valueEl) return;
    const prevTotal = Number.isFinite(previousTotal) ? previousTotal : nextTotal;
    const nextScale = computeScoreTooltipScale(nextTotal, initialTotal, targetTotal);
    const previousScale = Number.isFinite(valueEl._scoreScale) ? valueEl._scoreScale : 1;
    const crossedGrowthStep = nextScale > previousScale;

    if(valueEl._scoreAnim){ try{ valueEl._scoreAnim.cancel(); }catch{} valueEl._scoreAnim=null; }
    valueEl._scoreScale = nextScale;
    if(tip) tip.style.setProperty('--score-font-size', `${11 * nextScale}px`);

    if(nextTotal <= prevTotal){
      valueEl.style.transform='scale(1)';
      return;
    }

    const duration=(crossedGrowthStep ? 420 : 280) / animationSpeed;
    const keyframes=crossedGrowthStep
      ? [
          {transform:'scale(1)'},
          {transform:'scale(1.16) translate3d(-2px,-1px,0) rotate(-4deg)',offset:.22},
          {transform:'scale(.96) translate3d(2px,1px,0) rotate(3.5deg)',offset:.48},
          {transform:'scale(1.04) translate3d(-1px,0,0) rotate(-1.5deg)',offset:.74},
          {transform:'scale(1) translate3d(0,0,0) rotate(0deg)',offset:1}
        ]
      : [
          {transform:'scale(1) translate3d(0,0,0) rotate(0deg)'},
          {transform:'scale(1) translate3d(-3px,-1px,0) rotate(-6deg)',offset:.14},
          {transform:'scale(1) translate3d(3px,1px,0) rotate(6deg)',offset:.28},
          {transform:'scale(1) translate3d(-2.5px,0,0) rotate(-4.5deg)',offset:.42},
          {transform:'scale(1) translate3d(2.5px,0,0) rotate(4.5deg)',offset:.56},
          {transform:'scale(1) translate3d(-1.5px,0,0) rotate(-2.5deg)',offset:.70},
          {transform:'scale(1) translate3d(1.5px,0,0) rotate(2.5deg)',offset:.84},
          {transform:'scale(1) translate3d(0,0,0) rotate(0deg)',offset:1}
        ];

    valueEl._scoreAnim=valueEl.animate(keyframes,{duration,easing:'cubic-bezier(.34,1.56,.64,1)',fill:'forwards',composite:'replace'});
    valueEl._scoreAnim.onfinish=()=>{ valueEl.style.transform='scale(1)'; valueEl._scoreAnim=null; };
  }

  function createBallEntity(r,c,ballState,animateScore=false,previousTotal=null){
    const ball = document.createElement('div'); ball.className='ball';
    if(ballState.prop){ ball.dataset.prop=ballState.prop; ball.style.setProperty('--prop-color', PROP_COLOR[ballState.prop]); }
    if(ballState.enh) ball.dataset.enh = ballState.enh;
    const p = cellPercent(r,c);
    ball.style.left=p.left+'%'; ball.style.top=p.top+'%';
    boardWrapEl.appendChild(ball);

    const tip = document.createElement('div'); tip.className='ball-tooltip';
    tip.style.left=p.left+'%'; tip.style.top=p.top+'%';
    const tipValue = document.createElement('span');
    tipValue.className='ball-tooltip-value';
    const currentTotal = Math.round(ballState.total);
    tipValue.textContent = formatNumber(currentTotal);
    tipValue._initialTotal = ballState.initialTotal;
    tipValue._scoreScale = 1;
    tipValue._lastTotal = Number.isFinite(previousTotal) ? Math.round(previousTotal) : currentTotal;
    tipValue.style.setProperty('--score-scale', '1');
    tipValue.style.setProperty('--score-scale-prev', '1');
    tipValue.style.transform='scale(1)';
    tip.style.setProperty('--score-font-size', '11px');
    tip.appendChild(tipValue);
    tip._valueEl = tipValue;
    boardWrapEl.appendChild(tip);

    if(animateScore && currentTotal > tipValue._lastTotal){
      requestAnimationFrame(()=>animateScoreTipValue(tipValue, currentTotal, tipValue._lastTotal, ballState.initialTotal, state.target, tip));
    } else {
      const scale = computeScoreTooltipScale(currentTotal, ballState.initialTotal, state.target);
      tipValue._scoreScale = scale;
      tipValue.style.transform = 'scale(1)';
      tip.style.setProperty('--score-font-size', `${11 * scale}px`);
      tip.style.setProperty('--tooltip-scale', String(scale));
      tip._tooltipScale = scale;
    }

    return {ball, tip};
  }
  function moveEntityTo(ball,tip,r,c){
    return new Promise(resolve=>{
      void ball.offsetWidth; // force reflow so the browser commits the current position before we change it
      const p=cellPercent(r,c);
      ball.style.left=p.left+'%'; ball.style.top=p.top+'%';
      tip.style.left=p.left+'%'; tip.style.top=p.top+'%';
      setTimeout(resolve, scaledDuration(230));
    });
  }
  function updateTip(tip, ballState){
    const valueEl = tip?._valueEl || tip;
    const nextTotal = Math.round(ballState.total);
    const previousTotal = Number.isFinite(valueEl._lastTotal) ? valueEl._lastTotal : nextTotal;
    valueEl.textContent = formatNumber(nextTotal);
    if(nextTotal > previousTotal){
      animateScoreTipValue(valueEl, nextTotal, previousTotal, ballState.initialTotal, state.target, tip);
    }
    valueEl._lastTotal = nextTotal;
  }
  function removeEntity(ball,tip){ ball.remove(); tip.remove(); }
  function flashBlocked(r,c){
    const cellEl = boardEl.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
    if(cellEl){ cellEl.classList.remove('blocked-flash'); void cellEl.offsetWidth; cellEl.classList.add('blocked-flash'); }
  }
  function breakBlockAt(r,c){
    state.cells[r][c].block = null;
    for(const d of [0,1,2,3]){
      const [dx,dy]=DIR_VEC[d], hr=r+dy, hc=c+dx;
      if(hr<0||hr>=state.rows||hc<0||hc>=state.cols||state.cells[hr][hc].type!=='hole') continue;
      const key=`${hr},${hc},${opposite(d)}`;
      const holeEl=boardEl.querySelector(`.cell.hole[data-r=\"${hr}\"][data-c=\"${hc}\"]`);
      if(state.holeConnections.has(key)){
        const connector=holeEl?.querySelector(`.hole-connector.${DIR_NAMES[opposite(d)]}`);
        if(connector){ connector.classList.add('retracting'); setTimeout(()=>connector.remove(),scaledDuration(290)); }
        state.holeConnections.delete(key);
      }
    }
    const cellEl = boardEl.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
    if(cellEl){
      cellEl.classList.remove('hasblock');
      cellEl.querySelectorAll('.block-visual').forEach(n=>{ n.style.transition='opacity calc(.3s / var(--anim-speed))'; n.style.opacity='0'; });
      setTimeout(()=>{ cellEl.querySelectorAll('.block-visual').forEach(n=>n.remove()); }, scaledDuration(300));
    }
  }
  function wait(ms){ return new Promise(res=>setTimeout(res,scaledDuration(ms))); }

  // ---------- gameplay effects (data-driven) ----------
  // ballState: { total, rate, prop, enh, broke }
  const BLOCK_PROP_EFFECTS = {
    steel: { onExit:()=>{} },
    stone: { onExit:(bs, x)=>{ bs.total += 50*x; } },
    wood:  { onExit:(bs, x)=>{ bs.rate += 5*x; } },
    glass: { onExit:(bs, x)=>{ for(let i=0;i<x;i++) bs.total *= 1.5; }, chanceToBreak:0.20 },
    gold:  { onExit:()=>{} },
  };

  const BALL_PROP_EFFECTS = {
    striped: { onExit:()=>{} },
    grid:    { onExit:(bs, x)=>{ bs.total += 10*x; } },
    glass:   { onExit:(bs, x)=>{ for(let i=0;i<x;i++) bs.total *= 2; } },
    steel:   { onGoal:(bs, x)=>{ for(let i=0;i<x;i++) bs.total *= 1.5; } },
    gold:    { onGoal:(bs, x)=>{ state.money += 1*x; } },
  };

  const ENHANCEMENT_EFFECTS = {
    spark: { blockExit:(bs)=>{ bs.total += bs.rate; }, ballExit:(bs)=>{ bs.total *= 2; } },
    holo:  { blockExit:(bs)=>{ bs.total += 50; }, ballExit:(bs)=>{ bs.total += 50; } },
  };

  function syncMoneyHud(){
    moneyValEl.textContent = formatMoney(state.money);
  }

  function blockExitEffects(block, ballState){
    const prop = block.property, enh = block.enhancement;
    const sparkX = enh==='spark' ? 2 : 1;
    let brokeBlock = false;

    const propFx = BLOCK_PROP_EFFECTS[prop];
    propFx?.onExit?.(ballState, sparkX);
    if(prop==='steel'){
      if(!ballState.steelBlocks) ballState.steelBlocks = new Set();
      ballState.steelBlocks.add(block);
    }

    // Striped balls multiply the score granted by this block, not the current
    // accumulated score of the ball.
    const blockGain = ballState.prop==='striped' ? ballState.rate * 1.5 : ballState.rate;
    ballState.total += blockGain;

    if(propFx?.chanceToBreak && Math.random() < propFx.chanceToBreak) brokeBlock = true;
    if(!prop && enh==='spark') ENHANCEMENT_EFFECTS.spark.blockExit(ballState);
    if(enh==='holo') ENHANCEMENT_EFFECTS.holo.blockExit(ballState);

    ballState.total += (state.typeBonus[block.type] || 0);
    return brokeBlock;
  }

  function ballExitEffects(ballState){
    const prop = ballState.prop, enh = ballState.enh;
    const sparkX = enh==='spark' ? 2 : 1;
    BALL_PROP_EFFECTS[prop]?.onExit?.(ballState, sparkX);
    if(!prop && enh==='spark') ENHANCEMENT_EFFECTS.spark.ballExit(ballState);
    if(enh==='holo') ENHANCEMENT_EFFECTS.holo.ballExit(ballState);
  }

  function removeBallPermanently(ballId){
    if(!ballId || !state) return false;
    const qIndex=state.ballQueue.findIndex(q=>q._id===ballId);
    let changed=false;
    if(qIndex>=0){ state.ballQueue.splice(qIndex,1); state.ballsFired=Math.max(0,state.ballsFired-1); changed=true; }
    const before=state.ballPool.length;
    state.ballPool=state.ballPool.filter(b=>b._id!==ballId);
    changed=changed || state.ballPool.length!==before;
    if(changed){ renderBallQueue(); refreshOpenShop(); refreshOpenGachaBalls(); scheduleAutoSave(); }
    return changed;
  }

  function finishGlassBranch(ballState,reachedGoal){
    if(ballState?.prop!=='glass') return;
    const meta=ballState.glassShot;
    if(!meta || meta.finished) return;
    meta.active=Math.max(0,meta.active-1);
    if(meta.active!==0) return;
    if(reachedGoal && !meta.lossChecked){
      meta.lossChecked=true;
      if(Math.random()<0.10){
        meta.permanentlyLost=true;
        removeBallPermanently(meta.ballId);
      }
    }
  }

  function ballGoalEffects(ballState){
    const prop=ballState.prop, enh=ballState.enh;
    const sparkX=enh==='spark'?2:1;
    const steelBlockCount=ballState.steelBlocks?.size || 0;
    for(let i=0;i<steelBlockCount;i++) ballState.total*=1.5;
    BALL_PROP_EFFECTS[prop]?.onGoal?.(ballState,sparkX);
    if(prop==='gold' || prop==='steel') syncMoneyHud();
  }

  async function loseBall(ball, tip, r, c, ballState=null){
    if(Number.isInteger(r) && Number.isInteger(c)) flashBlocked(r,c);
    ball.classList.add('lost');
    tip.style.opacity='0';
    await wait(300);
    removeEntity(ball,tip);
    finishGlassBranch(ballState,false);
    return [];
  }

  async function travel(ball, tip, row, col, dir, ballState, counter, generation=runGeneration){
    if(generation!==runGeneration || !state){
      removeEntity(ball,tip);
      return [];
    }
    counter.launched++;
    const [dx,dy] = DIR_VEC[dir];
    const nr=row+dy, nc=col+dx;

    if(nr<0||nr>=state.rows||nc<0||nc>=state.cols){
      const p = cellPercent(row,col);
      const L=(p.left+dx*40)+'%', T=(p.top+dy*40)+'%';
      ball.style.left=L; ball.style.top=T; tip.style.left=L; tip.style.top=T;
      await wait(230);
      if(generation!==runGeneration || !state){ removeEntity(ball,tip); return []; }
      return loseBall(ball, tip, undefined, undefined, ballState);
    }

    await moveEntityTo(ball,tip,nr,nc);
    if(generation!==runGeneration || !state){ removeEntity(ball,tip); return []; }
    const cellData = state.cells[nr][nc];

    if(cellData.type==='black'){
      return loseBall(ball, tip, nr, nc, ballState);
    }

    if(cellData.type==='hole'){
      ballGoalEffects(ballState);
      updateTip(tip, ballState);
      const goalPopup = document.createElement('div');
      goalPopup.className = 'ball-goal-popup';
      goalPopup.textContent = formatNumber(Math.round(ballState.total));
      // Keep the goal score readable when the tooltip score has grown larger.
      // Tooltip values use a base 11px font and a dynamic score scale; the goal
      // popup uses a base 18px font. Only enlarge the popup when the tooltip's
      // rendered score would otherwise be larger.
      const tooltipScoreScale = Number.isFinite(tip?._valueEl?._scoreScale) ? tip._valueEl._scoreScale : 1;
      const tooltipFontSize = 11 * tooltipScoreScale;
      // The goal popup uses the same rendered font size as the score in the tooltip.
      // This keeps both score readouts visually matched at every growth stage.
      goalPopup.style.fontSize = `${tooltipFontSize}px`;
      const goalColor = ballState.enh ? ENH_COLOR[ballState.enh] : (ballState.prop ? PROP_COLOR[ballState.prop] : 'var(--amber)');
      goalPopup.style.color = goalColor || 'var(--amber)';
      const goalPos = cellPercent(nr,nc);
      goalPopup.style.left = goalPos.left + '%';
      goalPopup.style.top = goalPos.top + '%';
      boardWrapEl.appendChild(goalPopup);
      requestAnimationFrame(()=>goalPopup.classList.add('show'));
      ball.classList.add('scored');
      tip.style.opacity='0';
      await wait(700);
      if(generation!==runGeneration || !state){ goalPopup.remove(); removeEntity(ball,tip); return []; }
      goalPopup.remove();
      removeEntity(ball,tip);
      counter.scored++;
      if(ballState.broke) counter.broke=(counter.broke||0)+1;
      const points = ballState.broke ? 0 : Math.round(ballState.total);
      state.score += points;
      counter.points = (counter.points||0) + points;
      scoreValEl.textContent = formatNumber(state.score);
      finishGlassBranch(ballState,true);

      return [points];
    }

    if(cellData.type==='node' || (cellData.type==='empty' && !cellData.block)){
      return loseBall(ball, tip, nr, nc, ballState);
    }

    const entrySide = opposite(dir);
    const blockRef = cellData.block;
    const sides = openSides(blockRef);
    if(!sides.includes(entrySide)){
      return loseBall(ball, tip, nr, nc, ballState);
    }

    const previousTotal = ballState.total;
    const brokeBlock = blockExitEffects(blockRef, ballState);
    ballExitEffects(ballState);
    const invertBlock = blockRef.enhancement === 'invert';
    if(brokeBlock) breakBlockAt(nr,nc);

    // A glass ball checks its 10% break chance after every block exit. If it breaks,
    // it stops at this block immediately and loses all accumulated score.
    if(ballState.prop==='glass' && Math.random() < 0.10){
      ballState.broke=true;
      counter.broke=(counter.broke||0)+1;
      removeEntity(ball,tip);
      if(ballState.glassShot?.spawnedExtra){
        finishGlassBranch(ballState,false);
      } else {
        if(ballState.glassShot) ballState.glassShot.finished=true;
        removeBallPermanently(ballState._ballId);
      }
      return [0];
    }

    // First pass in a shot: preserve the split. Later passes use one random exit.
    const allExits = sides.filter(s=>s!==entrySide);
    let exits;
    if(blockRef._splitUsed){
      exits = [pick(allExits)];
    } else {
      blockRef._splitUsed = true;
      exits = allExits;
    }
    removeEntity(ball,tip);

    const branches = [];
    if(ballState.prop==='glass' && ballState.glassShot){
      const childCount=exits.length*(invertBlock?2:1);
      ballState.glassShot.active += childCount-1;
      if(childCount>1) ballState.glassShot.spawnedExtra=true;
    }
    exits.forEach(exitDir=>{
      const childState={
        total:ballState.total, rate:ballState.rate, prop:ballState.prop, enh:ballState.enh,
        initialTotal:ballState.initialTotal, _ballId:ballState._ballId, broke:ballState.broke,
        steelBlocks:new Set(ballState.steelBlocks||[]), glassShot:ballState.glassShot
      };
      const c1=createBallEntity(nr,nc,childState,true,previousTotal);
      branches.push(travel(c1.ball,c1.tip,nr,nc,exitDir,childState,counter));
      if(invertBlock){
        const cloneState={
          total:ballState.total, rate:ballState.rate, prop:ballState.prop,
          enh:ballState.enh==='invert'?null:ballState.enh, initialTotal:ballState.initialTotal,
          _ballId:ballState._ballId, broke:ballState.broke,
          steelBlocks:new Set(ballState.steelBlocks||[]), glassShot:ballState.glassShot
        };
        const c2=createBallEntity(nr,nc,cloneState,true,previousTotal);
        branches.push(travel(c2.ball,c2.tip,nr,nc,exitDir,cloneState,counter));
      }
    });
    const results = await Promise.all(branches);
    return results.flat();
  }

  async function onNodeClick(){
    if(state.resolving || state.phase!=='playing' || state.targeting) return;
    if(state.ballsFired >= state.ballQueue.length) return;
    const generation = runGeneration;
    state.resolving = true;

    for(let r=0;r<state.rows;r++) for(let c=0;c<state.cols;c++){
      const b = state.cells[r][c].block;
      if(b) b._splitUsed = false;
    }

    const idx = state.ballsFired;
    syncBallQueueFromPool();
    const queued = state.ballQueue[idx];
    const canonical = state.ballPool.find(b=>b._id===queued._id);
    if(canonical){
      queued.property = canonical.property || null;
      queued.enhancement = canonical.enhancement || null;
    }
    queued.fired = true;
    state.ballsFired++;
    renderBallQueue();

    const counter = {launched:0, scored:0, broke:0};
    const glassShot = queued.property==='glass' ? {
      ballId:queued._id, active:queued.enhancement==='invert' ? 2 : 1,
      spawnedExtra:queued.enhancement==='invert', lossChecked:false, finished:false
    } : null;
    function makeBallState(stripInvert){
      const initialTotal=50+state.startBonus;
      return {
        initialTotal, total:initialTotal, rate:10+state.baseRateBonus, prop:queued.property, _ballId:queued._id,
        enh:(stripInvert && queued.enhancement==='invert') ? null : queued.enhancement,
        broke:false, steelBlocks:new Set(), glassShot
      };
    }
    const initialStates=[makeBallState(false)];
    if(queued.enhancement==='invert') initialStates.push(makeBallState(true));

    const branchPromises = initialStates.map(bs=>{
      const ent = createBallEntity(state.node.r, state.node.c, bs);
      return travel(ent.ball, ent.tip, state.node.r, state.node.c, state.node.dir, bs, counter, generation);
    });
    const resultsArrays = await Promise.all(branchPromises);
    if(generation!==runGeneration || !state){
      return;
    }
    const results = resultsArrays.flat();

    const gained = counter.points || 0;

    if(gained>0){
      let msg = `${counter.scored}/${counter.launched} bóng về đích — +${gained} điểm`;
      if(counter.broke) msg += ` (${counter.broke} bóng vỡ)`;
    } else {
    }

    state.resolving = false;
    checkEndState();
    saveGame({silent:true});
  }

  function getWinBonus(){
    const minBoardSize = Math.min(Number(state.rows)||0, Number(state.cols)||0);
    return Math.max(0, minBoardSize - 1);
  }

  function checkEndState(){
    if(state.score >= state.target){
      const unfired = state.ballQueue.length - state.ballsFired;
      const interestCap = 5 + state.interestCapBonus;
      const interest = Math.min(Math.floor(state.money/5), interestCap);
      const ballBonus = unfired*2;
      let goldBlockCount = 0;
      if(state.cells) for(let r=0;r<state.rows;r++) for(let c=0;c<state.cols;c++){
        const b = state.cells[r][c]?.block;
        if(b?.property==='gold') goldBlockCount++;
      }
      const goldBonus = goldBlockCount * 3;
      state.phase = 'reward';
      runBoardHideAnimation(()=>showLevelReward({winBonus:getWinBonus(), unfired, ballBonus, interest, goldBlockCount, goldBonus}));
    } else if(state.ballsFired >= state.ballQueue.length){
      state.phase = 'gameover';
      renderCardHand();
      showOverlay('lose', 'HẾT BÓNG — KẾT THÚC RUN', `Dừng lại ở màn ${formatNumber(state.level)}, đạt ${formatNumber(state.score)}/${formatNumber(state.target)} điểm. Tổng tiền tích luỹ: ${formatMoney(state.money)}.`);
    }
  }

  function runBoardHideAnimation(onComplete){
    if(!state?.cells || !state.rows || !state.cols){
      onComplete?.();
      return;
    }
    if(boardRevealTimer){
      clearTimeout(boardRevealTimer);
      boardRevealTimer=null;
    }
    state._boardReveal = false;
    state._boardHide = true;
    state._handReveal = false;
    state._handHide = true;
    state._boardHideComplete = typeof onComplete === 'function' ? onComplete : null;
    render();
  }

  function recycleCurrentLevelBlocksToBag(){
    if(!state) return;
    if(state.cells){
      for(let r=0;r<state.rows;r++) for(let c=0;c<state.cols;c++){
        const b=state.cells[r][c]?.block;
        if(b){ state.bag.push(b); state.cells[r][c].block=null; }
      }
    }
    state.bag.push(...state.hand.filter(Boolean));
    state.bag.push(...state.discardPile.filter(Boolean));
    state.hand=[];
    state.discardPile=[];
    state.discardsLeft=getMaxDiscards();
    state.bag.forEach(block=>{ if(block) block.rotation=0; });
    shuffle(state.bag);
  }

  function showLevelReward(info){
    const rewardId = ++rewardGeneration;
    shopOverlayEl.classList.add('hidden');

    const winBonus = Number.isFinite(info.winBonus) ? info.winBonus : getWinBonus();
    const goldBonus = Number.isFinite(info.goldBonus) ? info.goldBonus : 0;
    const goldBlockCount = Number.isFinite(info.goldBlockCount) ? info.goldBlockCount : Math.floor(goldBonus/3);
    const total = winBonus + info.ballBonus + info.interest + goldBonus;

    overlayEl.classList.add('reward-clear');

        <div class="reward-row"><span class="reward-label reward-step">- ${formatNumber(info.unfired)} bóng còn sót (${formatNumber(2)}$ mỗi bóng):</span><span class="reward-value reward-step">${formatNumber(info.ballBonus)}$</span></div>
        <div class="reward-row"><span class="reward-label reward-step">- Tiền lãi (Mỗi 5$ nhận thêm 1$, tối đa ${formatMoney(5 + state.interestCapBonus)}):</span><span class="reward-value reward-step">${formatNumber(info.interest)}$</span></div>
        <div class="reward-row"><span class="reward-label reward-step">- Khối vàng còn lại (${formatNumber(goldBlockCount)} khối × 3$):</span><span class="reward-value reward-step">${formatNumber(goldBonus)}$</span></div>
      </div>`;

    const btn=document.getElementById('overlayBtn');
    // The reward button is shared with the lose overlay/restart flow.
    // Reset every transient state and bind this button to a unique reward cycle.
    btn.className='gold reward-step';
    delete btn.dataset.busy;
    btn.disabled=false;
    btn.textContent=`Nhận tiền: ${formatNumber(total)}$`;
    btn.onclick=()=>{
      // Ignore stale handlers from an older reward/run and prevent double collection.
      if(rewardId!==rewardGeneration || btn.dataset.busy==='1' || state.phase!=='reward') return;
      btn.dataset.busy='1';
      btn.disabled=true;

      // No scale/zoom-out animation when collecting the reward.
      state.money += total;
      state.phase='shop';
      state._boardHideComplete=null;
      state._handRewardHidden=true;
      document.querySelector('.hand-row')?.classList.add('reward-hidden');
      state.score=0;
      recycleCurrentLevelBlocksToBag();
      state.ballsFired=0;
      state.ballQueue=makeBallQueue();

      moneyValEl.textContent=formatMoney(state.money);
      scoreValEl.textContent=formatNumber(state.score);
      renderBallQueue();
      renderHand();
      renderCardHand();
      bagCountEl.textContent=`Túi khối còn lại: ${formatNumber(state.bag.length)}`;
      discardCountEl.textContent=`(${formatNumber(state.discardsLeft)}/${formatNumber(getMaxDiscards())})`;
      discardBtnEl.disabled=true;
      hideOverlay();
      overlayEl.classList.remove('reward-clear');
      openShop();
      // The reward has been consumed; while the shop is active the shared button
      // must not retain a stale reward handler.
      btn.dataset.busy='';
      btn.disabled=false;
      btn.onclick=newRun;
      scheduleAutoSave();
    };
    overlayEl.classList.remove('hidden');

    requestAnimationFrame(()=>{
      const title=overlayPanelEl.querySelector('#overlayTitle .reward-step');
      if(title) setTimeout(()=>title.classList.add('reward-show'),0);
      const labels=[...overlayPanelEl.querySelectorAll('.reward-row .reward-label')];
      const values=[...overlayPanelEl.querySelectorAll('.reward-row .reward-value')];
      // Keep the reward reveal timings consistent with the selected animation speed.
      // CSS animation durations already use --anim-speed, so the JS delays must
      // use the same scale as well.
      let delay=scaledDuration(500);
      for(let i=0;i<labels.length;i++){
        setTimeout(()=>labels[i].classList.add('reward-show'),delay);
        delay += scaledDuration(220);
        setTimeout(()=>values[i]?.classList.add('reward-show'),delay);
        delay += scaledDuration(260);
      }
      setTimeout(()=>btn.classList.add('reward-show'),delay+scaledDuration(500));
    });
  }

  function collectOwnedBlocks(){
    const owned = [];
    for(const b of state.bag) owned.push({block:b,status:'available'});
    for(const b of state.hand) if(b) owned.push({block:b,status:'hand'});
    for(const b of state.discardPile) owned.push({block:b,status:'discarded'});
    if(state.cells){
      for(let r=0;r<state.rows;r++) for(let c=0;c<state.cols;c++){
        const b=state.cells[r][c].block;
        if(b) owned.push({block:b,status:'board'});
      }
    }
    const propOrder={wood:0,stone:1,gold:2,steel:3,glass:4};
    const enhOrder={holo:0,spark:1,invert:2};
    owned.sort((a,b)=>{
      const ba=a.block, bb=b.block;
      return ({straight:0,L:1,T:2,plus:3}[ba.type]-{straight:0,L:1,T:2,plus:3}[bb.type])
        || (!!ba.property-!!bb.property)
        || (!!ba.enhancement-!!bb.enhancement)
        || ((propOrder[ba.property]??99)-(propOrder[bb.property]??99))
        || ((enhOrder[ba.enhancement]??99)-(enhOrder[bb.enhancement]??99));
    });
    return owned;
  }

  function applyPowerPick(opt, targets){
    const def=POWER_CARD_DEFS[opt.defId];
    if(!def) return false;
    if(def.targetCount===0){ def.use([]); return true; }
    const minTargets = def.targetMinCount ?? def.targetCount;
    const maxTargets = def.targetCount;
    if(!targets || targets.length<minTargets || targets.length>maxTargets) return false;
    if(def.targetKind==='swap'){
      if(targets.length!==2 || targets[0]?.kind!==targets[1]?.kind) return false;
    } else if(!targets.every(t=>targetKindMatches(def,t.kind))) {
      return false;
    }
    def.use(targets);
    rememberLastUsedCard(def);
    syncBallMutationTargets(targets);
    renderBallQueue();
    return true;
  }

    } else if(g.type==='upgrade'){
      g.options.forEach((opt,i)=>{
        const el=document.createElement('div'); el.className='gacha-opt'; el.innerHTML=upgradeOptionLabel(opt);
        const def=UPGRADE_POOL.find(x=>x.id===opt.defId);
        if(def) attachCardTooltip(el, def);
        el.addEventListener('click',()=>{
          stateUi.selected = stateUi.selected.includes(i) ? [] : [i];
          optionsWrap.querySelectorAll('.gacha-opt').forEach((n,j)=>n.classList.toggle('selected',j===stateUi.selected[0]));
          accept.disabled=!stateUi.selected.length; accept.textContent=`Nâng cấp${g.tier.picks>1?` (${(g.upgradesUsed||0)+1}/${g.tier.picks})`:''}`;
        });
        optionsWrap.appendChild(el);
      });
      panel.appendChild(optionsWrap);
    } else if(g.type==='ball'){
      const note=document.createElement('div'); note.className='gacha-choice-section';
      const max=BASE_MAX_BALLS + state.maxBallsBonus;
      if(state.ballPool.length < max){
        const ownedWrap=document.createElement('div'); ownedWrap.className='ball-choice-grid';
        state.ballPool.forEach((b,i)=>{ const e=document.createElement('div'); e.className='ball-choice-item gacha-owned-ball'; e.innerHTML=ballOptionLabel(b); markDebugTarget(e,b,'ball'); attachObjectTooltip(e,b,'ball'); ownedWrap.appendChild(e); });
        note.appendChild(ownedWrap);
        registerGachaBallView(ownedWrap,()=>state.ballPool);
        panel.appendChild(note);
        const free=max-state.ballPool.length;
        g.options.forEach((opt,i)=>{
          const el=document.createElement('div'); el.className='ball-choice-item'; el.innerHTML=ballOptionLabel(opt);
          markDebugTarget(el,opt,'ball');
          attachObjectTooltip(el, opt, 'ball');
          el.addEventListener('click',()=>{
            if(stateUi.selected.includes(i)) stateUi.selected=stateUi.selected.filter(x=>x!==i);
            else if(stateUi.selected.length<Math.min(g.tier.picks,free)) stateUi.selected.push(i);
            optionsWrap.querySelectorAll('.ball-choice-item').forEach((n,j)=>n.classList.toggle('selected',stateUi.selected.includes(j)));
            accept.disabled=!stateUi.selected.length;
            accept.textContent=`Nhận (${stateUi.selected.length}/${Math.min(g.tier.picks,free)})`;
          });
          optionsWrap.appendChild(el);
        });
      } else {
        const ownedWrap=document.createElement('div'); ownedWrap.className='ball-choice-grid';
        state.ballPool.forEach((b,i)=>{ const e=document.createElement('div'); e.className='ball-choice-item gacha-owned-ball'; e.innerHTML=ballOptionLabel(b); markDebugTarget(e,b,'ball'); attachObjectTooltip(e,b,'ball'); e.addEventListener('click',()=>{ stateUi.ownedIndex=i; ownedWrap.querySelectorAll('.gacha-owned-ball').forEach((n,j)=>n.classList.toggle('selected',j===i)); accept.disabled=stateUi.selected.length!==1 || stateUi.ownedIndex===null; }); ownedWrap.appendChild(e); });
        note.appendChild(ownedWrap);
        registerGachaBallView(ownedWrap,()=>state.ballPool);
        panel.appendChild(note);
        g.options.forEach((opt,i)=>{
          const el=document.createElement('div'); el.className='ball-choice-item'; el.innerHTML=ballOptionLabel(opt);
          markDebugTarget(el,opt,'ball');
          attachObjectTooltip(el, opt, 'ball');
          el.addEventListener('click',()=>{ stateUi.selected=[i]; optionsWrap.querySelectorAll('.ball-choice-item').forEach((n,j)=>n.classList.toggle('selected',j===i)); accept.disabled=stateUi.ownedIndex===null; });
          optionsWrap.appendChild(el);
        });
      }
      optionsWrap.className='ball-choice-grid';
      const h3=document.createElement('div'); h3.className='gacha-choice-section'; h3.innerHTML='<h3>Bóng trong hộp gacha</h3>';
      h3.appendChild(optionsWrap); panel.appendChild(h3);
      registerGachaBallView(optionsWrap,()=>g.options);
    } else {
      const targets=randomBagBlocks(5);
      g.powerTargets=targets;
      const targetSec=document.createElement('div'); targetSec.className='gacha-choice-section gacha-power-targets';
      const targetWrap=document.createElement('div'); targetWrap.className='gacha-block-options gacha-power-block-options';
      targets.forEach((b,i)=>{
        const e=document.createElement('div');
        e.className='gacha-block-choice';
        e.innerHTML=gachaBlockChoiceLabel(b);
        markDebugTarget(e,b,'block');
        attachObjectTooltip(e,b,'block');
        e.addEventListener('click',()=>{
          if(!stateUi.targeting.some(x=>x.obj===b)){
            if(stateUi.targeting.length>=2) return;
            stateUi.targeting.push({obj:b,kind:'block'});
          } else {
            stateUi.targeting=stateUi.targeting.filter(x=>x.obj!==b);
          }
          targetWrap.querySelectorAll('.gacha-block-choice').forEach((n,j)=>n.classList.toggle('selected',stateUi.targeting.some(x=>x.obj===targets[j])));
          updatePowerAccept();
        });
        targetWrap.appendChild(e);
      });
      targetSec.appendChild(targetWrap); panel.appendChild(targetSec);

      const ballSec=document.createElement('div'); ballSec.className='gacha-choice-section gacha-power-owned-balls';
      const ballWrap=document.createElement('div'); ballWrap.className='ball-choice-grid';
      state.ballPool.forEach((b)=>{ const e=document.createElement('div'); e.className='ball-choice-item'; e.innerHTML=ballOptionLabel(b); attachObjectTooltip(e,b,'ball'); e.addEventListener('click',()=>{ if(!stateUi.targeting.some(x=>x.obj===b)){ stateUi.targeting.push({obj:b,kind:'ball'}); } else { stateUi.targeting=stateUi.targeting.filter(x=>x.obj!==b); } ballWrap.querySelectorAll('.ball-choice-item').forEach((n,j)=>n.classList.toggle('selected',stateUi.targeting.some(x=>x.obj===state.ballPool[j]))); updatePowerAccept(); }); ballWrap.appendChild(e); });
      ballSec.appendChild(ballWrap); panel.appendChild(ballSec);
      registerGachaBallView(ballWrap,()=>state.ballPool);

      const cardSec=document.createElement('div'); cardSec.className='gacha-choice-section'; cardSec.innerHTML='<h3>Thẻ sức mạnh</h3>';
      const cardWrap=document.createElement('div'); cardWrap.className='gacha-choice-options';
      g.options.forEach((opt,i)=>{ const e=document.createElement('div'); e.className='gacha-opt'; e.innerHTML=powerOptionLabel(opt); const def=POWER_CARD_DEFS[opt.defId]; if(def) attachCardTooltip(e, def); e.addEventListener('click',()=>{ if(stateUi.usedOptions?.includes(i)) return; stateUi.selected=[i]; stateUi.targeting=[]; targetWrap.querySelectorAll('.gacha-opt').forEach(n=>n.classList.remove('selected')); ballWrap.querySelectorAll('.ball-choice-item').forEach(n=>n.classList.remove('selected')); cardWrap.querySelectorAll('.gacha-opt').forEach((n,j)=>{ n.classList.toggle('selected',j===i); n.classList.toggle('disabled',stateUi.usedOptions?.includes(j)); }); updatePowerAccept(); }); cardWrap.appendChild(e); });
      cardSec.appendChild(cardWrap); panel.appendChild(cardSec);

      function updatePowerAccept(){
        const opt=g.options[stateUi.selected[0]];
        if(!opt){ accept.disabled=true; accept.textContent=`Dùng thẻ (${g.powerUsed||0}/${g.tier.picks})`; return; }
        const def=POWER_CARD_DEFS[opt.defId];
        if(def.targetCount===0){ accept.disabled=false; accept.textContent=`Dùng: ${def.name}`; return; }
        if(def.targetKind==='swap'){
          accept.disabled=stateUi.targeting.length!==2 || stateUi.targeting[0].kind!==stateUi.targeting[1].kind;
        } else {
          accept.disabled=stateUi.targeting.length<(def.targetMinCount||def.targetCount) || stateUi.targeting.length>def.targetCount || !stateUi.targeting.every(t=>targetKindMatches(def,t.kind));
        }
        accept.textContent=`Dùng: ${def.name}`;
      }
      panel._updatePowerAccept=updatePowerAccept;
    }

    const actions=document.createElement('div'); actions.className='gacha-choice-actions';
    const skipBtn=document.createElement('button'); skipBtn.className='skip'; skipBtn.textContent='Bỏ qua'; skipBtn.addEventListener('click',skip);
    const accept=document.createElement('button'); accept.className='gold'; accept.textContent='Nhận'; accept.disabled=true;
    accept.addEventListener('click',()=>{
      if(g.type==='block'){
        stateUi.selected.forEach(i=>applyBlockPick(g.options[i]));
        finish();
      } else if(g.type==='upgrade'){
        const opt = g.options[stateUi.selected[0]];
        if(opt) applyUpgradePick(opt);
        g.upgradesUsed=(g.upgradesUsed||0)+1;
        if(g.upgradesUsed>=g.tier.picks){ finish(); return; }
        stateUi.selected=[];
        optionsWrap.querySelectorAll('.gacha-opt').forEach(n=>n.classList.remove('selected'));
        accept.disabled=true;
        accept.textContent=`Nâng cấp (${g.upgradesUsed}/${g.tier.picks})`;
      } else if(g.type==='ball'){
        if(state.ballPool.length < BASE_MAX_BALLS + state.maxBallsBonus){
          stateUi.selected.forEach(i=>addBallToPool(g.options[i]));
        } else if(stateUi.selected.length===1 && stateUi.ownedIndex!==null){
          replaceBallInPool(stateUi.ownedIndex,g.options[stateUi.selected[0]]);
        }
        syncBallQueueFromPool();
        refreshOpenShop();
        finish();
      } else if(g.type==='power'){
        const opt=g.options[stateUi.selected[0]];
        if(!opt) return;
        const applied = applyPowerPick(opt, stateUi.targeting || []);
        if(!applied){
          if(panel._updatePowerAccept) panel._updatePowerAccept();
          return;
        }
        syncBallQueueFromPool();
        g.powerUsed=(g.powerUsed||0)+1;
        if(stateUi.selected.length) stateUi.usedOptions.push(stateUi.selected[0]);
        if(g.powerUsed>=g.tier.picks){ finish(); return; }
        stateUi.selected=[]; stateUi.targeting=[];
        panel.querySelectorAll('.gacha-choice-section .gacha-opt, .gacha-choice-section .ball-choice-item').forEach(n=>n.classList.remove('selected'));
        cardWrap.querySelectorAll('.gacha-opt').forEach((n,j)=>n.classList.toggle('disabled',stateUi.usedOptions.includes(j)));
        accept.disabled=true; accept.textContent=`Dùng thẻ (${g.powerUsed}/${g.tier.picks})`;
        if(panel._updatePowerAccept) panel._updatePowerAccept();
      }
    });
    actions.appendChild(skipBtn); actions.appendChild(accept); panel.appendChild(actions);

    activeRefreshGachaBalls=()=>{
      gachaBallViews.forEach(({wrap,getBalls})=>{
        const balls=getBalls();
        [...wrap.children].forEach((el,i)=>{
          const ball=balls[i];
          if(!ball) return;
          el.innerHTML=ballOptionLabel(ball);
          el.__debugTarget={el,obj:ball,kind:'ball'};
          if(!el.__gachaTooltipAttached){
            attachObjectTooltip(el,ball,'ball');
            el.__gachaTooltipAttached=true;
          }
        });
      });
    };
    if(g.type==='power' && panel._updatePowerAccept) panel._updatePowerAccept();
    gachaOverlayEl.appendChild(panel);
    refreshOpenGachaBalls();
    gachaOverlayEl.classList.remove('hidden');
  }

  function makeCommonItem(){
    const kind=pick(['upgrade','power','block']);
    if(kind==='upgrade'){ const def=pick(UPGRADE_POOL); return {kind,ref:{defId:def.id},name:def.name,desc:def.desc,price:def.cost}; }
    if(kind==='power'){ const def=pick(Object.values(POWER_CARD_DEFS)); return {kind,ref:{defId:def.id},name:def.name,desc:def.desc,price:def.cost}; }
    if(kind==='block'){ const b=specialBlock(); return {kind,ref:b,name:TYPE_LABEL[b.type],desc:(b.property?PROP_LABEL[b.property]:'')+(b.property&&b.enhancement?' · ':'')+(b.enhancement?ENH_LABEL[b.enhancement]:''),price:blockPrice(b)}; }
  }
  function makeCommonStock(){ return Array.from({length:2+Math.floor(Math.random()*2)}, makeCommonItem); }
  function makeGachaBox(){
    const type=pick(['block','ball','power','upgrade']), tier=pick(GACHA_TIERS);
    return {id:cardUid(),type,tier,options:null,selected:[],done:false};
  }
  function makeGachaStock(){ return Array.from({length:1+Math.floor(Math.random()*2)}, makeGachaBox); }

  function applyCommonItem(item){
    if(item.kind==='upgrade'){ const d=UPGRADE_POOL.find(x=>x.id===item.ref.defId); d.apply(); state.lastUpgrade=d; }
    else if(item.kind==='power'){ if(state.cardHand.length>=getMaxCardHand()) return false; state.cardHand.push({id:cardUid(),kind:item.kind,defId:item.ref.defId}); }
    else if(item.kind==='block') state.pendingBlocks.push({...item.ref});
    else state.nextBallPreset={...item.ref};
    return true;
  }

  function rerollShop(){
    if(state.money<state.commonRerollCost) return;
    state.money-=state.commonRerollCost;
    state.commonRerollCost++;
    state.commonItems=makeCommonStock();
    moneyValEl.textContent=formatMoney(state.money);
    renderShop();
    scheduleAutoSave();
  }

  function buyCommonShop(item){
    if(item.bought || state.money < shopPrice(item.price)) return;
    if((item.kind==='upgrade'||item.kind==='power') && state.cardHand.length>=getMaxCardHand()) return;

    if(item.kind==='upgrade' || item.kind==='power'){
      state.cardHand.push({id:cardUid(),kind:item.kind,defId:item.ref.defId});
    } else if(!applyCommonItem(item)) {
      return;
    }

    state.money-=shopPrice(item.price);
    item.bought=true;
    moneyValEl.textContent=formatMoney(state.money);
    render();
    refreshOpenShop();
    scheduleAutoSave();
  }

  function useCommonShop(item){
    if(item.bought || state.money < shopPrice(item.price)) return;
    if(item.kind!=='power' && item.kind!=='upgrade') return;

    const def = item.kind==='power' ? POWER_CARD_DEFS[item.ref.defId] : UPGRADE_POOL.find(x=>x.id===item.ref.defId);
    if(!def) return;
    if(item.kind==='power' && state.cardHand.length>=getMaxCardHand()) return;

    const handIdx=state.cardHand.length;
    state.cardHand.push({id:cardUid(),kind:item.kind,defId:def.id});
    state.money-=shopPrice(item.price);
    item.bought=true;
    moneyValEl.textContent=formatMoney(state.money);

    render();
    activateCardFromHand(handIdx, def);
    refreshOpenShop();
    scheduleAutoSave();
  }

  function renderGachaBoxShop(g){
    const box=document.createElement('div'); box.className='gacha-box';
    const names={block:'Hộp khối',ball:'Hộp bóng',power:'Hộp thẻ sức mạnh',upgrade:'Hộp thẻ nâng cấp'};
    if(g.done){
      box.innerHTML=`<div class="gacha-head"><span>${names[g.type]} ${g.tier.label.toLowerCase()}</span></div><div class="tag-done">Đã dùng</div>`;
      return box;
    }
    box.innerHTML=`<div class="shop-price">${formatMoney(shopPrice(gachaPrice(g.type, g.tier)))}</div><div class="shop-item-name">${names[g.type]} ${g.tier.label}</div>`;
    const actions=document.createElement('div'); actions.className='shop-item-actions';
    const gachaCost=shopPrice(gachaPrice(g.type, g.tier));
    const buy=document.createElement('button'); buy.textContent='Mở hộp'; buy.disabled=state.money<gachaCost; buy.addEventListener('click',()=>{
      state.money-=gachaCost;
      moneyValEl.textContent=formatMoney(state.money);
      g.done=true;
      g.options=g.type==='block'?genBlockOptions(g.tier):g.type==='ball'?genBallOptions(g.tier):g.type==='power'?genPowerOptions(g.tier):genUpgradeOptions(g.tier);
      renderShop();
      showGachaChoice(g);
      scheduleAutoSave();
    });
    actions.appendChild(buy);
    box.appendChild(actions);
    return box;
  }

  function positionShopPanel(panel){
    const anchor=ballQueueEl.getBoundingClientRect();
    const top=Math.max(8, anchor.bottom + 10);
    panel.style.top=`${Math.round(top)}px`;
    panel.style.maxHeight=`calc(100dvh - ${Math.round(top)}px - 16px)`;
  }

  function renderShop(){
    if(!state) return;
    syncBallQueueFromPool();
    shopOverlayEl.innerHTML='';
    const panel=document.createElement('div'); panel.className='shop-panel';
    panel.innerHTML=`<h2 class="shop-title">CỬA HÀNG</h2>`;
    positionShopPanel(panel);
    if(state.targeting) panel.classList.add('targeting-pass-through');

    const common=document.createElement('div'); common.className='shop-section'; common.innerHTML='<h3>Hàng hóa chung</h3>';
    const commonGrid=document.createElement('div'); commonGrid.className='shop-common-grid';
    state.commonItems.forEach(item=>{
      const row=document.createElement('div'); row.className='shop-card';
      const price=document.createElement('div'); price.className='shop-price price'; price.textContent=formatMoney(shopPrice(item.price));
      row.appendChild(price);

      const visual=document.createElement('div'); visual.className='shop-item-visual';
      if(item.kind==='block'){
        const blockVisual=document.createElement('div');
        blockVisual.innerHTML=renderMiniBlockMarkup(item.ref);
        markDebugTarget(blockVisual, item.ref, 'block');
        attachObjectTooltip(blockVisual, item.ref, 'block');
        visual.appendChild(blockVisual);
      } else {
        const name=document.createElement('div'); name.className='shop-item-name'; name.textContent=item.name;
        visual.appendChild(name);
      }
      if(item.kind==='power') attachCardTooltip(visual, POWER_CARD_DEFS[item.ref.defId]);
      if(item.kind==='upgrade') attachCardTooltip(visual, UPGRADE_POOL.find(x=>x.id===item.ref.defId));
      row.appendChild(visual);

      const actions=document.createElement('div'); actions.className='shop-item-actions';
      const buy=document.createElement('button'); buy.textContent=item.bought?'Đã mua':'Mua';
      buy.disabled=item.bought||state.money<shopPrice(item.price)||((item.kind==='power'||item.kind==='upgrade')&&state.cardHand.length>=getMaxCardHand());
      buy.addEventListener('click',()=>buyCommonShop(item));
      actions.appendChild(buy);
      if(item.kind==='power'||item.kind==='upgrade'){
        const use=document.createElement('button'); use.className='use-btn'; use.textContent='Dùng';
        use.disabled=item.bought||state.money<shopPrice(item.price)||(item.kind==='power'&&state.cardHand.length>=getMaxCardHand());
        use.addEventListener('click',()=>useCommonShop(item));
        actions.appendChild(use);
      }
      row.appendChild(actions);
      commonGrid.appendChild(row);
    });
    common.appendChild(commonGrid);
    const rr=document.createElement('div'); rr.style.cssText='display:flex;justify-content:center;margin-top:8px;';
    const rb=document.createElement('button'); rb.textContent=`Đổi hàng (${formatMoney(state.commonRerollCost)})`;
    rb.disabled=state.money<state.commonRerollCost;
    rb.addEventListener('click',rerollShop);
    rr.appendChild(rb); common.appendChild(rr); panel.appendChild(common);

    const lower=document.createElement('div'); lower.className='shop-lower';
    const buff=document.createElement('div'); buff.className='shop-section'; buff.innerHTML='<h3>Thẻ buff</h3>';
    const br=document.createElement('div'); br.className='shop-card';
    const bo=state.shopBuff;
    const buffCost=bo.id==='discount'?bo.cost:shopPrice(bo.cost);
    br.innerHTML=`<div class="shop-price">$${buffCost}</div><div class="desc"><span class="name">${bo.name}</span>${bo.desc}</div>`;
    const buffActions=document.createElement('div'); buffActions.className='shop-item-actions';
    const bb=document.createElement('button'); bb.textContent=bo.bought?'Đã mua':'Mua'; bb.disabled=bo.bought||state.money<buffCost;
    bb.addEventListener('click',()=>{
      state.money-=buffCost;
      bo.apply();
      bo.bought=true;
      markBuffOwned(bo.id);
      state.shopBuffBought=true;
      moneyValEl.textContent=formatMoney(state.money);
      renderShop();
      scheduleAutoSave();
    });
    buffActions.appendChild(bb); br.appendChild(buffActions); buff.appendChild(br); lower.appendChild(buff);

    const gach=document.createElement('div'); gach.className='shop-section'; gach.innerHTML='<h3>Các hộp gacha</h3>';
    const gachGrid=document.createElement('div'); gachGrid.className='shop-gacha-grid';
    state.gachaStock.forEach(g=>gachGrid.appendChild(renderGachaBoxShop(g)));
    gach.appendChild(gachGrid); lower.appendChild(gach); panel.appendChild(lower);

    const cont=document.createElement('div'); cont.className='shop-continue';
    const cb=document.createElement('button'); cb.className='gold'; cb.textContent=`→ Màn ${formatNumber(state.level+1)}`;
    cb.addEventListener('click',()=>{
      if(cb.dataset.busy==='1') return;
      cb.dataset.busy='1';
      state.commonItems=null;
      state.gachaStock=null;
      state.commonRerollCost=3;
      newLevel();
    });
    cont.appendChild(cb); panel.appendChild(cont);
    shopOverlayEl.appendChild(panel);
  }

  function openShop(){
    if(!state.commonItems) state.commonItems=makeCommonStock();
    if(!state.gachaStock) state.gachaStock=makeGachaStock();
    if(!state.shopBuff) state.shopBuff={...pickAvailableBuff(),bought:false};
    activeRenderShop = renderShop;
    shopOverlayEl.classList.remove('hidden');
    shopOverlayEl.classList.remove('targeting-pass-through');
    cardHandEl.classList.add('shop-active');
    renderShop();
  }

  // ---------- persistence boot / lifecycle ----------
  window.addEventListener('pagehide', flushAutoSave);
  window.addEventListener('beforeunload', flushAutoSave);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'hidden') flushAutoSave();
  });

  // Catch state mutations that use renderShop()/render() paths we don't explicitly hook.
  setInterval(()=>{
    if(state && !state.resolving) saveGame({silent:true});
  }, 2500);

  if(!loadGame()){
    newRun();
  } else {
  }
})();
</script>
</body>
</html>
