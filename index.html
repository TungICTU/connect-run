<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>connect run</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --anim-speed: 1;
    --bg: #0a1a2c;
    --bg-deep: #071322;
    --panel: #0f2440;
    --panel-line: rgba(94,200,216,0.14);
    --ink: #e9eef5;
    --ink-dim: #8fa8bf;
    --amber: #f2a65a;
    --amber-dim: rgba(242,166,90,0.35);
    --cyan: #5ec8d8;
    --cyan-dim: rgba(94,200,216,0.35);
    --green: #6fcf97;
    --red: #e85d4e;
    --gold: #f2c94c;
    --cell-gap: 4px;
  }

  *{ box-sizing: border-box; }

  /* Custom scrollbars — keep every scrollable surface consistent with the game's UI. */
  *{
    scrollbar-width: thin;
    scrollbar-color: rgba(94,200,216,.45) rgba(255,255,255,.035);
  }
  *::-webkit-scrollbar{ width:8px; height:8px; }
  *::-webkit-scrollbar-track{ background:rgba(255,255,255,.035); border-radius:999px; }
  *::-webkit-scrollbar-thumb{
    background:rgba(94,200,216,.45);
    border:2px solid transparent;
    background-clip:padding-box;
    border-radius:999px;
  }
  *::-webkit-scrollbar-thumb:hover{ background:rgba(94,200,216,.7); border:2px solid transparent; background-clip:padding-box; }
  *::-webkit-scrollbar-corner{ background:transparent; }


  html,body{
    margin:0; padding:0;
    background:
      radial-gradient(circle at 20% 10%, rgba(94,200,216,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(242,166,90,0.05), transparent 45%),
      var(--bg);
    color: var(--ink);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    min-height: 100vh;
  }

  body{ display:flex; flex-direction:column; align-items:center; padding: 18px 12px 40px; gap: 12px; }

  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--panel-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--panel-line) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events:none; opacity:0.5; z-index:0;
  }

  .app{
    position:relative; z-index:1; width:100%; max-width: 520px;
    display:flex; flex-direction:column; align-items:center; gap:12px;
  }

  header.hud{
    width:100%; background: var(--panel);
    border: 1px solid var(--panel-line); border-radius: 10px;
    padding: 12px 16px;
    display:flex; flex-wrap: wrap; align-items:center; justify-content: space-between;
    gap: 8px 16px;
  }

  .logo{
    font-family:'JetBrains Mono', monospace; font-weight:700; letter-spacing: 2px; font-size: 14px;
    color: var(--cyan); text-shadow: 0 0 10px var(--cyan-dim); white-space: nowrap;
  }

  .stats{ display:flex; gap: 14px; flex-wrap: wrap; }
  .stat{ display:flex; flex-direction:column; gap:1px; }
  .stat .label{ font-size: 9px; letter-spacing: 1px; color: var(--ink-dim); text-transform: uppercase; }
  .stat .value{ font-family:'JetBrains Mono', monospace; font-size: 15px; font-weight:600; }
  .stat.score .value{ color: var(--amber); }
  .stat.target .value{ color: var(--ink); }
  .stat.money .value{ color: var(--gold); }
  .stat.level .value{ color: var(--ink); }

  button{
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size: 13px;
    border-radius: 7px; border: 1px solid var(--cyan-dim);
    background: rgba(94,200,216,0.08); color: var(--cyan);
    padding: 7px 12px; cursor:pointer; transition: background .15s, transform .1s;
  }
  button:hover{ background: rgba(94,200,216,0.18); }
  button:active{ transform: scale(0.96); }
  /* Shop controls should not visually 'pop' while being used. */
  .shop-layer button:active{ transform:none; }
  button:focus-visible{ outline: 2px solid var(--cyan); outline-offset:2px; }
  button:disabled{ opacity:0.32; cursor:not-allowed; }
  button.gold{ border-color: rgba(242,201,76,0.4); color: var(--gold); background: rgba(242,201,76,0.08); }
  button.gold:hover{ background: rgba(242,201,76,0.18); }

  .speed-control{ display:flex; align-items:center; gap:6px; }
  .speed-control .speed-label{ font-size:9px; letter-spacing:1px; color:var(--ink-dim); text-transform:uppercase; }
  .speed-control select{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px;
    border-radius:7px; border:1px solid var(--cyan-dim);
    background:rgba(94,200,216,0.08); color:var(--cyan);
    padding:6px 8px; cursor:pointer;
  }
  .speed-control select:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }

  .ball-queue{ display:flex; gap: 8px; flex-wrap: wrap; justify-content:center; position:relative; z-index:110; }
  .ball-chip{
    width: 28px; height:28px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--amber) 65%);
    box-shadow: 0 0 8px 2px var(--amber-dim);
    overflow:hidden;
    position:relative; display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace; font-size: 8px; font-weight:700; color: #0a1a2c;
    cursor: default;
  }
  .ball-chip.fired{ background: rgba(255,255,255,0.06); box-shadow:none; color: var(--ink-dim); opacity: 0.5; }
  .ball-chip[data-prop]:not(.fired){ box-shadow:0 0 0 1px var(--prop-color); }
  .ball-chip[data-prop=steel]:not(.fired){ background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.8) 0 2px,transparent 22%),#c7cdd3; box-shadow:0 0 7px rgba(255,255,255,.18); }
  .ball-chip[data-prop=stone]:not(.fired){ background:#777; background-image:radial-gradient(circle at 34% 28%,rgba(255,255,255,.8) 0 2px,transparent 22%),radial-gradient(circle at 20% 30%,rgba(255,255,255,.2) 0 1px,transparent 1px),radial-gradient(circle at 70% 65%,rgba(0,0,0,.22) 0 1px,transparent 1px); background-size:auto,7px 6px,8px 7px; box-shadow:0 0 7px rgba(255,255,255,.12); }
  .ball-chip[data-prop=gold]:not(.fired){ background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.8) 0 2px,transparent 22%),#f2c94c; box-shadow:0 0 7px rgba(242,201,76,.3); }
  .ball-chip[data-prop=wood]:not(.fired){ background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.78) 0 2px,transparent 22%),#b8895a; box-shadow:0 0 7px rgba(255,255,255,.12); }
  .ball-chip[data-prop=glass]:not(.fired){ background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.82) 0 2px,transparent 22%),transparent; border:1px solid rgba(255,255,255,.95); box-shadow:0 0 8px rgba(255,255,255,.2); overflow:hidden; }
  .ball-chip[data-prop=glass]:not(.fired)::after{ content:""; position:absolute; inset:1px; border-radius:50%; pointer-events:none; background:linear-gradient(120deg,transparent 25%,rgba(255,255,255,.7) 45%,transparent 58%); }
  .ball-chip[data-prop=striped]:not(.fired){ background:#c94848; background-image:radial-gradient(circle at 34% 28%,rgba(255,255,255,.8) 0 2px,transparent 22%),repeating-linear-gradient(135deg,rgba(255,255,255,.16) 0 3px,transparent 3px 7px); box-shadow:0 0 7px rgba(255,255,255,.12); }
  .ball-chip[data-prop=grid]:not(.fired){ background:#3976b9; background-image:radial-gradient(circle at 34% 28%,rgba(255,255,255,.8) 0 2px,transparent 22%),linear-gradient(rgba(255,255,255,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.2) 1px,transparent 1px); background-size:auto,6px 6px,6px 6px; box-shadow:0 0 7px rgba(255,255,255,.12); }
  .ball-chip[data-enh=holo]:not(.fired){ box-shadow:0 0 0 1px rgba(47,128,237,.7); }
  .ball-chip[data-enh=holo]:not(.fired)::before{ content:""; position:absolute; inset:0; border-radius:50%; pointer-events:none; background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.78) 0 1px,rgba(255,255,255,.08) 1px 6px); }
  .ball-chip::after{ content:""; position:absolute; inset:0; border-radius:50%; pointer-events:none; background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.78) 0%,rgba(255,255,255,.32) 16%,transparent 42%); }
  .ball-chip[data-prop=glass]:not(.fired)::after{ background:linear-gradient(120deg,transparent 25%,rgba(255,255,255,.72) 45%,transparent 58%); }
  .ball-chip[data-enh=invert]:not(.fired){ filter:invert(1); }
  .ball-chip.targetable{ cursor:pointer; animation: targetPulse calc(1s / var(--anim-speed)) ease-in-out infinite; }
  .ball-queue .ball-chip:not(.fired){ cursor:grab; }
  .ball-queue .ball-chip:not(.fired):active{ cursor:grabbing; }
  .ball-chip.ball-drop-hover{ box-shadow:0 0 0 2px var(--cyan),0 0 9px rgba(94,200,216,.55) !important; }
  .ball-chip.click-selected{ box-shadow:0 0 0 2px var(--green),0 0 11px rgba(111,207,151,.6) !important; }
  .ball-chip.shop-ball-preview{ width:34px; height:34px; font-size:9px; }
  .gacha-opt .ball-chip.shop-ball-preview{ margin:0 auto 6px; }
  .ball-drag-ghost{ position:fixed; width:34px; height:34px; pointer-events:none; z-index:160; opacity:.95; transform:translate(-50%,-50%); filter:drop-shadow(0 16px 22px rgba(0,0,0,.5)); }
  @keyframes ballMoveIn{ from{ transform:translate(var(--from-x),var(--from-y)) scale(1.08); opacity:.82; } to{ transform:translate(0,0) scale(1); opacity:1; } }
  @keyframes targetPulse{ 0%,100%{ box-shadow:0 0 0 2px var(--green),0 0 8px 2px var(--green);} 50%{ box-shadow:0 0 0 2px var(--green),0 0 14px 6px var(--green);} }

  .card-hand{ width:100%; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .card-hand.shop-active{ position:relative; z-index:101; pointer-events:auto; }
  .power-card-chip{
    display:flex; align-items:center; gap:8px;
    background: var(--panel); border:1px solid var(--panel-line); border-radius:7px;
    padding:6px 10px; font-size:12px;
  }
  .power-card-chip .name{ color:var(--cyan); font-weight:600; }
  .power-card-chip .card-actions{ display:flex; align-items:center; gap:6px; }
  .power-card-chip .sell-card-btn{ border-color:rgba(232,93,78,.45); color:var(--red); background:rgba(232,93,78,.08); }
  .power-card-chip .sell-card-btn:hover{ background:rgba(232,93,78,.16); }
  .card-hand .tag-empty{ font-size:11px; color:var(--ink-dim); }

  .target-banner{
    position:fixed; top:10px; left:50%; transform:translateX(-50%);
    background: var(--panel); border:1px solid var(--amber-dim); border-radius:8px;
    padding:8px 14px; display:flex; align-items:center; gap:10px;
    font-size:13px; color:var(--amber); z-index: 210; pointer-events:auto; box-shadow:0 4px 20px rgba(0,0,0,0.4);
  }
  .target-banner.hidden{ display:none; }

  .board-wrap{ position:relative; width: min(92vw, 460px); aspect-ratio: 1 / 1; }

  .discard-row{ display:flex; justify-content:center; align-items:center; gap:8px; }
  .discard-btn{ border-color:var(--red); color:var(--red); }
  .discard-btn:disabled{ opacity:.4; cursor:not-allowed; }

  .board{
    position:relative; z-index:1; width:100%; height:100%; display:grid; gap: var(--cell-gap);
    background: var(--bg-deep); border: 1px solid var(--panel-line); border-radius: 10px;
    padding: var(--cell-gap); box-shadow: inset 0 0 30px rgba(0,0,0,0.4);
  }

  @keyframes placeIn{
    0%{ transform: scale(0.4) rotate(var(--place-deg,0deg)); opacity:0.2; }
    65%{ transform: scale(1.15) rotate(var(--place-deg,0deg)); opacity:1; }
    100%{ transform: scale(1) rotate(var(--place-deg,0deg)); opacity:1; }
  }
  .cell.just-placed .block-visual{ animation: placeIn calc(.32s / var(--anim-speed)) cubic-bezier(.34,1.56,.64,1); }

  .cell{
    position:relative; background: rgba(255,255,255,0.02);
    border: 1px dashed rgba(94,200,216,0.12); border-radius: 5px; touch-action: none;
  }
  .cell.board-reveal-cell{
    opacity:0;
    transform:scale(.02) rotate(var(--reveal-rotate, 0deg));
    transform-origin:center center;
    animation:boardCellReveal calc(.22s / var(--anim-speed)) cubic-bezier(.22,.9,.24,1.18) var(--reveal-delay,0ms) forwards;
  }
  @keyframes boardCellReveal{
    0%{ opacity:0; transform:scale(.02) rotate(var(--reveal-rotate, 0deg)); }
    68%{ opacity:1; transform:scale(1.08) rotate(calc(var(--reveal-rotate, 0deg) * .35)); }
    100%{ opacity:1; transform:scale(1) rotate(0deg); }
  }
  .board.board-reveal-running{ pointer-events:none; }
  .cell.board-hide-cell{
    opacity:1;
    transform:scale(1) rotate(0deg);
    transform-origin:center center;
    animation:boardCellHide calc(.22s / var(--anim-speed)) cubic-bezier(.55,.08,.68,.53) var(--hide-delay,0ms) forwards;
  }
  @keyframes boardCellHide{
    0%{ opacity:1; transform:scale(1) rotate(0deg); }
    32%{ opacity:1; transform:scale(1.06) rotate(calc(var(--hide-rotate, 0deg) * .35)); }
    100%{ opacity:0; transform:scale(.02) rotate(var(--hide-rotate, 0deg)); }
  }
  .board.board-hide-running{ pointer-events:none; }
  .cell.empty.drop-hover,.cell.hasblock.drop-hover{ background: rgba(94,200,216,0.14); border-color: var(--cyan); }
  .cell.hasblock{ cursor: grab; border-style: solid; border-color: rgba(94,200,216,0.08); }
  .cell.hasblock:active{ cursor: grabbing; }
  .cell.targetable{ cursor:pointer; animation: cellTargetPulse calc(1s / var(--anim-speed)) ease-in-out infinite; }
  @keyframes cellTargetPulse{ 0%,100%{ box-shadow:inset 0 0 0 2px var(--green);} 50%{ box-shadow:inset 0 0 0 2px var(--green), 0 0 10px var(--green);} }

  .cell.blocked-flash{ animation: flashRed calc(.4s / var(--anim-speed)) ease; }
  @keyframes flashRed{ 0%,100%{ background: rgba(255,255,255,0.02); } 40%{ background: rgba(232,93,78,0.35); } }
  .cell.black-block{
    background: #050505;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: inset 0 0 16px rgba(0,0,0,.95);
    cursor: not-allowed;
  }
  .cell.black-block::after{
    content:""; position:absolute; inset:13%; border-radius:4px;
    background:radial-gradient(circle,rgba(255,255,255,.035),transparent 68%);
    pointer-events:none;
  }

  .block-visual{ position:absolute; inset:0; transition: transform calc(.28s / var(--anim-speed)) cubic-bezier(.34,1.56,.64,1); transform-origin: 50% 50%; }
  .arm{ position:absolute; background: var(--cyan); box-shadow: 0 0 7px var(--cyan-dim); border-radius: 3px; }

  /* Mini-blocks use the same property/enhancement appearance as board blocks. */
  .mini-block[data-prop=steel] .arm, .mini-block[data-prop=steel] .hub{ background:#c7cdd3; box-shadow:none; }
  .mini-block[data-prop=stone] .arm, .mini-block[data-prop=stone] .hub{ background:#777; box-shadow:none; background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.2) 0 1px,transparent 1px),radial-gradient(circle at 70% 65%,rgba(0,0,0,.22) 0 1px,transparent 1px); background-size:7px 6px,8px 7px; }
  .mini-block[data-prop=gold] .arm, .mini-block[data-prop=gold] .hub{ background:#f2c94c; box-shadow:0 0 7px rgba(242,201,76,.3); }
  .mini-block[data-prop=wood] .arm, .mini-block[data-prop=wood] .hub{ background:#b8895a; box-shadow:none; }
  .mini-block[data-prop=glass] .arm, .mini-block[data-prop=glass] .hub{ background:transparent; box-shadow:none; border:1px solid rgba(255,255,255,.85); }
  .mini-block[data-prop=striped] .arm, .mini-block[data-prop=striped] .hub{ background:#c94848; background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.16) 0 3px,transparent 3px 7px); box-shadow:none; }
  .mini-block[data-prop=grid] .arm, .mini-block[data-prop=grid] .hub{ background:#3976b9; background-image:linear-gradient(rgba(255,255,255,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.2) 1px,transparent 1px); background-size:6px 6px; box-shadow:none; }
  .mini-block[data-prop=glass] .arm::before, .mini-block[data-prop=glass] .hub::before{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; background:linear-gradient(120deg,transparent 25%,rgba(255,255,255,.65) 45%,transparent 58%); opacity:.7; }
  .mini-block[data-prop=stone] .arm::before, .mini-block[data-prop=stone] .hub::before{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.2) 0 1px,transparent 1px),radial-gradient(circle at 70% 65%,rgba(0,0,0,.22) 0 1px,transparent 1px); background-size:7px 6px,8px 7px; }
  .mini-block[data-enh=holo] .arm::after, .mini-block[data-enh=holo] .hub::after{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.78) 0 1px,rgba(255,255,255,.08) 1px 6px); }
  .mini-block[data-enh=invert]{ filter:invert(1); }
  .block-visual[data-prop=steel] .arm, .block-visual[data-prop=steel] .hub{ background:#c7cdd3; box-shadow:none; }
  .block-visual[data-prop=stone] .arm, .block-visual[data-prop=stone] .hub{ background:#777; box-shadow:none; }
  .block-visual[data-prop=gold] .arm, .block-visual[data-prop=gold] .hub{ background:#f2c94c; box-shadow:0 0 7px rgba(242,201,76,.3); }
  .block-visual[data-prop=wood] .arm, .block-visual[data-prop=wood] .hub{ background:#b8895a; box-shadow:none; }
  .block-visual[data-prop=glass] .arm, .block-visual[data-prop=glass] .hub{ background:transparent; box-shadow:none; border:1px solid rgba(255,255,255,.85); }
  .block-visual[data-prop=striped] .arm, .block-visual[data-prop=striped] .hub{ background:#c94848; background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.16) 0 3px,transparent 3px 7px); box-shadow:none; }
  .block-visual[data-prop=grid] .arm, .block-visual[data-prop=grid] .hub{ background:#3976b9; background-image:linear-gradient(rgba(255,255,255,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.2) 1px,transparent 1px); background-size:6px 6px; box-shadow:none; }
  .block-visual[data-prop=glass] .arm::before, .block-visual[data-prop=glass] .hub::before{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; background:linear-gradient(120deg,transparent 25%,rgba(255,255,255,.65) 45%,transparent 58%); opacity:.7; }
  .block-visual[data-prop=stone] .arm::before, .block-visual[data-prop=stone] .hub::before{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.2) 0 1px,transparent 1px),radial-gradient(circle at 70% 65%,rgba(0,0,0,.22) 0 1px,transparent 1px); background-size:7px 6px,8px 7px; }
  .block-visual[data-enh=holo] .arm::after, .block-visual[data-enh=holo] .hub::after{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.78) 0 1px,rgba(255,255,255,.08) 1px 6px); }
  .block-visual[data-enh=invert]{ filter:invert(1); }
  .ball[data-prop=steel]{ background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.8) 0 2px,transparent 22%),#c7cdd3; box-shadow:0 2px 7px rgba(0,0,0,.22),0 0 7px rgba(255,255,255,.15); }
  .ball[data-prop=stone]{ background:#777; box-shadow:0 0 7px rgba(255,255,255,.12); background-image:radial-gradient(circle at 34% 28%,rgba(255,255,255,.8) 0 2px,transparent 22%),radial-gradient(circle at 20% 30%,rgba(255,255,255,.2) 0 1px,transparent 1px),radial-gradient(circle at 70% 65%,rgba(0,0,0,.22) 0 1px,transparent 1px); background-size:auto,7px 6px,8px 7px; }
  .ball[data-prop=gold]{ background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.8) 0 2px,transparent 22%),#f2c94c; box-shadow:0 2px 7px rgba(0,0,0,.22),0 0 8px rgba(242,201,76,.3); }
  .ball[data-prop=wood]{ background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.78) 0 2px,transparent 22%),#b8895a; box-shadow:0 2px 7px rgba(0,0,0,.22),0 0 6px rgba(255,255,255,.1); }
  .ball[data-prop=glass]{ background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.82) 0 2px,transparent 22%),transparent; border:1px solid rgba(255,255,255,.9); box-shadow:0 0 8px rgba(255,255,255,.22); }
  .ball[data-prop=glass]::after{ content:""; position:absolute; inset:0; border-radius:50%; background:linear-gradient(120deg,transparent 25%,rgba(255,255,255,.7) 45%,transparent 58%); }
  .ball[data-prop=striped]{ background:#c94848; background-image:radial-gradient(circle at 34% 28%,rgba(255,255,255,.78) 0 2px,transparent 22%),repeating-linear-gradient(135deg,rgba(255,255,255,.16) 0 3px,transparent 3px 7px); box-shadow:0 2px 7px rgba(0,0,0,.22),0 0 6px rgba(255,255,255,.1); }
  .ball[data-prop=grid]{ background:#3976b9; background-image:radial-gradient(circle at 34% 28%,rgba(255,255,255,.78) 0 2px,transparent 22%),linear-gradient(rgba(255,255,255,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.2) 1px,transparent 1px); background-size:auto,6px 6px,6px 6px; box-shadow:0 2px 7px rgba(0,0,0,.22),0 0 6px rgba(255,255,255,.1); }
  .ball[data-enh=holo]{ box-shadow:0 0 5px rgba(47,128,237,.32); }
  .ball[data-enh=holo]::before{ content:""; position:absolute; inset:0; border-radius:50%; pointer-events:none; background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.78) 0 1px,rgba(255,255,255,.08) 1px 6px); }
  .ball[data-enh=invert]{ filter:invert(1); }

<script>
(function(){
  "use strict";

  // ---------- number formatting ----------
  // Hiển thị số với dấu phân cách hàng nghìn: 1,000 / 1,000,000 / ...
  // Khi vượt quá 999,999,999, chuyển sang dạng khoa học: 1.0e+9, ...
  const NUMBER_FORMAT_LIMIT = 999_999_999;
  const numberFormatter = new Intl.NumberFormat('en-US', {
    maximumFractionDigits: 0,
    useGrouping: true
  });

  function formatNumber(value){
    const n = Number(value);
    if(!Number.isFinite(n)) return String(value ?? 0);
    if(Math.abs(n) > NUMBER_FORMAT_LIMIT){
      const exp = Math.floor(Math.log10(Math.abs(n)));
      const mantissa = n / Math.pow(10, exp);
      return `${mantissa.toFixed(1)}e+${exp}`;
    }
    return numberFormatter.format(Math.round(n));
  }

  function formatMoney(value){
    return `$${formatNumber(value)}`;
  }


  // ---------- animation speed ----------
  let animationSpeed = 1;
  const animationSpeedSelect = document.getElementById('animationSpeedSelect');
  function setAnimationSpeed(value){
    const next = Number(value);
    if(!Number.isFinite(next) || next <= 0) return;
    animationSpeed = next;
    document.documentElement.style.setProperty('--anim-speed', String(next));
  }
  function scaledDuration(ms){ return ms / animationSpeed; }
  animationSpeedSelect.addEventListener('change', ()=>setAnimationSpeed(animationSpeedSelect.value));
  setAnimationSpeed(animationSpeedSelect.value);

  // ---------- constants ----------
  const N_DIR=0,E_DIR=1,S_DIR=2,W_DIR=3;
  const DIR_NAMES = ['N','E','S','W'];
  const DIR_VEC = { 0:[0,-1], 1:[1,0], 2:[0,1], 3:[-1,0] };
  const opposite = d => (d+2)%4;

  const BASE_SIDES = {
    straight: [E_DIR, W_DIR],
    L: [N_DIR, E_DIR],
    T: [N_DIR, E_DIR, S_DIR],
    plus: [N_DIR, E_DIR, S_DIR, W_DIR]
  };
  function openSides(block){ return BASE_SIDES[block.type].map(s => (s + block.rotation) % 4); }

  const BAG_RECIPE = { straight:8, L:8, T:6, plus:3 };
  const BASE_MAX_BALLS = 5;
  const HAND_SIZE = 3;
  const MAX_CARD_HAND = 5;

  const BLOCK_PROPS = ['steel','stone','gold','wood','glass'];
  const BALL_PROPS  = ['steel','striped','grid','gold','glass'];
  const ENHANCEMENTS = ['holo','spark','invert'];

  const PROP_COLOR = { steel:'#b8c4cf', stone:'#9c8768', gold:'#f2c94c', wood:'#c98a4b', glass:'#8fe3e0', striped:'#e26fa6', grid:'#7c8cf8' };
  const PROP_LABEL = { steel:'Thép', stone:'Đá', gold:'Vàng', wood:'Gỗ', glass:'Kính', striped:'Sọc', grid:'Kẻ' };
  const PROP_INITIAL = { steel:'T', stone:'Đ', gold:'V', wood:'G', glass:'K', striped:'S', grid:'K' };
  const ENH_LABEL = { holo:'Lấp lánh', spark:'Đa sắc', invert:'Âm bản' };
  const ENH_COLOR = { holo:'#c792ea', spark:'#ffd166', invert:'#ff6b9d' };
  const ENH_INITIAL = { holo:'L', spark:'Đ', invert:'Â' };
  const TYPE_LABEL = { straight:'Thẳng', L:'Chữ L', T:'Chữ T', plus:'Dấu Cộng' };

  // ---------- hover tooltip content ----------
  const LEVEL_COLORS = ['#ffffff','#5b9bff','#6fcf97','#f2c94c','#f2994a','#eb5757','#bb6bd9']; // Lv1..Lv7+
  const levelColor = lv => LEVEL_COLORS[Math.min(lv,7)-1];
  const BLOCK_PROP_DESC = {
    steel:'Nhân 1.5x điểm khi bóng vào lỗ cho mỗi khối thép bóng đi qua',
    stone:'+50 điểm khi bóng thoát khối',
    wood:'+5 tỉ lệ cộng điểm khi bóng thoát khối',
    glass:'Nhân 1.5x điểm hiện tại; 20% khối vỡ sau khi bóng thoát',
    gold:'Sau khi thắng màn: +3$ cho mỗi khối vàng còn trên bảng',
  };
  const BLOCK_ENH_DESC = {
    holo:'+50 điểm khi bóng thoát khối',
    spark:'Nhân đôi hiệu ứng thuộc tính của khối (không có thuộc tính thì +tỉ lệ cộng điểm)',
    invert:'Bóng thoát khối này bị nhân bản: 1 bản giữ Âm bản, 1 bản mất Âm bản',
  };
  const BALL_PROP_DESC = {
    striped:'Nhân 1.5x điểm mà khối cho bóng thoát ra',
    grid:'+10 điểm mỗi lần bóng thoát khối',
    glass:'Nhân 2x điểm mỗi lần bóng thoát khối; 10% bóng vỡ sau mỗi lần thoát khối; 10% mất bóng khi bóng kính cuối cùng về lỗ',
    steel:'Nhân 1.5x điểm khi bóng vào lỗ',
    gold:'+1$ khi bóng vào lỗ',
  };
  const BALL_ENH_DESC = {
    holo:'+50 điểm mỗi lần bóng thoát khối',
    spark:'Không có thuộc tính: nhân đôi điểm mỗi lần thoát khối. Có thuộc tính: nhân đôi hiệu ứng thuộc tính đó',
    invert:'Bắn thành 2 bản: 1 bản giữ Âm bản, 1 bản mất Âm bản (bắn như bóng thường)',
  };

  function blockTooltip(block){
    const level = ((state.typeBonus[block.type]||0)/5) + 1;
    return {
      title:TYPE_LABEL[block.type],
      level,
      lines:[`Số điểm cho khi bóng đi ra: ${formatNumber((10+state.baseRateBonus)+(state.typeBonus[block.type]||0))}`],
      property:block.property ? { label:PROP_LABEL[block.property], color:PROP_COLOR[block.property], desc:BLOCK_PROP_DESC[block.property] } : null,
      enhancement:block.enhancement ? { label:ENH_LABEL[block.enhancement], id:block.enhancement, color:ENH_COLOR[block.enhancement], desc:BLOCK_ENH_DESC[block.enhancement] } : null
    };
  }
  function ballTooltip(b){
    const level = ((state.baseRateBonus||0)/2) + 1;
    return {
      title:'Bóng',
      level,
      lines:[
        `Số điểm bóng chứa: ${formatNumber(50+state.startBonus)}`,
        `Tỉ lệ cộng: ${formatNumber(10)}${state.baseRateBonus>0?`(+${formatNumber(state.baseRateBonus)})`:''}/khối`,
      ],
      property:b.property ? { label:PROP_LABEL[b.property], color:PROP_COLOR[b.property], desc:BALL_PROP_DESC[b.property] } : null,
      enhancement:b.enhancement ? { label:ENH_LABEL[b.enhancement], id:b.enhancement, color:ENH_COLOR[b.enhancement], desc:BALL_ENH_DESC[b.enhancement] } : null
    };
  }

  const hoverTipEl = document.createElement('div'); hoverTipEl.className='hover-tip hidden';
  document.body.appendChild(hoverTipEl);

  let debugHoverTarget = null;
  function markDebugTarget(el, obj, kind){ el.__debugTarget = {el, obj, kind}; return el; }
  function debugDescribeTarget(target){
    if(!target || !target.obj) return '<span class="debug-none">Chưa có khối hoặc bóng nào dưới con trỏ.</span>';
    const obj=target.obj;
    const label=target.kind==='block' ? (TYPE_LABEL[obj.type]||'Khối') : 'Bóng';
    return `<strong>${label}</strong><br>Đặc điểm: ${obj.property ? PROP_LABEL[obj.property] : 'Không có'}<br>Enhancement: ${obj.enhancement ? ENH_LABEL[obj.enhancement] : 'Không có'}`;
  }
  function debugRefreshSelects(){
    const ps=document.getElementById('debugPropertySelect'), es=document.getElementById('debugEnhSelect'), ab=document.getElementById('debugApplyTargetBtn');
    ps.innerHTML=''; es.innerHTML='';
    if(!debugHoverTarget){ ps.disabled=true; es.disabled=true; ab.disabled=true; return; }
    const props=debugHoverTarget.kind==='block'?BLOCK_PROPS:BALL_PROPS;
    const n=document.createElement('option'); n.value=''; n.textContent='Không có đặc điểm'; ps.appendChild(n);
    props.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=PROP_LABEL[x];ps.appendChild(o);});
    const ne=document.createElement('option'); ne.value=''; ne.textContent='Không có enhancement'; es.appendChild(ne);
    ENHANCEMENTS.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=ENH_LABEL[x];es.appendChild(o);});
    ps.value=debugHoverTarget.obj.property||''; es.value=debugHoverTarget.obj.enhancement||''; ps.disabled=false; es.disabled=false; ab.disabled=false;
  }
  function debugUpdateTargetVisual(target){
    if(!target?.el?.isConnected) return;
    const el=target.el;
    if(target.kind==='block'){
      if(el.matches('.cell,.hand-slot,.inventory-item')) renderBlockArms(el,target.obj);
      else { const mini=el.querySelector('.mini-block'); if(mini) mini.outerHTML=renderMiniBlockMarkup(target.obj); }
    } else {
      if(el.classList.contains('ball-chip')){ el.dataset.prop=target.obj.property||''; el.dataset.enh=target.obj.enhancement||''; if(target.obj.property) el.style.setProperty('--prop-color',PROP_COLOR[target.obj.property]); else el.style.removeProperty('--prop-color'); }
      else { const chip=el.querySelector('.ball-chip,.mini-ball'); if(chip) chip.outerHTML=ballChipMarkup(target.obj); }
    }
  }
  function debugApplyTarget(){
    const t=debugHoverTarget; if(!t?.obj) return;
    const prop=document.getElementById('debugPropertySelect').value||null, enh=document.getElementById('debugEnhSelect').value||null;
    t.obj.property=prop; t.obj.enhancement=enh;
    if(t.kind==='ball'){
      const pool=t.obj._id ? state.ballPool.find(b=>b._id===t.obj._id) : null;
      const q=t.obj._id ? state.ballQueue.find(b=>b._id===t.obj._id) : null;
      if(pool){ pool.property=prop; pool.enhancement=enh; }
      if(q){ q.property=prop; q.enhancement=enh; }
      if(pool || q){ syncBallMutationTargets([{obj:t.obj,kind:'ball'}]); }
      renderBallQueue();
      if(!shopOverlayEl.classList.contains('hidden')) renderShop();
      debugUpdateTargetVisual(t);
    } else {
      render();
      if(!shopOverlayEl.classList.contains('hidden')) renderShop();
      if(!inventoryOverlayEl.classList.contains('hidden')) openInventory();
    }
    document.getElementById('debugTargetInfo').innerHTML=debugDescribeTarget(t); debugRefreshSelects();
  }
  function createTooltipPill(info, type){
    const pill = document.createElement('span');
    pill.className = 'hover-tip-pill' + (type==='enhancement' ? ` enh-${info.id}` : '');
    pill.textContent = info.label;
    if(type==='property'){
      pill.style.background = info.color || 'var(--cyan)';
    } else {
      pill.style.setProperty('--enh-color', info.color || 'var(--cyan)');
    }
    return pill;
  }

  function createTooltipDetail(info, type){
    const detail = document.createElement('div');
    detail.className='hover-tip-detail';
    const title = document.createElement('div');
    title.className='hover-tip-detail-title';
    title.appendChild(createTooltipPill(info, type));
    detail.appendChild(title);
    const desc = document.createElement('div');
    desc.className='hover-tip-detail-desc';
    desc.textContent=info.desc;
    detail.appendChild(desc);
    return detail;
  }

  function placeHoverTip(targetEl){
    if(hoverTipEl.classList.contains('hidden') || !targetEl?.isConnected) return;

    const targetRect = targetEl.getBoundingClientRect();
    const tipRect = hoverTipEl.getBoundingClientRect();
    const margin = 8;
    const gap = 10;
    const viewportW = window.innerWidth;
    const viewportH = window.innerHeight;

    // Preferred position: centered above the hovered element.
    let left = targetRect.left + targetRect.width / 2 - tipRect.width / 2;
    let top = targetRect.top - tipRect.height - gap;

    // If there is not enough room above, place it below instead.
    if(top < margin){
      top = targetRect.bottom + gap;
    }

    // Keep the entire tooltip inside the viewport horizontally.
    if(left < margin) left = margin;
    if(left + tipRect.width > viewportW - margin){
      left = viewportW - margin - tipRect.width;
    }

    // If neither above nor below fits completely, clamp vertically to the viewport.
    if(top + tipRect.height > viewportH - margin){
      top = Math.max(margin, viewportH - margin - tipRect.height);
    }

    hoverTipEl.style.left = Math.round(left) + 'px';
    hoverTipEl.style.top = Math.round(top) + 'px';
    hoverTipEl.style.transform = 'none';
  }

  function showHoverTip(targetEl, info){
    hoverTipEl._targetEl = targetEl;
    hoverTipEl.innerHTML = '';

    const main = document.createElement('div');
    main.className='hover-tip-main';

    const t = document.createElement('div');
    t.className='tip-title';
    const titleLeft = document.createElement('div');
    titleLeft.className='tip-title-left';
    const baseTitle = document.createElement('span');
    baseTitle.className='tip-title-base';
    baseTitle.textContent=info.title;
    titleLeft.appendChild(baseTitle);
    if(info.property) titleLeft.appendChild(createTooltipPill(info.property, 'property'));
    if(info.enhancement) titleLeft.appendChild(createTooltipPill(info.enhancement, 'enhancement'));
    t.appendChild(titleLeft);

    const levelEl=document.createElement('span');
    levelEl.className='tip-level';
    levelEl.textContent=`Lv.${info.level}`;
    levelEl.style.color=levelColor(info.level);
    t.appendChild(levelEl);
    main.appendChild(t);

    info.lines.forEach(line=>{
      const d = document.createElement('div');
      if(typeof line === 'string') d.textContent = line;
      else { d.textContent = line.text; d.style.color = line.color; }
      main.appendChild(d);
    });
    hoverTipEl.appendChild(main);

    if(info.property || info.enhancement){
      const details=document.createElement('div');
      details.className='hover-tip-details';
      if(info.property) details.appendChild(createTooltipDetail(info.property, 'property'));
      if(info.enhancement) details.appendChild(createTooltipDetail(info.enhancement, 'enhancement'));
      hoverTipEl.appendChild(details);
    }

    hoverTipEl.classList.remove('hidden');
    placeHoverTip(targetEl);
  }
  function hideHoverTip(){ hoverTipEl.classList.add('hidden'); hoverTipEl._targetEl = null; }
  window.addEventListener('resize', ()=>{
    if(!hoverTipEl.classList.contains('hidden') && hoverTipEl._targetEl) placeHoverTip(hoverTipEl._targetEl);
  });
  window.addEventListener('scroll', ()=>{
    if(!hoverTipEl.classList.contains('hidden') && hoverTipEl._targetEl) placeHoverTip(hoverTipEl._targetEl);
  }, true);

  function attachObjectTooltip(el, obj, kind){
    el.addEventListener('mouseenter', ()=> showHoverTip(el, kind==='ball' ? ballTooltip(obj) : blockTooltip(obj)));
    el.addEventListener('mouseleave', hideHoverTip);
  }

  function showSimpleHoverTip(targetEl, titleText, bodyText){
    hoverTipEl._targetEl = targetEl;
    hoverTipEl.innerHTML='';
    const panel=document.createElement('div');
    panel.className='hover-tip-main';
    const title=document.createElement('div');
    title.className='tip-title';
    title.textContent=titleText;
    panel.appendChild(title);
    const line=document.createElement('div');
    line.textContent=bodyText;
    panel.appendChild(line);
    hoverTipEl.appendChild(panel);
    hoverTipEl.classList.remove('hidden');
    placeHoverTip(targetEl);
  }

  function blackBlockTooltip(el){
    el.addEventListener('mouseenter', ()=>showSimpleHoverTip(el, 'Vật cản', 'Không thể đặt khối lên ô này'));
    el.addEventListener('mouseleave', hideHoverTip);
  }

  function attachCardTooltip(el, def){
    if(!def) return;
    el.addEventListener('mouseenter', ()=>showSimpleHoverTip(el, def.name, def.desc));
    el.addEventListener('mouseleave', hideHoverTip);
  }

  function ballChipMarkup(b, extraClass=''){
    const prop=b?.property||'';
    const enh=b?.enhancement||'';
    return `<div class="ball-chip shop-ball-preview${extraClass?` ${extraClass}`:''}" data-prop="${prop}" data-enh="${enh}"></div>`;
  }

  const GACHA_TIERS = [
    { key:'small', label:'Nhỏ', cost:0, options:3, picks:1 },
    { key:'large', label:'Lớn', cost:0, options:5, picks:1 },
    { key:'mega',  label:'Siêu lớn', cost:0, options:5, picks:2 },
  ];

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function rollProp(list, chance){ return Math.random() < chance ? pick(list) : null; }
  function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
  let _uid = 1;
  function cardUid(){ return 'c'+(_uid++); }

  // ---------- upgrade & buff & power card defs ----------
  const UPGRADE_POOL = [
    { id:'base', name:'Nâng cấp bóng cơ bản', desc:'+10 điểm bóng chứa ban đầu và +2 điểm mỗi lần bóng thoát block (mọi bóng)', cost:5, apply(){ state.startBonus += 10; state.baseRateBonus += 2; } },
    { id:'straight', name:'Nâng cấp khối Thẳng', desc:'+5 điểm khi bóng thoát khối Thẳng', cost:5, apply(){ state.typeBonus.straight += 5; } },
    { id:'L', name:'Nâng cấp khối chữ L', desc:'+5 điểm khi bóng thoát khối L', cost:5, apply(){ state.typeBonus.L += 5; } },
    { id:'T', name:'Nâng cấp khối chữ T', desc:'+5 điểm khi bóng thoát khối T', cost:5, apply(){ state.typeBonus.T += 5; } },
    { id:'plus', name:'Nâng cấp khối Dấu Cộng', desc:'+5 điểm khi bóng thoát khối +', cost:5, apply(){ state.typeBonus.plus += 5; } },
  ];

  const BUFF_POOL = [
    { id:'balls', name:'Tay nhanh', desc:'+1 giới hạn số bóng bắn mỗi màn, vĩnh viễn', cost:12, apply(){ state.maxBallsBonus += 1; } },
    { id:'start', name:'Khởi động', desc:'Mọi bóng bắt đầu với +5 điểm nền, vĩnh viễn', cost:12, apply(){ state.startBonus += 5; } },
    { id:'interest', name:'Giàu có', desc:'Tăng giới hạn số tiền lãi có thể nhận được +10$', cost:12, apply(){ state.interestCapBonus += 10; } },
    { id:'trash', name:'Thùng rác', desc:'+1 giới hạn loại bỏ mỗi màn', cost:12, apply(){ state.discardBonus += 1; } },
    { id:'big_hand', name:'Tay lớn', desc:'+1 khối có thể cầm trong tay', cost:12, apply(){ state.handSizeBonus += 1; } },
    { id:'discount', name:'Hạ giá', desc:'Giảm 25% giá mua các vật phẩm trong cửa hàng', cost:12, apply(){ state.discountBonus = true; } },
    { id:'empty', name:'Rỗng', desc:'Không có chức năng gì cả', cost:12, apply(){} },
  ];

  function getOwnedBuffIds(){ return Array.isArray(state?.ownedBuffIds) ? state.ownedBuffIds : []; }
  function getMaxHandSize(){ return HAND_SIZE + (state?.handSizeBonus || 0); }
  function getMaxCardHand(){ return MAX_CARD_HAND; }
  function getMaxDiscards(){ return 3 + (state?.discardBonus || 0); }
  function isBuffOwned(id){ return getOwnedBuffIds().includes(id); }
  function markBuffOwned(id){ if(id==='empty' || isBuffOwned(id)) return; state.ownedBuffIds.push(id); }
  function pickAvailableBuff(){
    const available=BUFF_POOL.filter(b=>b.id!=='empty' && !isBuffOwned(b.id));
    return available.length ? pick(available) : BUFF_POOL.find(b=>b.id==='empty');
  }
  function shopPrice(base){
    const n=Number(base)||0;
    return state?.discountBonus ? Math.max(1,Math.round(n*0.75)) : n;
  }

  const PROPERTY_CARD_TARGET_KIND = { steel:'both', stone:'block', gold:'both', wood:'block', glass:'both', striped:'ball', grid:'ball' };
  const POWER_CARD_DEFS = {};
  ['steel','stone','gold','wood','glass','striped','grid'].forEach(p=>{
    const kind = PROPERTY_CARD_TARGET_KIND[p];
    const kindLabel = kind==='ball' ? 'bóng' : (kind==='block' ? 'khối' : 'khối hoặc bóng');
    POWER_CARD_DEFS['prop_'+p] = {
      id:'prop_'+p, name:`Thẻ ${PROP_LABEL[p]}`,
      desc:`Biến 1 ${kindLabel} thành thuộc tính ${PROP_LABEL[p]}`,
      cost: 5, targetKind: kind, targetCount:1,
      use(targets){ targets[0].obj.property = p; }
    };
  });
  POWER_CARD_DEFS['money'] = { id:'money', name:'Thẻ tiền', desc:'Nhận thêm một lượng tiền bằng số tiền hiện có, tối đa +25$', cost:5, targetKind:null, targetCount:0,
    use(){ const bonus=Math.min(Math.max(0,state.money),25); state.money += bonus; moneyValEl.textContent=formatMoney(state.money); } };
  POWER_CARD_DEFS['swap'] = { id:'swap', name:'Thẻ hoán đổi', desc:'Chọn 2 khối HOẶC 2 bóng, hoán đổi thuộc tính + enhancement', cost:5, targetKind:'swap', targetCount:2,
    use(targets){ const a=targets[0].obj, b=targets[1].obj; const pa=a.property, ea=a.enhancement; a.property=b.property; a.enhancement=b.enhancement; b.property=pa; b.enhancement=ea; } };
  POWER_CARD_DEFS['magic'] = { id:'magic', name:'Thẻ ma thuật', desc:'Chọn 1 khối hoặc bóng, thêm enhancement ngẫu nhiên', cost:5, targetKind:'both', targetCount:1,
    use(targets){ targets[0].obj.enhancement = pick(ENHANCEMENTS); } };
  POWER_CARD_DEFS['clone'] = { id:'clone', name:'Thẻ nhân bản', desc:'Chọn 1 khối, tạo thêm 1 khối giống hệt cho túi đồ màn sau', cost:5, targetKind:'block', targetCount:1,
    use(targets){ const o=targets[0].obj; state.pendingBlocks.push({type:o.type, rotation:0, property:o.property, enhancement:o.enhancement}); } };
  POWER_CARD_DEFS['annihilate'] = { id:'annihilate', name:'Thẻ triệt tiêu', desc:'Loại bỏ tối đa 2 khối được chọn trên tay hoặc bảng chơi', cost:5, targetKind:'block', targetCount:2, targetMinCount:1, manualConfirm:true,
    use(targets){
      const selected = new Set(targets.map(t=>t.obj));
      state.hand = state.hand.filter(block=>!selected.has(block));
      if(state.cells){
        for(let r=0;r<state.rows;r++) for(let c=0;c<state.cols;c++){
          if(selected.has(state.cells[r][c].block)) state.cells[r][c].block = null;
        }
      }
      refillHand();
    } };
  POWER_CARD_DEFS['breed'] = { id:'breed', name:'Thẻ sinh sản', desc:'Tạo ra 2 thẻ sức mạnh ngẫu nhiên và đưa vào tay', cost:5, targetKind:null, targetCount:0,
    use(){
      const defs=shuffle(Object.values(POWER_CARD_DEFS).filter(d=>d.id!=='copy'));
      const free=Math.max(0,getMaxCardHand()-state.cardHand.length);
      for(let i=0;i<Math.min(2,free);i++){ const d=defs[i%defs.length]; state.cardHand.push({id:cardUid(),kind:'power',defId:d.id}); }
    } };
  POWER_CARD_DEFS['copy'] = { id:'copy', name:'Thẻ sao chép', desc:'Đưa vào tay thẻ sức mạnh hoặc thẻ nâng cấp gần nhất đã dùng', cost:5, targetKind:null, targetCount:0,
    use(){
      const last=state.lastUsedCard;
      if(!last || state.cardHand.length>=getMaxCardHand()) return;
      state.cardHand.push({id:cardUid(),kind:last.kind,defId:last.defId});
    } };

  // ---------- run / level state ----------
  let state = null;
  // Invalidates async shots from previous runs so they cannot mutate a new run.
  let runGeneration = 0;
  let rewardGeneration = 0;
  let _ballUid = 1;
  function ballUid(){ return 'b' + (_ballUid++); }
  function ensureBallIds(){ state.ballPool.forEach(b=>{ if(!b._id) b._id=ballUid(); }); }


  // ---------- persistent save / load ----------
  // Saves the current run locally in the browser. No account or server is required.
  const SAVE_KEY = 'connect-run-save-v1';
  const SAVE_VERSION = 1;
  let saveTimer = null;
  let savePending = false;



  function snapshotGameState(){
    if(!state) return null;

    // Only copy gameplay data. Runtime/UI-only state such as targeting, drag data,
    // functions, animation helpers and Sets are converted/omitted intentionally.
    const save = JSON.parse(JSON.stringify(state, (key, value)=>{
      if(typeof value === 'function') return undefined;
      if(key === '_animateNewHoleConnections') return undefined;
      if(key === '_splitUsed') return undefined;
      if(key === '_boardHideComplete') return undefined;
      if(key === '_boardReveal') return undefined;
      if(key === '_boardHide') return undefined;
      if(key === 'resolving') return false;
      if(key === 'targeting') return null;
      if(key === 'lastUpgrade') return undefined;
      if(key === 'shopBuff') return undefined;
      if(key === 'holeConnections') return [...state.holeConnections];
      return value;
    }));

    save.version = SAVE_VERSION;
    save.lastUpgradeId = state.lastUpgrade?.id || null;
    save.shopBuffId = state.shopBuff?.id || null;
    save.shopBuffBought = !!state.shopBuffBought;
    // targeting is intentionally not restored after a reload.
    save.targeting = null;
    return save;
  }

  function saveGame(options={}){
    if(!state || state.resolving) return false;
    try{
      const save = snapshotGameState();
      localStorage.setItem(SAVE_KEY, JSON.stringify(save));
      savePending = false;
      return true;
    }catch(err){
      console.error('Không thể lưu game:', err);
      return false;
    }
  }

  function syncSaveCounters(){
    let maxBall = 0;
    const ballIds = [];
    (state?.ballPool || []).forEach(b=>{ if(b?._id) ballIds.push(b._id); });
    (state?.ballQueue || []).forEach(b=>{ if(b?._id) ballIds.push(b._id); });
    ballIds.forEach(id=>{ const n=Number(String(id).replace(/^b/,'')); if(Number.isFinite(n)) maxBall=Math.max(maxBall,n); });
    _ballUid = Math.max(_ballUid, maxBall+1);

    let maxCard = 0;
    const cardIds = [];
    (state?.cardHand || []).forEach(c=>{ if(c?.id) cardIds.push(c.id); });
    (state?.gachaStock || []).forEach(g=>{ if(g?.id) cardIds.push(g.id); });
    cardIds.forEach(id=>{ const n=Number(String(id).replace(/^c/,'')); if(Number.isFinite(n)) maxCard=Math.max(maxCard,n); });
    _uid = Math.max(_uid, maxCard+1);
  }

  function restoreKnownObjects(){
    if(!state) return;

    state.holeConnections = new Set(state.holeConnections || []);
    state.targeting = null;
    state.resolving = false;

    state.lastUpgrade = state.lastUpgradeId
      ? (UPGRADE_POOL.find(x=>x.id===state.lastUpgradeId) || null)
      : null;
    delete state.lastUpgradeId;

    if(state.shopBuffId){
      const def = BUFF_POOL.find(x=>x.id===state.shopBuffId);
      if(def){
        state.shopBuff = {...def, bought: !!state.shopBuffBought};
      } else {
        state.shopBuff = null;
      }
    } else {
      state.shopBuff = null;
    }
    delete state.shopBuffId;

    // Older/newer saves may omit fields; keep them compatible with this build.
    state.typeBonus = {...{straight:0,L:0,T:0,plus:0}, ...(state.typeBonus||{})};
    state.pendingBlocks = state.pendingBlocks || [];
    state.ballPool = state.ballPool || [];
    state.ballQueue = state.ballQueue || [];
    state.cardHand = state.cardHand || [];
    state.lastUsedCard = state.lastUsedCard || null;
    state.discardBonus = Number.isFinite(state.discardBonus) ? state.discardBonus : 0;
    state.handSizeBonus = Number.isFinite(state.handSizeBonus) ? state.handSizeBonus : 0;
    state.discountBonus = !!state.discountBonus;
    state.ownedBuffIds = Array.isArray(state.ownedBuffIds) ? state.ownedBuffIds : [];
    state.bag = state.bag || [];
    state.hand = state.hand || [];
    state.discardPile = state.discardPile || [];
    state.discardsLeft = Number.isFinite(state.discardsLeft) ? state.discardsLeft : 3;
    state.commonRerollCost = Number.isFinite(state.commonRerollCost) ? state.commonRerollCost : 3;

    ensureBallIds();
    syncSaveCounters();
  }

  function loadGame(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(!raw) return false;
      const save = JSON.parse(raw);
      if(!save || typeof save !== 'object') return false;
      if(save.version && save.version > SAVE_VERSION) return false;

      state = save;
      restoreKnownObjects();

      if(state.phase === 'playing'){
        render();
        renderTargetBanner();
        hideOverlay();
        hideShop();
        return true;
      }

      if(state.phase === 'shop'){
        render();
        hideOverlay();
        renderCardHand();
        openShop();
        return true;
      }

      if(state.phase === 'reward'){
        hideOverlay();
        hideShop();
        const unfired = Math.max(0, state.ballQueue.length - state.ballsFired);
        const interestCap = 5 + state.interestCapBonus;
        const interest = Math.min(Math.floor(state.money/5), interestCap);
        state._boardHide = false;
        render();
        runBoardHideAnimation(()=>showLevelReward({winBonus:getWinBonus(), unfired, ballBonus:unfired*2, interest, goldBlockCount:0, goldBonus:0}));
        return true;
      }

      // gameover (or unknown terminal state): reconstruct the standard lose overlay.
      render();
      renderCardHand();
      hideShop();
      showOverlay('lose', 'HẾT BÓNG — KẾT THÚC RUN', `Dừng lại ở màn ${formatNumber(state.level)}, đạt ${formatNumber(state.score)}/${formatNumber(state.target)} điểm. Tổng tiền tích luỹ: ${formatMoney(state.money)}.`);
      return true;
    }catch(err){
      console.error('Không thể tải save:', err);
      return false;
    }
  }

  function deleteSave(){
    try{ localStorage.removeItem(SAVE_KEY); }catch(err){ console.error('Không thể xoá save:', err); }
  }

  function scheduleAutoSave(){
    if(!state || state.resolving) return;
    savePending = true;
    if(saveTimer) return;
    saveTimer = setTimeout(()=>{
      saveTimer = null;
      if(savePending) saveGame({silent:false});
    }, 700);
  }

  function flushAutoSave(){
    if(state && !state.resolving) saveGame({silent:true});
  }

  function newRun(){
    rewardGeneration++;
    // Invalidate async work from the previous run before replacing the global state.
    runGeneration++;
    if(boardRevealTimer){
      clearTimeout(boardRevealTimer);
      boardRevealTimer=null;
    }
    document.querySelectorAll('.ball, .ball-tooltip, .ball-goal-popup').forEach(el=>el.remove());
    ballClickSelection=null;
    suppressBallClickUntil=0;

    state = {
      money: 3, level: 0,
      baseRateBonus: 0, typeBonus: { straight:0, L:0, T:0, plus:0 },
      maxBallsBonus: 0, bagBonus: 0, startBonus: 0, interestCapBonus: 0,
      discardBonus: 0, handSizeBonus: 0, discountBonus: false, ownedBuffIds: [],
      pendingBlocks: [], nextBallPreset: null,
      ballPool: Array.from({length:BASE_MAX_BALLS}, ()=>({_id:ballUid(), property:null, enhancement:null})),
      cardHand: [], lastUpgrade: null, lastUsedCard: null, targeting: null,
      phase: 'playing',
      shopBuff: null, shopBuffBought: false, commonItems: null, commonRerollCost: 3,
      bag: [], hand: [], discardPile: [], discardsLeft: 3, cells: null, holeConnections: new Set()
    };
    state.bag = makeInitialDeck();
    ensureBallIds();
    newLevel();
    scheduleAutoSave();
  }

  function computeTarget(level){
    const EARLY_TARGETS = [
      300, 600, 900, 1500, 2400, 3300, 4500, 6000, 7500,
      12000, 16500, 21000, 33000, 45000, 60000, 76000, 87000, 100000
    ];
    if(level <= EARLY_TARGETS.length) return EARLY_TARGETS[Math.max(0, level - 1)];
    return Math.round(100000 * Math.pow(1.5, level - 18));
  }

  // kho đồ (bag) is generated once per run and persists (recycled level to level) until loss/restart
  function makeInitialDeck(){
    let bag = [];
    for(const type in BAG_RECIPE){
      for(let i=0;i<BAG_RECIPE[type];i++) bag.push({ type, rotation:0, property:null, enhancement:null });
    }
    shuffle(bag);
    return bag;
  }

  function makeBallQueue(){
    const max = BASE_MAX_BALLS + state.maxBallsBonus;
    while(state.ballPool.length < max) state.ballPool.push({_id:ballUid(),property:null, enhancement:null});
    if(state.ballPool.length > max) state.ballPool.length = max;
    ensureBallIds();
    const queue = state.ballPool.map(b => ({_id:b._id, fired:false, property:b.property||null, enhancement:b.enhancement||null}));
    if(state.nextBallPreset){
      queue[0].property = state.nextBallPreset.property;
      queue[0].enhancement = state.nextBallPreset.enhancement;
      state.nextBallPreset = null;
    }
    return queue;
  }

  function getBlackBlockCount(level){
    if(level < 4) return 0;

    // Exact obstacle-count distribution requested by stage.
    const roll = Math.random();

    if(level === 4) return roll < 0.40 ? 1 : 0;
    if(level === 5) return roll < 0.60 ? 1 : 0;
    if(level === 6) return roll < 0.80 ? 1 : 0;

    if(level >= 7 && level <= 9){
      return roll < 0.20 ? 2 : 1;
    }

    if(level >= 10 && level <= 12){
      const twoChance = (level - 10) * 0.20 + 0.40; // 40/60/80%
      return roll < twoChance ? 2 : 1;
    }

    if(level === 13){
      if(roll < 0.20) return 3;
      if(roll < 0.80) return 2;
      return 1;
    }

    if(level >= 14 && level <= 16){
      const threeChance = (level - 14) * 0.20 + 0.40; // 40/60/80%
      return roll < threeChance ? 3 : 2;
    }

    if(level === 17){
      if(roll < 0.20) return 4;
      if(roll < 0.80) return 3;
      return 2;
    }

    // Level 18+: always 3, with a 20% chance to spawn 4.
    return roll < 0.20 ? 4 : 3;
  }

  function placeBlackBlocks(cells, rows, cols, nodeR, nodeC, nodeDir, holeR, holeC, level){
    const count = getBlackBlockCount(level);
    if(!count) return [];

    // Never place a black block directly in the node's initial firing lane.
    // The shot starts from the node and travels in state.node.dir until it
    // meets a redirecting block/hole or leaves the board. Blocking that
    // straight line would make the stage spawn with an unfair forced loss.
    const blockedRay = new Set();
    if(Number.isInteger(nodeDir)){
      const [dx,dy]=DIR_VEC[nodeDir];
      let r=nodeR+dy, c=nodeC+dx;
      while(r>=0 && r<rows && c>=0 && c<cols){
        blockedRay.add(`${r},${c}`);
        if(cells[r][c].type==='hole' || cells[r][c].type==='node') break;
        const occupied = cells[r][c].block;
        if(occupied) break;
        r+=dy; c+=dx;
      }
    }

    const candidates=[];
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      if((r===nodeR && c===nodeC) || (r===holeR && c===holeC)) continue;
      if(cells[r][c].type!=='empty') continue;
      if(blockedRay.has(`${r},${c}`)) continue;
      candidates.push([r,c]);
    }
    shuffle(candidates);
    const placed=candidates.slice(0, Math.min(count, candidates.length));
    for(const [r,c] of placed) cells[r][c]={type:'black',block:null};
    return placed;
  }

  function newLevel(){
    rewardGeneration++;
    const rewardBtn = document.getElementById('overlayBtn');
    if(rewardBtn){
      rewardBtn.dataset.busy='';
      rewardBtn.disabled=false;
      rewardBtn.onclick=newRun;
    }
    state.level += 1;
    state.target = computeTarget(state.level);
    state.score = 0;
    state.ballsFired = 0;
    state.resolving = false;
    state.phase = 'playing';
    state.targeting = null;
    state.discardsLeft = getMaxDiscards();
    if(state.level===1 || (state.level>1 && (state.level-1)%3===0)){ state.shopBuff = {...pickAvailableBuff(), bought:false}; state.shopBuffBought=false; }

    // recycle everything from the previous level (board + hand + discards) back into the persistent bag
    if(state.cells){
      for(let r=0;r<state.rows;r++) for(let c=0;c<state.cols;c++){
        const b = state.cells[r][c].block;
        if(b) state.bag.push(b);
      }
    }
    state.bag.push(...state.hand.filter(Boolean));
    state.bag.push(...state.discardPile);
    state.hand = [];
    state.discardPile = [];
    if(state.pendingBlocks.length){ state.bag.push(...state.pendingBlocks); state.pendingBlocks = []; }
    state.bag.forEach(block=>{ if(block) block.rotation=0; });
    shuffle(state.bag);

    const boardOptions = state.level===1
      ? [[4,4]]
      : state.level<=6
        ? [[4,4],[4,5],[5,4],[5,5]]
        : state.level<=12
          ? [[4,4],[4,5],[5,4],[4,6],[6,4],[5,5],[5,6],[6,5],[6,6]]
          : [[5,5],[5,6],[6,5],[5,7],[7,5],[6,6],[6,7],[7,6],[7,7]];
    let [rows,cols] = pick(boardOptions);
    const cells = [];
    for(let r=0;r<rows;r++){ const row=[]; for(let c=0;c<cols;c++) row.push({type:'empty', block:null}); cells.push(row); }

    let nodeR, nodeC, validDirs;
    do{
      nodeR = Math.floor(Math.random()*rows);
      nodeC = Math.floor(Math.random()*cols);
      validDirs = [0,1,2,3].filter(d=>{ const [dx,dy]=DIR_VEC[d]; const nr=nodeR+dy, nc=nodeC+dx; return nr>=0&&nr<rows&&nc>=0&&nc<cols; });
    } while(validDirs.length===0);
    const nodeDir = validDirs[Math.floor(Math.random()*validDirs.length)];
    cells[nodeR][nodeC] = {type:'node', block:null};

    let holeR, holeC;
    const holeCandidates = [];
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      if(Math.abs(r-nodeR)<=1 && Math.abs(c-nodeC)<=1) continue;
      holeCandidates.push([r,c]);
    }
    if(!holeCandidates.length){
      state.level -= 1;
      return newLevel();
    }
    [holeR,holeC] = pick(holeCandidates);
    cells[holeR][holeC] = {type:'hole', block:null};

    placeBlackBlocks(cells, rows, cols, nodeR, nodeC, nodeDir, holeR, holeC, state.level);

    state.rows = rows; state.cols = cols; state.cells = cells;
    state.node = {r:nodeR, c:nodeC, dir:nodeDir};
    state.hole = {r:holeR, c:holeC};
    state.holeConnections.clear();

    state.hand = [];
    refillHand();
    state.ballQueue = makeBallQueue();

    state._boardReveal = true;
    state._handReveal = true;
    state._handHide = false;
    state._handRewardHidden = false;
    render();
    hideOverlay();
    hideShop();
    renderTargetBanner();
  }

  function refillHand(animate=false){
    if(state.hand.some(Boolean)) return;
    state.hand = [];
    while(state.hand.length < getMaxHandSize() && state.bag.length > 0) state.hand.push(state.bag.shift());
    if(animate && typeof refreshAnimSlots !== 'undefined') refreshAnimSlots = new Set(state.hand.map((_,i)=>i));
  }

  function discardHand(){
    if(state.discardsLeft<=0 || !state.hand.some(Boolean) || state.resolving || state.phase!=='playing' || state.targeting) return;
    state.discardsLeft--;
    state.discardPile.push(...state.hand.filter(Boolean));
    state.hand = [];
    refillHand();
    refreshAnimSlots = new Set(state.hand.map((_,i)=>i));
    render();
    scheduleAutoSave();
  }

  // ---------- DOM refs ----------
  const boardEl = document.getElementById('board');
  const handEl = document.getElementById('hand');
  const bagCountEl = document.getElementById('bagCount');
  const scoreValEl = document.getElementById('scoreVal');
  const targetValEl = document.getElementById('targetVal');
  const moneyValEl = document.getElementById('moneyVal');
  const levelValEl = document.getElementById('levelVal');
  const ballQueueEl = document.getElementById('ballQueue');
  const cardHandEl = document.getElementById('cardHand');
  const targetBannerEl = document.getElementById('targetBanner');
  const boardWrapEl = document.querySelector('.board-wrap');
  const discardBtnEl = document.getElementById('discardBtn');
  const discardCountEl = document.getElementById('discardCount');
  let refreshAnimSlots = new Set();
  let boardRevealTimer = null;
  let boardRevealToken = 0;
  discardBtnEl.addEventListener('click', discardHand);
  let placeAnimCell = null; // {r,c} of the block placed by the most recent drop, for the pop-in animation
  let swapAnim = null; // {source:{r,c},target:{r,c}} for two-block movement animation

  function renderBlockArms(container, block){
    container.querySelectorAll('.block-visual').forEach(n=>n.remove());
    const visual = document.createElement('div'); visual.className='block-visual';
    if(block.property) visual.dataset.prop = block.property;
    if(block.enhancement) visual.dataset.enh = block.enhancement;
    const deg = block.rotation*90;
    visual.dataset.deg = deg;
    visual.style.transform = `rotate(${deg}deg)`;
    const hub = document.createElement('div'); hub.className='hub';
    visual.appendChild(hub);
    BASE_SIDES[block.type].forEach(side=>{
      const arm = document.createElement('div');
      arm.className = 'arm arm-' + DIR_NAMES[side];
      visual.appendChild(arm);
    });
    container.appendChild(visual);
    markDebugTarget(container, block, 'block');
    if(block.property) container.style.setProperty('--prop-color', PROP_COLOR[block.property]);
    if(block.enhancement) container.style.setProperty('--enh-color', ENH_COLOR[block.enhancement]);
    container.addEventListener('mouseenter', ()=> showHoverTip(container, blockTooltip(block)));
    container.addEventListener('mouseleave', hideHoverTip);
  }

  function prepareBoardRender(boardReveal){
    state._animateNewHoleConnections = new Set();
    if(!placeAnimCell) return;

    const {r,c}=placeAnimCell;
    const block=state.cells[r][c].block;
    for(const d of [0,1,2,3]){
      const [dx,dy]=DIR_VEC[d], hr=r+dy, hc=c+dx;
      if(hr<0||hr>=state.rows||hc<0||hc>=state.cols || state.cells[hr][hc].type!=='hole' || !block) continue;
      const key=`${hr},${hc},${opposite(d)}`;
      if(openSides(block).includes(d) && !state.holeConnections.has(key)) state._animateNewHoleConnections.add(key);
    }
  }

  function applyBoardCellAnimation(el, r, c, boardReveal, boardHide){
    if(boardReveal){
      const revealIndex = r * state.cols + c;
      const sign = ((r + c) % 2 === 0) ? 1 : -1;
      const angle = sign * (10 + ((r * 3 + c) % 4) * 7);
      el.classList.add('board-reveal-cell');
      el.style.setProperty('--reveal-delay', `${revealIndex * 24}ms`);
      el.style.setProperty('--reveal-rotate', `${angle}deg`);
    } else if(boardHide){
      const hideIndex = (state.rows * state.cols - 1) - (r * state.cols + c);
      const sign = ((r + c) % 2 === 0) ? 1 : -1;
      const angle = sign * (10 + ((r * 3 + c) % 4) * 7);
      el.classList.add('board-hide-cell');
      el.style.setProperty('--hide-delay', `${hideIndex * 24}ms`);
      el.style.setProperty('--hide-rotate', `${angle}deg`);
    }
  }

  function renderNodeCell(el){
    el.dataset.dir = DIR_NAMES[state.node.dir];
    const arm = document.createElement('div'); arm.className = 'arm arm-'+DIR_NAMES[state.node.dir];
    const hub = document.createElement('div'); hub.className='hub';
    el.appendChild(arm); el.appendChild(hub);
    el.addEventListener('click', onNodeClick);
  }

  function renderHoleCell(el, r, c){
    const r2=document.createElement('div'); r2.className='ring r2';
    el.appendChild(r2);
    const nextConnections = new Set();

    for(const d of [0,1,2,3]){
      const [dx,dy]=DIR_VEC[d];
      const nr=r+dy, nc=c+dx;
      if(nr<0||nr>=state.rows||nc<0||nc>=state.cols) continue;
      const nb=state.cells[nr][nc].block;
      if(!nb || !openSides(nb).includes(opposite(d))) continue;
      const key=`${r},${c},${d}`;
      nextConnections.add(key);
      const connector=document.createElement('div');
      connector.className='hole-connector '+DIR_NAMES[d];
      if(state._animateNewHoleConnections?.has(key)) connector.classList.add('forming');
      el.appendChild(connector);
    }

    for(const key of [...state.holeConnections]){
      if(!key.startsWith(`${r},${c},`) || nextConnections.has(key)) continue;
      const d=+key.split(',')[2];
      const connector=document.createElement('div');
      connector.className='hole-connector '+DIR_NAMES[d]+' retracting';
      el.appendChild(connector);
      setTimeout(()=>connector.remove(),scaledDuration(290));
      state.holeConnections.delete(key);
    }
    for(const key of nextConnections) state.holeConnections.add(key);
  }

  function renderBlackCell(el){
    el.classList.add('black-block');
    blackBlockTooltip(el);
  }

  function renderBlockCell(el, r, c, block){
    renderBlockArms(el, block);
    attachBoardBlockDrag(el);
    if(state.targeting && targetKindMatches(state.targeting.def, 'block')){
      el.classList.add('targetable');
      if(state.targeting.targets.some(t=>t.obj===block)) el.classList.add('target-selected');
    }
    if(placeAnimCell && placeAnimCell.r===r && placeAnimCell.c===c){
      el.classList.add('just-placed');
      const visual = el.querySelector('.block-visual');
      if(visual) visual.style.setProperty('--place-deg', (block.rotation*90)+'deg');
    }
  }

  function renderBoardCell(r, c, boardReveal, boardHide){
    const cellData = state.cells[r][c];
    const el = document.createElement('div');
    el.dataset.r=r; el.dataset.c=c;
    el.className = 'cell ' + cellData.type + (cellData.block ? ' hasblock' : '');
    applyBoardCellAnimation(el, r, c, boardReveal, boardHide);

    if(cellData.type==='node'){
      renderNodeCell(el);
    } else if(cellData.type==='hole'){
      renderHoleCell(el, r, c);
    } else if(cellData.type==='black'){
      renderBlackCell(el);
    } else if(cellData.block){
      renderBlockCell(el, r, c, cellData.block);
    }

    boardEl.appendChild(el);
  }

  function renderBoardSwapAnimation(){
    if(!swapAnim) return;
    const anim=swapAnim;
    swapAnim=null;
    requestAnimationFrame(()=>{
      const sourceEl=boardEl.querySelector(`.cell[data-r="${anim.source.r}"][data-c="${anim.source.c}"]`);
      const targetEl=boardEl.querySelector(`.cell[data-r="${anim.target.r}"][data-c="${anim.target.c}"]`);
      if(sourceEl&&targetEl){
        const sFrom=anim.sourceRect, sTo=anim.targetRect, tFrom=anim.targetRect, tTo=anim.sourceRect;
        const sVis=sourceEl.querySelector('.block-visual'), tVis=targetEl.querySelector('.block-visual');
        if(sVis){ sVis.style.setProperty('--from-x', `${sFrom.left-sTo.left}px`); sVis.style.setProperty('--from-y', `${sFrom.top-sTo.top}px`); sVis.style.setProperty('--block-deg', `${(state.cells[anim.source.r][anim.source.c].block.rotation||0)*90}deg`); sVis.style.animation='blockMoveIn calc(.34s / var(--anim-speed)) cubic-bezier(.22,.8,.24,1)'; }
        if(tVis){ tVis.style.setProperty('--from-x', `${tFrom.left-tTo.left}px`); tVis.style.setProperty('--from-y', `${tFrom.top-tTo.top}px`); tVis.style.setProperty('--block-deg', `${(state.cells[anim.target.r][anim.target.c].block.rotation||0)*90}deg`); tVis.style.animation='blockMoveIn calc(.34s / var(--anim-speed)) cubic-bezier(.22,.8,.24,1)'; }
      }
    });
  }

  function scheduleBoardAnimation(boardReveal, boardHide, revealToken, handRowEl){
    if(!boardReveal && !boardHide) return;
    const duration = ((state.rows * state.cols - 1) * 24 + 220) / animationSpeed;
    boardRevealTimer = setTimeout(()=>{
      if(revealToken !== boardRevealToken) return;
      if(boardReveal){
        boardEl.classList.remove('board-reveal-running');
        boardEl.classList.add('board-reveal-complete');
        state._boardReveal = false;
        state._handReveal = false;
        handRowEl?.classList.remove('hand-ui-reveal');
      } else {
        boardEl.classList.remove('board-hide-running');
        state._boardHide = false;
        state._handHide = false;
        handRowEl?.classList.remove('hand-ui-hide');
        if(typeof state._boardHideComplete === 'function') state._boardHideComplete();
      }
      boardRevealTimer = null;
    }, Math.max(0, duration));
  }

  function renderBoard(boardReveal, boardHide, revealToken){
    prepareBoardRender(boardReveal);
    boardEl.style.gridTemplateColumns = `repeat(${state.cols}, 1fr)`;
    boardEl.style.gridTemplateRows = `repeat(${state.rows}, 1fr)`;
    boardWrapEl.style.aspectRatio = `${state.cols} / ${state.rows}`;
    boardEl.innerHTML = '';

    for(let r=0;r<state.rows;r++){
      for(let c=0;c<state.cols;c++) renderBoardCell(r, c, boardReveal, boardHide);
    }

    renderBoardSwapAnimation();
    placeAnimCell = null;
  }

  function renderHUD(){
    bagCountEl.textContent = `Túi khối còn lại: ${formatNumber(state.bag.length)}`;
    discardCountEl.textContent = `(${formatNumber(state.discardsLeft)}/${formatNumber(getMaxDiscards())})`;
    discardBtnEl.disabled = state.discardsLeft<=0 || !state.hand.some(Boolean) || state.resolving || state.phase!=='playing' || !!state.targeting;
    scoreValEl.textContent = formatNumber(state.score);
    targetValEl.textContent = formatNumber(state.target);
    moneyValEl.textContent = formatMoney(state.money);
    levelValEl.textContent = formatNumber(state.level);
  }

  function render(){
    hideHoverTip();
    const boardReveal = !!state._boardReveal;
    const boardHide = !!state._boardHide;
    const revealToken = ++boardRevealToken;
    if(boardRevealTimer){
      clearTimeout(boardRevealTimer);
      boardRevealTimer = null;
    }

    boardEl.classList.toggle('board-reveal-running', boardReveal || boardHide);
    boardEl.classList.toggle('board-hide-running', boardHide);

    const handRowEl = document.querySelector('.hand-row');
    const handReveal = !!state._handReveal && boardReveal;
    const handHide = !!state._handHide && boardHide;
    handRowEl?.classList.toggle('hand-ui-reveal', handReveal);
    handRowEl?.classList.toggle('hand-ui-hide', handHide);
    handRowEl?.classList.toggle('reward-hidden', !!state._handRewardHidden || state.phase==='shop' || state.phase==='reward');
    boardEl.classList.remove('board-reveal-complete');

    renderBoard(boardReveal, boardHide, revealToken);
    handRowEl?.style.setProperty('--hand-delay-last', `${Math.max(0,getMaxHandSize()-1)*24}ms`);
    renderHand();
    scheduleBoardAnimation(boardReveal, boardHide, revealToken, handRowEl);
    renderBallQueue();
    renderCardHand();
    renderHUD();
    refreshAnimSlots.clear();
  }

  function renderHand(){
    handEl.innerHTML = '';
    for(let i=0;i<getMaxHandSize();i++){
      const slot = document.createElement('div');
      slot.style.setProperty('--hand-delay', `${i*24}ms`);
      const block = state.hand[i];
      slot.className = 'hand-slot' + (block ? ' filled' : ' empty-slot');
      slot.dataset.idx = i;
      if(block){
        renderBlockArms(slot, block);
        if(refreshAnimSlots.has(i)) slot.classList.add('just-refreshed');
        attachHandBlockDrag(slot, i);
        if(state.targeting && targetKindMatches(state.targeting.def, 'block')){
          slot.classList.add('targetable');
          if(state.targeting.targets.some(t=>t.obj===block)) slot.classList.add('target-selected');
        }
      }
      handEl.appendChild(slot);
    }
  }

  function syncBallPoolFromQueue(){
    const byId = new Map(state.ballPool.map(b=>[b._id,b]));
    const ordered = [];
    for(const q of state.ballQueue){
      const b = byId.get(q._id);
      if(!b) continue;
      b.property = q.property || null;
      b.enhancement = q.enhancement || null;
      ordered.push(b);
    }
    if(ordered.length===state.ballPool.length) state.ballPool = ordered;
  }

  function syncBallMutationTargets(targets){
    const ballTargets = (targets||[]).filter(t=>t.kind==='ball').map(t=>t.obj).filter(Boolean);
    if(!ballTargets.length) return;

    // Sync by stable ball _id rather than object identity. Some game flows can
    // rebuild/reorder state.ballPool or state.ballQueue, so comparing object
    // references can miss a mutation even when it is the same logical ball.
    const changedById = new Map();
    ballTargets.forEach(ball=>{
      if(!ball._id) return;
      changedById.set(ball._id, {
        property: ball.property || null,
        enhancement: ball.enhancement || null,
      });
    });

    state.ballPool.forEach(ball=>{
      const changed = changedById.get(ball._id);
      if(!changed) return;
      ball.property = changed.property;
      ball.enhancement = changed.enhancement;
    });

    state.ballQueue.forEach(q=>{
      const changed = changedById.get(q._id);
      if(!changed) return;
      q.property = changed.property;
      q.enhancement = changed.enhancement;
    });

    renderBallQueue();
    refreshOpenShop();
    refreshOpenGachaBalls();
  }

  function syncBallQueueFromPool(){
    ensureBallIds();
    const firedIds = new Set(state.ballQueue.filter(b=>b.fired).map(b=>b._id));
    const unfired = state.ballPool.filter(b=>!firedIds.has(b._id));
    let u=0;
    state.ballQueue = state.ballQueue.map(q=>{
      if(q.fired) return q;
      const b=unfired[u++];
      return {_id:b._id, fired:false, property:b.property||null, enhancement:b.enhancement||null};
    });
  }

  let ballClickSelection = null;
  let suppressBallClickUntil = 0;

  function clearBallClickSelection(){
    ballClickSelection = null;
    ballQueueEl.querySelectorAll('.ball-chip.click-selected').forEach(el=>el.classList.remove('click-selected'));
  }

  function handleBallQueueClick(idx){
    if(state.targeting || state.resolving || (state.phase!=='playing' && state.phase!=='shop')) return;
    const ball = state.ballQueue[idx];
    if(!ball || ball.fired || idx < state.ballsFired) return;

    const chip = [...ballQueueEl.children][idx];
    if(ballClickSelection===null){
      ballClickSelection = idx;
      chip?.classList.add('click-selected');
      return;
    }

    if(ballClickSelection===idx){
      clearBallClickSelection();
      return;
    }

    const sourceIdx = ballClickSelection;
    const targetIdx = idx;
    const sourceEl = [...ballQueueEl.children][sourceIdx];
    const targetEl = [...ballQueueEl.children][targetIdx];
    const sourceRect = sourceEl?.getBoundingClientRect();
    const targetRect = targetEl?.getBoundingClientRect();

    [state.ballQueue[sourceIdx], state.ballQueue[targetIdx]] = [state.ballQueue[targetIdx], state.ballQueue[sourceIdx]];
    syncBallPoolFromQueue();
    clearBallClickSelection();

    if(sourceRect && targetRect){
      ballSwapAnim={source:sourceIdx,target:targetIdx,sourceRect,targetRect};
    }
    renderBallQueue();
  }

  function renderBallQueue(){
    ballQueueEl.innerHTML = '';
    state.ballQueue.forEach((b, i)=>{
      const chip = document.createElement('div');
      chip.className = 'ball-chip' + (b.fired ? ' fired' : '');
      chip.dataset.ballIndex = i;
      if(b.property) chip.style.setProperty('--prop-color', PROP_COLOR[b.property]);
      if(b.property) chip.dataset.prop = b.property;
      if(b.enhancement) chip.dataset.enh = b.enhancement;
      chip.textContent = '';
      markDebugTarget(chip, b, 'ball');

      attachObjectTooltip(chip, b, 'ball');

      if(!b.fired && state.targeting && targetKindMatches(state.targeting.def, 'ball')){
        chip.classList.add('targetable');
        chip.addEventListener('click', ()=> handleTargetClick({obj:b, kind:'ball'}));
      }
      if(!b.fired && !state.targeting){
        chip.addEventListener('click', ()=>{
          if(performance.now() < suppressBallClickUntil) return;
          handleBallQueueClick(i);
        });
      }
      if(!b.fired) attachBallDrag(chip, i);
      ballQueueEl.appendChild(chip);
    });
    if(ballSwapAnim){
      const anim=ballSwapAnim;
      ballSwapAnim=null;
      requestAnimationFrame(()=>{
        const sourceEl=[...ballQueueEl.children][anim.source];
        const targetEl=[...ballQueueEl.children][anim.target];
        if(!sourceEl || !targetEl) return;
        const sourceRect=sourceEl.getBoundingClientRect();
        const targetRect=targetEl.getBoundingClientRect();
        const sx=anim.sourceRect.left-sourceRect.left, sy=anim.sourceRect.top-sourceRect.top;
        const tx=anim.targetRect.left-targetRect.left, ty=anim.targetRect.top-targetRect.top;
        sourceEl.style.setProperty('--from-x',`${sx}px`);
        sourceEl.style.setProperty('--from-y',`${sy}px`);
        sourceEl.style.animation='ballMoveIn calc(.34s / var(--anim-speed)) cubic-bezier(.22,.8,.24,1)';
        targetEl.style.setProperty('--from-x',`${tx}px`);
        targetEl.style.setProperty('--from-y',`${ty}px`);
        targetEl.style.animation='ballMoveIn calc(.34s / var(--anim-speed)) cubic-bezier(.22,.8,.24,1)';
      });
    }
  }

  let ballDrag = null;
  let ballSwapAnim = null;

  function attachBallDrag(chip, idx){
    chip.addEventListener('pointerdown', e=>{
      if(state.targeting){ e.preventDefault(); return; }
      if(state.resolving || (state.phase!=='playing' && state.phase!=='shop')) return;
      if(idx < state.ballsFired || state.ballQueue[idx].fired) return;
      startBallDrag(e, idx);
    });
  }

  function startBallDrag(e, idx){
    e.preventDefault();
    ballDrag={idx,startX:e.clientX,startY:e.clientY,targetX:e.clientX,targetY:e.clientY,moved:false,ghostEl:null,sourceEl:null,curX:e.clientX,curY:e.clientY};
    window.addEventListener('pointermove', onBallDragMove);
    window.addEventListener('pointerup', onBallDragEnd);
  }

  function onBallDragMove(e){
    if(!ballDrag) return;
    ballDrag.targetX=e.clientX; ballDrag.targetY=e.clientY;
    const dx=e.clientX-ballDrag.startX, dy=e.clientY-ballDrag.startY;
    if(!ballDrag.moved && Math.hypot(dx,dy)>6){
      ballDrag.moved=true;
      suppressBallClickUntil = performance.now() + 120;
      ballDrag.sourceEl=ballQueueEl.querySelector(`.ball-chip[data-ball-index=\"${ballDrag.idx}\"]`);
      if(!ballDrag.sourceEl){
        ballDrag.sourceEl=[...ballQueueEl.children][ballDrag.idx];
      }
      ballDrag.ghostEl=document.createElement('div');
      ballDrag.ghostEl.className='ball-drag-ghost';
      ballDrag.ghostEl.innerHTML=ballChipMarkup(state.ballQueue[ballDrag.idx]);
      document.body.appendChild(ballDrag.ghostEl);
      if(ballDrag.sourceEl) ballDrag.sourceEl.classList.add('drag-source-fade');
      ballDrag.curX=e.clientX; ballDrag.curY=e.clientY;
      dragGhostLoop(ballDrag);
    }
    if(ballDrag.moved) updateBallDropHover(e.clientX,e.clientY);
  }


  function updateBallDropHover(x,y){
    ballQueueEl.querySelectorAll('.ball-drop-hover').forEach(el=>el.classList.remove('ball-drop-hover'));
    const el=document.elementFromPoint(x,y)?.closest?.('.ball-chip');
    if(!el || el.classList.contains('fired')) return;
    const targetIdx=[...ballQueueEl.children].indexOf(el);
    if(targetIdx>=state.ballsFired && targetIdx!==ballDrag.idx) el.classList.add('ball-drop-hover');
  }


  function onBallDragEnd(e){
    window.removeEventListener('pointermove', onBallDragMove);
    window.removeEventListener('pointerup', onBallDragEnd);
    if(!ballDrag) return;
    if(ballDrag.raf) cancelAnimationFrame(ballDrag.raf);

    const info=ballDrag;
    ballDrag=null;
    ballQueueEl.querySelectorAll('.ball-drop-hover').forEach(el=>el.classList.remove('ball-drop-hover'));

    if(!info.moved){
      info.sourceEl?.classList.remove('drag-source-fade');
      info.ghostEl?.remove();
      return;
    }

    const el=document.elementFromPoint(e.clientX,e.clientY)?.closest?.('.ball-chip');
    const targetIdx=el ? [...ballQueueEl.children].indexOf(el) : -1;
    const sourceIdx=info.idx;
    if(targetIdx>=state.ballsFired && targetIdx!==sourceIdx && !state.ballQueue[targetIdx].fired){
      const sourceRect=info.sourceEl?.getBoundingClientRect();
      const targetEl=[...ballQueueEl.children][targetIdx];
      const targetRect=targetEl?.getBoundingClientRect();
      [state.ballQueue[sourceIdx], state.ballQueue[targetIdx]]=[state.ballQueue[targetIdx],state.ballQueue[sourceIdx]];
      syncBallPoolFromQueue();
      info.sourceEl?.classList.remove('drag-source-fade');
      info.ghostEl?.remove();
