<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>connect run</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --anim-speed: 1;
    --bg: #0a1a2c;
    --bg-deep: #071322;
    --panel: #0f2440;
    --panel-line: rgba(94,200,216,0.14);
    --ink: #e9eef5;
    --ink-dim: #8fa8bf;
    --amber: #f2a65a;
    --amber-dim: rgba(242,166,90,0.35);
    --cyan: #5ec8d8;
    --cyan-dim: rgba(94,200,216,0.35);
    --green: #6fcf97;
    --red: #e85d4e;
    --gold: #f2c94c;
    --cell-gap: 4px;
  }

  *{ box-sizing: border-box; }

  /* Custom scrollbars — keep every scrollable surface consistent with the game's UI. */
  *{
    scrollbar-width: thin;
    scrollbar-color: rgba(94,200,216,.45) rgba(255,255,255,.035);
  }
  *::-webkit-scrollbar{ width:8px; height:8px; }
  *::-webkit-scrollbar-track{ background:rgba(255,255,255,.035); border-radius:999px; }
  *::-webkit-scrollbar-thumb{
    background:rgba(94,200,216,.45);
    border:2px solid transparent;
    background-clip:padding-box;
    border-radius:999px;
  }
  *::-webkit-scrollbar-thumb:hover{ background:rgba(94,200,216,.7); border:2px solid transparent; background-clip:padding-box; }
  *::-webkit-scrollbar-corner{ background:transparent; }


  html,body{
    margin:0; padding:0;
    background:
      radial-gradient(circle at 20% 10%, rgba(94,200,216,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(242,166,90,0.05), transparent 45%),
      var(--bg);
    color: var(--ink);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    min-height: 100vh;
  }

  body{ display:flex; flex-direction:column; align-items:center; padding: 18px 12px 40px; gap: 12px; }

  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--panel-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--panel-line) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events:none; opacity:0.5; z-index:0;
  }

  .app{
    position:relative; z-index:1; width:100%; max-width: 520px;
    display:flex; flex-direction:column; align-items:center; gap:12px;
  }

  header.hud{
    width:100%; background: var(--panel);
    border: 1px solid var(--panel-line); border-radius: 10px;
    padding: 12px 16px;
    display:flex; flex-wrap: wrap; align-items:center; justify-content: space-between;
    gap: 8px 16px;
  }

  .logo{
    font-family:'JetBrains Mono', monospace; font-weight:700; letter-spacing: 2px; font-size: 14px;
    color: var(--cyan); text-shadow: 0 0 10px var(--cyan-dim); white-space: nowrap;
  }

  .stats{ display:flex; gap: 14px; flex-wrap: wrap; }
  .stat{ display:flex; flex-direction:column; gap:1px; }
  .stat .label{ font-size: 9px; letter-spacing: 1px; color: var(--ink-dim); text-transform: uppercase; }
  .stat .value{ font-family:'JetBrains Mono', monospace; font-size: 15px; font-weight:600; }
  .stat.score .value{ color: var(--amber); }
  .stat.target .value{ color: var(--ink); }
  .stat.money .value{ color: var(--gold); }
  .stat.level .value{ color: var(--ink); }

  button{
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size: 13px;
    border-radius: 7px; border: 1px solid var(--cyan-dim);
    background: rgba(94,200,216,0.08); color: var(--cyan);
    padding: 7px 12px; cursor:pointer; transition: background .15s, transform .1s;
  }
  button:hover{ background: rgba(94,200,216,0.18); }
  button:active{ transform: scale(0.96); }
  /* Shop controls should not visually 'pop' while being used. */
  .shop-layer button:active{ transform:none; }
  button:focus-visible{ outline: 2px solid var(--cyan); outline-offset:2px; }
  button:disabled{ opacity:0.32; cursor:not-allowed; }
  button.gold{ border-color: rgba(242,201,76,0.4); color: var(--gold); background: rgba(242,201,76,0.08); }
  button.gold:hover{ background: rgba(242,201,76,0.18); }

  .speed-control{ display:flex; align-items:center; gap:6px; }
  .speed-control .speed-label{ font-size:9px; letter-spacing:1px; color:var(--ink-dim); text-transform:uppercase; }
  .speed-control select{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px;
    border-radius:7px; border:1px solid var(--cyan-dim);
    background:rgba(94,200,216,0.08); color:var(--cyan);
    padding:6px 8px; cursor:pointer;
  }
  .speed-control select:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }

  .ball-queue{ display:flex; gap: 8px; flex-wrap: wrap; justify-content:center; position:relative; z-index:110; }
  .ball-chip{
    width: 28px; height:28px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--amber) 65%);
    box-shadow: 0 0 8px 2px var(--amber-dim);
    overflow:hidden;
    position:relative; display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace; font-size: 8px; font-weight:700; color: #0a1a2c;
    cursor: default;
  }
  .ball-chip.fired{ background: rgba(255,255,255,0.06); box-shadow:none; color: var(--ink-dim); opacity: 0.5; }
  .ball-chip[data-prop]:not(.fired){ box-shadow:0 0 0 1px var(--prop-color); }
  .ball-chip[data-prop=steel]:not(.fired){ background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.8) 0 2px,transparent 22%),#c7cdd3; box-shadow:0 0 7px rgba(255,255,255,.18); }
  .ball-chip[data-prop=stone]:not(.fired){ background:#777; background-image:radial-gradient(circle at 34% 28%,rgba(255,255,255,.8) 0 2px,transparent 22%),radial-gradient(circle at 20% 30%,rgba(255,255,255,.2) 0 1px,transparent 1px),radial-gradient(circle at 70% 65%,rgba(0,0,0,.22) 0 1px,transparent 1px); background-size:auto,7px 6px,8px 7px; box-shadow:0 0 7px rgba(255,255,255,.12); }
  .ball-chip[data-prop=gold]:not(.fired){ background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.8) 0 2px,transparent 22%),#f2c94c; box-shadow:0 0 7px rgba(242,201,76,.3); }
  .ball-chip[data-prop=wood]:not(.fired){ background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.78) 0 2px,transparent 22%),#b8895a; box-shadow:0 0 7px rgba(255,255,255,.12); }
  .ball-chip[data-prop=glass]:not(.fired){ background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.82) 0 2px,transparent 22%),transparent; border:1px solid rgba(255,255,255,.95); box-shadow:0 0 8px rgba(255,255,255,.2); overflow:hidden; }
  .ball-chip[data-prop=glass]:not(.fired)::after{ content:""; position:absolute; inset:1px; border-radius:50%; pointer-events:none; background:linear-gradient(120deg,transparent 25%,rgba(255,255,255,.7) 45%,transparent 58%); }
  .ball-chip[data-prop=striped]:not(.fired){ background:#c94848; background-image:radial-gradient(circle at 34% 28%,rgba(255,255,255,.8) 0 2px,transparent 22%),repeating-linear-gradient(135deg,rgba(255,255,255,.16) 0 3px,transparent 3px 7px); box-shadow:0 0 7px rgba(255,255,255,.12); }
  .ball-chip[data-prop=grid]:not(.fired){ background:#3976b9; background-image:radial-gradient(circle at 34% 28%,rgba(255,255,255,.8) 0 2px,transparent 22%),linear-gradient(rgba(255,255,255,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.2) 1px,transparent 1px); background-size:auto,6px 6px,6px 6px; box-shadow:0 0 7px rgba(255,255,255,.12); }
  .ball-chip[data-enh=holo]:not(.fired){ box-shadow:0 0 0 1px rgba(47,128,237,.7); }
  .ball-chip[data-enh=holo]:not(.fired)::before{ content:""; position:absolute; inset:0; border-radius:50%; pointer-events:none; background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.78) 0 1px,rgba(255,255,255,.08) 1px 6px); }
  .ball-chip::after{ content:""; position:absolute; inset:0; border-radius:50%; pointer-events:none; background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.78) 0%,rgba(255,255,255,.32) 16%,transparent 42%); }
  .ball-chip[data-prop=glass]:not(.fired)::after{ background:linear-gradient(120deg,transparent 25%,rgba(255,255,255,.72) 45%,transparent 58%); }
  .ball-chip[data-enh=invert]:not(.fired){ filter:invert(1); }
  .ball-chip.targetable{ cursor:pointer; animation: targetPulse calc(1s / var(--anim-speed)) ease-in-out infinite; }
  .ball-queue .ball-chip:not(.fired){ cursor:grab; }
  .ball-queue .ball-chip:not(.fired):active{ cursor:grabbing; }
  .ball-chip.ball-drop-hover{ box-shadow:0 0 0 2px var(--cyan),0 0 9px rgba(94,200,216,.55) !important; }
  .ball-chip.click-selected{ box-shadow:0 0 0 2px var(--green),0 0 11px rgba(111,207,151,.6) !important; }
  .ball-chip.shop-ball-preview{ width:34px; height:34px; font-size:9px; }
  .gacha-opt .ball-chip.shop-ball-preview{ margin:0 auto 6px; }
  .ball-drag-ghost{ position:fixed; width:34px; height:34px; pointer-events:none; z-index:160; opacity:.95; transform:translate(-50%,-50%); filter:drop-shadow(0 16px 22px rgba(0,0,0,.5)); }
  @keyframes ballMoveIn{ from{ transform:translate(var(--from-x),var(--from-y)) scale(1.08); opacity:.82; } to{ transform:translate(0,0) scale(1); opacity:1; } }
  @keyframes targetPulse{ 0%,100%{ box-shadow:0 0 0 2px var(--green),0 0 8px 2px var(--green);} 50%{ box-shadow:0 0 0 2px var(--green),0 0 14px 6px var(--green);} }

  .card-hand{ width:100%; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .card-hand.shop-active{ position:relative; z-index:101; pointer-events:auto; }
  .power-card-chip{
    display:flex; align-items:center; gap:8px;
    background: var(--panel); border:1px solid var(--panel-line); border-radius:7px;
    padding:6px 10px; font-size:12px;
  }
  .power-card-chip .name{ color:var(--cyan); font-weight:600; }
  .power-card-chip .card-actions{ display:flex; align-items:center; gap:6px; }
  .power-card-chip .sell-card-btn{ border-color:rgba(232,93,78,.45); color:var(--red); background:rgba(232,93,78,.08); }
  .power-card-chip .sell-card-btn:hover{ background:rgba(232,93,78,.16); }
  .card-hand .tag-empty{ font-size:11px; color:var(--ink-dim); }

  .target-banner{
    position:fixed; top:10px; left:50%; transform:translateX(-50%);
    background: var(--panel); border:1px solid var(--amber-dim); border-radius:8px;
    padding:8px 14px; display:flex; align-items:center; gap:10px;
    font-size:13px; color:var(--amber); z-index: 210; pointer-events:auto; box-shadow:0 4px 20px rgba(0,0,0,0.4);
  }
  .target-banner.hidden{ display:none; }

  .board-wrap{ position:relative; width: min(92vw, 460px); aspect-ratio: 1 / 1; }

  .discard-row{ display:flex; justify-content:center; align-items:center; gap:8px; }
  .discard-btn{ border-color:var(--red); color:var(--red); }
  .discard-btn:disabled{ opacity:.4; cursor:not-allowed; }

  .board{
    position:relative; z-index:1; width:100%; height:100%; display:grid; gap: var(--cell-gap);
    background: var(--bg-deep); border: 1px solid var(--panel-line); border-radius: 10px;
    padding: var(--cell-gap); box-shadow: inset 0 0 30px rgba(0,0,0,0.4);
  }

  @keyframes placeIn{
    0%{ transform: scale(0.4) rotate(var(--place-deg,0deg)); opacity:0.2; }
    65%{ transform: scale(1.15) rotate(var(--place-deg,0deg)); opacity:1; }
    100%{ transform: scale(1) rotate(var(--place-deg,0deg)); opacity:1; }
  }
  .cell.just-placed .block-visual{ animation: placeIn calc(.32s / var(--anim-speed)) cubic-bezier(.34,1.56,.64,1); }

  .cell{
    position:relative;
    container-type:size; background: rgba(255,255,255,0.02);
    border: 1px dashed rgba(94,200,216,0.12); border-radius: 5px; touch-action: none;
  }
  .cell.board-reveal-cell{
    opacity:0;
    transform:scale(.02) rotate(var(--reveal-rotate, 0deg));
    transform-origin:center center;
    animation:boardCellReveal calc(.22s / var(--anim-speed)) cubic-bezier(.22,.9,.24,1.18) var(--reveal-delay,0ms) forwards;
  }
  @keyframes boardCellReveal{
    0%{ opacity:0; transform:scale(.02) rotate(var(--reveal-rotate, 0deg)); }
    68%{ opacity:1; transform:scale(1.08) rotate(calc(var(--reveal-rotate, 0deg) * .35)); }
    100%{ opacity:1; transform:scale(1) rotate(0deg); }
  }
  .board.board-reveal-running{ pointer-events:none; }
  .cell.board-hide-cell{
    opacity:1;
    transform:scale(1) rotate(0deg);
    transform-origin:center center;
    animation:boardCellHide calc(.22s / var(--anim-speed)) cubic-bezier(.55,.08,.68,.53) var(--hide-delay,0ms) forwards;
  }
  @keyframes boardCellHide{
    0%{ opacity:1; transform:scale(1) rotate(0deg); }
    32%{ opacity:1; transform:scale(1.06) rotate(calc(var(--hide-rotate, 0deg) * .35)); }
    100%{ opacity:0; transform:scale(.02) rotate(var(--hide-rotate, 0deg)); }
  }
  .board.board-hide-running{ pointer-events:none; }
  .cell.empty.drop-hover,.cell.hasblock.drop-hover{ background: rgba(94,200,216,0.14); border-color: var(--cyan); }
  .cell.hasblock{ cursor: grab; border-style: solid; border-color: rgba(94,200,216,0.08); }
  .cell.hasblock:active{ cursor: grabbing; }

  /* Locked cells: blocks placed here cannot be dragged or rotated until the level ends. */
  .cell.locked-cell{
    background:rgba(255,92,136,0.10);
    border-color:rgba(255,92,136,0.72);
    box-shadow:inset 0 0 12px rgba(255,92,136,0.14);
  }
  .cell.locked-cell.hasblock{
    cursor:default !important;
  }
  .cell.locked-cell.hasblock .block-visual{
    cursor:default;
  }
  .cell.locked-cell.hasblock::after{
    content:"";
    position:absolute; inset:0;
    border-radius:inherit;
    background:rgba(255,79,131,.11);
    pointer-events:none;
    z-index:10;
  }
  .cell.locked-cell.hasblock.locked-block-feedback .block-visual{
    animation:lockedBlockShakePulse calc(.42s / var(--anim-speed)) cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes lockedBlockShakePulse{
    0%{ transform:scale(1) rotate(var(--block-base-rotation,0deg)); filter:drop-shadow(0 0 0 rgba(255,79,131,0)); }
    18%{ transform:scale(1.05) translateX(-2px) rotate(calc(var(--block-base-rotation,0deg) - 4deg)); filter:drop-shadow(0 0 4px rgba(255,79,131,.75)); }
    36%{ transform:scale(.98) translateX(2px) rotate(calc(var(--block-base-rotation,0deg) + 4deg)); filter:drop-shadow(0 0 7px rgba(255,79,131,.9)); }
    54%{ transform:scale(1.03) translateX(-1.5px) rotate(calc(var(--block-base-rotation,0deg) - 2.5deg)); filter:drop-shadow(0 0 5px rgba(255,79,131,.8)); }
    72%{ transform:scale(1.01) translateX(1px) rotate(calc(var(--block-base-rotation,0deg) + 1.5deg)); filter:drop-shadow(0 0 4px rgba(255,79,131,.65)); }
    100%{ transform:scale(1) translateX(0) rotate(var(--block-base-rotation,0deg)); filter:drop-shadow(0 0 0 rgba(255,79,131,0)); }
  }

  .cell-lock-icon{
    position:absolute;
    top:3px;
    right:3px;
    width:16px;
    height:18px;
    z-index:20;
    pointer-events:none;
    color:rgba(255,92,136,0.35);
    opacity:0.35;
    transform-origin:50% 70%;
    filter:drop-shadow(0 1px 2px rgba(255,92,136,0.12));
  }
  .cell-lock-icon::before{
    content:"";
    position:absolute;
    left:4px; top:1px;
    width:8px; height:9px;
    border:2px solid currentColor;
    border-bottom:0;
    border-radius:7px 7px 0 0;
    box-sizing:border-box;
  }
  .cell-lock-icon::after{
    content:"";
    position:absolute;
    left:1px; top:7px;
    width:14px; height:10px;
    border-radius:3px;
    background:currentColor;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
  }
  .cell-lock-icon .lock-keyhole{
    position:absolute;
    left:7px; top:10px;
    width:2px; height:4px;
    border-radius:2px;
    background:rgba(25,15,20,.75);
    z-index:2;
  }
  .cell-lock-icon.is-empty{
    animation:lockedIconFloat 1.9s ease-in-out infinite;
  }
  .cell-lock-icon.is-filled{
    color:#ff4f83;
    opacity:1;
    filter:drop-shadow(0 0 3px rgba(255,79,131,.48));
  }
  @keyframes lockedIconFloat{
    0%,100%{ transform:translateY(0) rotate(-8deg); }
    50%{ transform:translateY(-2px) rotate(8deg); }
  }
  .cell.targetable{ cursor:pointer; animation: cellTargetPulse calc(1s / var(--anim-speed)) ease-in-out infinite; }
  @keyframes cellTargetPulse{ 0%,100%{ box-shadow:inset 0 0 0 2px var(--green);} 50%{ box-shadow:inset 0 0 0 2px var(--green), 0 0 10px var(--green);} }

  /* Debuff cells are adverse cells that keep normal block geometry but disable
     every gameplay effect of the block placed on them. */
  .cell.debuff-cell{
    background:rgba(255,88,54,0.12);
    border-color:rgba(255,88,54,0.80);
    box-shadow:inset 0 0 14px rgba(255,88,54,0.18);
  }
  .cell-debuff-x{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    pointer-events:none;
    color:rgba(255,72,48,0.35);
    font-family:'JetBrains Mono',monospace;
    font-size:min(88cqw, 88cqh);
    line-height:1;
    font-weight:900;
    text-shadow:0 0 6px rgba(255,72,48,.14);
  }
  .cell.debuff-cell.hasblock .cell-debuff-x{
    color:rgba(255,72,48,0.52);
    text-shadow:0 0 5px rgba(255,72,48,.20);
  }
  /* Debuff X feedback: the four ends of the X extend outward from its center. */
  .cell-debuff-x{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    z-index:50; pointer-events:none; color:rgba(255,72,48,0.35);
    line-height:1; font-weight:900; text-shadow:0 0 6px rgba(255,72,48,.14);
  }
  .cell.debuff-cell.hasblock .cell-debuff-x{ color:rgba(255,72,48,0.52); text-shadow:0 0 5px rgba(255,72,48,.20); }
  .cell-debuff-x::before, .cell-debuff-x::after{
    --x-arm-rotate:45deg; content:""; position:absolute; left:50%; top:50%; width:76%; height:10%;
    border-radius:999px; background:currentColor; box-shadow:0 0 5px rgba(255,72,48,.12); transform-origin:center center;
    transform:translate(-50%,-50%) rotate(var(--x-arm-rotate)) scaleX(.18);
  }
  .cell-debuff-x::after{ --x-arm-rotate:-45deg; }
  .cell-debuff-x.debuff-x-grow::before, .cell-debuff-x.debuff-x-grow::after{ animation:debuffXReachOut calc(.30s / var(--anim-speed)) cubic-bezier(.22,.9,.24,1.05) both; }
  .cell-debuff-x.debuff-x-shrink::before, .cell-debuff-x.debuff-x-shrink::after{ animation:debuffXReachIn calc(.22s / var(--anim-speed)) cubic-bezier(.55,.08,.68,.53) both; }
  @keyframes debuffXReachOut{
    0%{ transform:translate(-50%,-50%) rotate(var(--x-arm-rotate)) scaleX(.18); }
    72%{ transform:translate(-50%,-50%) rotate(var(--x-arm-rotate)) scaleX(1.12); }
    100%{ transform:translate(-50%,-50%) rotate(var(--x-arm-rotate)) scaleX(1); }
  }
  @keyframes debuffXReachIn{
    0%{ transform:translate(-50%,-50%) rotate(var(--x-arm-rotate)) scaleX(1); }
    28%{ transform:translate(-50%,-50%) rotate(var(--x-arm-rotate)) scaleX(1.06); }
    100%{ transform:translate(-50%,-50%) rotate(var(--x-arm-rotate)) scaleX(.18); }
  }
  .cell.debuff-cell.hasblock.debuff-block-feedback .block-visual{ animation:debuffBlockShake calc(.36s / var(--anim-speed)) cubic-bezier(.34,1.56,.64,1); }
  @keyframes debuffBlockShake{
    0%{ transform:rotate(var(--block-base-rotation,0deg)) translateX(0); }
    18%{ transform:rotate(calc(var(--block-base-rotation,0deg) - 4deg)) translateX(-2px); }
    36%{ transform:rotate(calc(var(--block-base-rotation,0deg) + 4deg)) translateX(2px); }
    54%{ transform:rotate(calc(var(--block-base-rotation,0deg) - 2.5deg)) translateX(-1.5px); }
    72%{ transform:rotate(calc(var(--block-base-rotation,0deg) + 1.5deg)) translateX(1px); }
    100%{ transform:rotate(var(--block-base-rotation,0deg)) translateX(0); }
  }

  .cell.blocked-flash{ animation: flashRed calc(.4s / var(--anim-speed)) ease; }
  @keyframes flashRed{ 0%,100%{ background: rgba(255,255,255,0.02); } 40%{ background: rgba(232,93,78,0.35); } }
  .cell.black-block{
    background: #050505;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: inset 0 0 16px rgba(0,0,0,.95);
    cursor: not-allowed;
  }
  .cell.black-block::after{
    content:""; position:absolute; inset:13%; border-radius:4px;
    background:radial-gradient(circle,rgba(255,255,255,.035),transparent 68%);
    pointer-events:none;
  }

  .block-visual{ position:absolute; inset:0; transition: transform calc(.28s / var(--anim-speed)) cubic-bezier(.34,1.56,.64,1); transform-origin: 50% 50%; }
  .arm{ position:absolute; background: var(--cyan); box-shadow: 0 0 7px var(--cyan-dim); border-radius: 3px; }

  /* Mini-blocks use the same property/enhancement appearance as board blocks. */
  .mini-block[data-prop=steel] .arm, .mini-block[data-prop=steel] .hub{ background:#c7cdd3; box-shadow:none; }

  .debug-overlay{ position:fixed; inset:0; background:rgba(7,19,34,.78); display:flex; align-items:flex-start; justify-content:center; z-index:1000; overflow-y:auto; padding:24px 14px; }
  .debug-overlay.hidden{ display:none; }
  .debug-panel{ width:min(92vw,420px); background:var(--panel); border:1px solid var(--red); border-radius:12px; padding:16px; box-shadow:0 18px 50px rgba(0,0,0,.55); }
  .debug-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .debug-head h2{ margin:0; color:var(--red); font-family:'JetBrains Mono',monospace; font-size:15px; letter-spacing:1px; }
  .debug-close{ border-color:rgba(232,93,78,.45); color:var(--red); }
  .debug-section{ margin-top:12px; padding-top:12px; border-top:1px solid var(--panel-line); }
  .debug-label{ display:block; margin-bottom:6px; color:var(--ink-dim); font-size:11px; }
  .debug-money-row,.debug-select-row{ display:flex; gap:8px; align-items:center; }
  .debug-money-row input,.debug-select{ flex:1; min-width:0; width:100%; background:var(--bg-deep); color:var(--ink); border:1px solid var(--panel-line); border-radius:7px; padding:8px 9px; font:12px 'JetBrains Mono',monospace; }
  .debug-money-row input:focus,.debug-select:focus{ outline:1px solid var(--cyan); }
  .debug-target{ min-height:42px; background:rgba(255,255,255,.03); border:1px solid var(--panel-line); border-radius:8px; padding:9px; font:11px/1.5 'JetBrains Mono',monospace; color:var(--ink-dim); }
  .debug-target strong{ color:var(--cyan); }
  .debug-actions{ display:flex; gap:8px; margin-top:10px; }
  .debug-actions button{ flex:1 1 0; }
  .debug-apply{ border-color:var(--green); color:var(--green); background:rgba(111,207,151,.08); }
  .debug-apply:hover{ background:rgba(111,207,151,.16); }
  .debug-hint{ margin:8px 0 0; color:var(--ink-dim); font-size:10px; text-align:center; }
  .debug-none{ color:var(--ink-dim); }

  @media (prefers-reduced-motion: reduce){
    .ball{ transition: none; }
    .ring{ animation: none; }
    .cell-debuff-x.debuff-x-grow::before,
    .cell-debuff-x.debuff-x-grow::after,
    .cell-debuff-x.debuff-x-shrink::before,
    .cell-debuff-x.debuff-x-shrink::after,
    .cell.debuff-cell.hasblock.debuff-block-feedback .block-visual{
      animation:none !important;
    }
    .cell-debuff-x{ transform:scaleX(1); }
    .cell.board-reveal-cell{ animation:none; opacity:1; transform:none; }
    .cell.board-hide-cell{ animation:none; opacity:0; transform:scale(.02) rotate(var(--hide-rotate,0deg)); }
    .board.board-reveal-running,.board.board-hide-running{ pointer-events:auto; }
  }

  @media(max-width:620px){
    .shop-common-grid{ grid-template-columns:1fr; }
    .shop-lower{ grid-template-columns:1fr; }
    body, body *{ -webkit-user-select:none; user-select:none; }
    .hand-row{ gap:6px; }
    .hand{ flex:1 1 auto; gap:6px; }
    .hand-slot{ width:auto; height:auto; aspect-ratio:1; }
    .discard-row{ flex:0 0 auto; }
    .discard-btn{ padding:6px 9px; font-size:12px; white-space:nowrap; }
  }

  /* Canonical ball appearance: keep queue/shop previews aligned with the in-board ball. */
  .ball-chip{
    background:radial-gradient(circle at 34% 28%, #fff8ec 0%, #ffe6c5 22%, var(--amber) 62%, #d9822b 100%);
    box-shadow:0 2px 7px rgba(0,0,0,.22),0 0 8px var(--amber-dim);
    overflow:hidden;
  }
  .ball-chip::before{
    content:""; position:absolute; inset:0; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.78) 0%,rgba(255,255,255,.30) 16%,transparent 44%); z-index:2;
  }
  .ball-chip[data-prop=steel]{background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.8) 0 2px,transparent 22%),#c7cdd3;box-shadow:0 2px 7px rgba(0,0,0,.22),0 0 7px rgba(255,255,255,.15)}
  .ball-chip[data-prop=striped]{background:#c94848;background-image:radial-gradient(circle at 34% 28%,rgba(255,255,255,.78) 0 2px,transparent 22%),repeating-linear-gradient(135deg,rgba(255,255,255,.16) 0 3px,transparent 3px 7px);box-shadow:0 2px 7px rgba(0,0,0,.22),0 0 6px rgba(255,255,255,.1)}
  .ball-chip[data-prop=grid]{background:#3976b9;background-image:radial-gradient(circle at 34% 28%,rgba(255,255,255,.78) 0 2px,transparent 22%),linear-gradient(rgba(255,255,255,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.2) 1px,transparent 1px);background-size:auto,6px 6px,6px 6px;box-shadow:0 2px 7px rgba(0,0,0,.22),0 0 6px rgba(255,255,255,.1)}
  .ball-chip[data-prop=gold]{background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.8) 0 2px,transparent 22%),#f2c94c;box-shadow:0 2px 7px rgba(0,0,0,.22),0 0 8px rgba(242,201,76,.3)}
  .ball-chip[data-prop=glass]{background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.82) 0 2px,transparent 22%),transparent;border:1px solid rgba(255,255,255,.9);box-shadow:0 0 8px rgba(255,255,255,.22)}
  .ball-chip[data-prop=glass]::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:linear-gradient(120deg,transparent 25%,rgba(255,255,255,.7) 45%,transparent 58%)}
  .ball-chip[data-enh=holo]{box-shadow:0 0 5px rgba(47,128,237,.32)}
  .ball-chip[data-enh=holo]::before{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.78) 0 1px,rgba(255,255,255,.08) 1px 6px)}
  .ball-chip[data-enh=invert]{filter:invert(1)}

  /* Requested enhancement appearance adjustments. */
  .ball[data-enh=holo]::before{
    background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.78) 0 1px,rgba(255,255,255,.08) 1px 6px);
  }
  .ball-chip[data-enh=holo]::before{
    background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.78) 0 1px,rgba(255,255,255,.08) 1px 6px);
  }
  .gacha-opt .mini-ball[data-enh=holo]::before{
    background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.78) 0 1px,rgba(255,255,255,.08) 1px 6px);
    mix-blend-mode:screen;
  }

  /* ================================================================
     LẤP LÁNH / SPARK — RARE RADIANT STYLE
     ================================================================ */
  .ball-chip[data-enh=spark]::before,
  .ball[data-enh=spark]::before,
  .mini-ball[data-enh=spark]::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    pointer-events:none;
    background-image:
      repeating-linear-gradient(55deg,
        rgba(255,161,158,.92) 0%,
        rgba(85,178,255,.92) 16.66%,
        rgba(255,199,146,.92) 33.33%,
        rgba(130,255,213,.92) 50%,
        rgba(253,170,240,.92) 66.66%,
        rgba(148,241,255,.92) 83.33%,
        rgba(255,161,158,.92) 100%),
      repeating-linear-gradient(45deg,
        rgba(8,8,12,.82) 0 7%,
        rgba(45,45,55,.72) 7% 10%,
        rgba(120,120,135,.74) 10% 12%,
        rgba(10,10,15,.86) 12% 18%),
      repeating-linear-gradient(-45deg,
        rgba(8,8,12,.78) 0 8%,
        rgba(65,65,78,.68) 8% 11%,
        rgba(155,155,170,.66) 11% 13%,
        rgba(8,8,12,.84) 13% 20%);
    background-size:420% 420%, 240% 240%, 240% 240%;
    background-position:
      calc(((50% - var(--posx,50%)) * 2.2) + 50%) calc(((50% - var(--posy,50%)) * 2.2) + 50%),
      50% 50%,
      50% 50%;
    background-blend-mode:color-dodge,darken,color-dodge;
    mix-blend-mode:color-dodge;
    opacity:.82;
    filter:brightness(calc(.84 + (var(--hyp,0) * .16))) contrast(2.8) saturate(1.35);
    animation:sparkRadiantSweep calc(4.2s / var(--anim-speed)) linear infinite;
  }

  .mini-block[data-enh=spark] .arm::after,
  .mini-block[data-enh=spark] .hub::after,
  .block-visual[data-enh=spark] .arm::after,
  .block-visual[data-enh=spark] .hub::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    pointer-events:none;
    background-image:
      repeating-linear-gradient(55deg,
        rgba(255,161,158,.94) 0%,
        rgba(85,178,255,.94) 16.66%,
        rgba(255,199,146,.94) 33.33%,
        rgba(130,255,213,.94) 50%,
        rgba(253,170,240,.94) 66.66%,
        rgba(148,241,255,.94) 83.33%,
        rgba(255,161,158,.94) 100%),
      repeating-linear-gradient(45deg,
        rgba(10,10,15,.86) 0 8%,
        rgba(70,70,80,.70) 8% 11%,
        rgba(155,155,170,.66) 11% 13%,
        rgba(5,5,10,.88) 13% 20%),
      repeating-linear-gradient(-45deg,
        rgba(10,10,15,.82) 0 8%,
        rgba(70,70,80,.66) 8% 11%,
        rgba(155,155,170,.62) 11% 13%,
        rgba(5,5,10,.86) 13% 20%);
    background-size:400% 400%, 210% 210%, 210% 210%;
    background-position:0% 0%,50% 50%,50% 50%;
    background-blend-mode:exclusion,darken,color-dodge;
    /* Keep the same rainbow colors as the ball spark effect.
       The old color-dodge on the whole block overlay made the cyan block
       base overexpose the rainbow into near-white. */
    mix-blend-mode:normal;
    opacity:.92;
    filter:brightness(.98) contrast(2.65) saturate(1.2);
    animation:sparkRadiantSweep calc(4.2s / var(--anim-speed)) linear infinite;
  }

  @keyframes sparkRadiantSweep{
    0%{
      background-position:0% 50%, 35% 50%, 65% 50%;
    }
    50%{
      background-position:50% 45%, 65% 55%, 35% 45%;
    }
    100%{
      background-position:100% 50%, 95% 50%, 5% 50%;
    }
  }

  .ball-chip[data-enh=holo]::before,
  .ball[data-enh=holo]::before,
  .mini-ball[data-enh=holo]::before {
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    pointer-events:none;
    --space:6%;
    --angle:133deg;
    --imgsize:60% 30%;
    background-image:
      var(--Vmaxbg),
      repeating-linear-gradient(-33deg,
        rgb(206,42,36) calc(var(--space)*1),
        rgb(157,170,223) calc(var(--space)*2),
        rgb(45,153,146) calc(var(--space)*3),
        rgb(29,151,36) calc(var(--space)*4),
        rgb(181,64,228) calc(var(--space)*5),
        rgb(206,42,36) calc(var(--space)*6)
      ),
      repeating-linear-gradient(var(--angle),
        rgba(14,21,46,.5) 0%,
        hsl(180,10%,50%) 2.5%,
        hsl(83,50%,35%) 5%,
        hsl(180,10%,50%) 7.5%,
        rgba(14,21,46,.5) 10%,
        rgba(14,21,46,.5) 15%
      ),
      radial-gradient(farthest-corner circle at 50% 50%,
        rgba(6,218,255,.6) 0%,
        rgba(38,235,127,.6) 25%,
        rgba(155,78,228,.6) 50%,
        rgba(228,78,90,.6) 75%
      );
    background-blend-mode:color-burn,screen,soft-light;
    background-size:var(--imgsize),1100% 1100%,600% 600%,200% 200%;
    background-position:center,0% 50%,50% 50%,50% 50%;
    mix-blend-mode:color-dodge;
    opacity:.9;
    filter:brightness(.5) contrast(2.5) saturate(.6);
    animation:holoVmaxGameSweep calc(3.6s / var(--anim-speed)) linear infinite;
    z-index:3;
  }

  .ball-chip[data-enh=holo]::before,
  .ball[data-enh=holo]::before,
  .mini-ball[data-enh=holo]::before {
    background-position:center,0% 50%,0% 50%,0% 50%;
  }

  .mini-block[data-enh=holo] .arm::after,
  .mini-block[data-enh=holo] .hub::after,
  .block-visual[data-enh=holo] .arm::after,
  .block-visual[data-enh=holo] .hub::after {
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    pointer-events:none;
    --space:6%;
    --angle:133deg;
    --imgsize:60% 30%;
    background-image:
      var(--Vmaxbg),
      repeating-linear-gradient(-33deg,
        rgb(206,42,36) calc(var(--space)*1),
        rgb(157,170,223) calc(var(--space)*2),
        rgb(45,153,146) calc(var(--space)*3),
        rgb(29,151,36) calc(var(--space)*4),
        rgb(181,64,228) calc(var(--space)*5),
        rgb(206,42,36) calc(var(--space)*6)
      ),
      repeating-linear-gradient(var(--angle),
        rgba(14,21,46,.5) 0%,
        hsl(180,10%,50%) 2.5%,
        hsl(83,50%,35%) 5%,
        hsl(180,10%,50%) 7.5%,
        rgba(14,21,46,.5) 10%,
        rgba(14,21,46,.5) 15%
      ),
      radial-gradient(farthest-corner circle at 50% 50%,
        rgba(6,218,255,.6) 0%,
        rgba(38,235,127,.6) 25%,
        rgba(155,78,228,.6) 50%,
        rgba(228,78,90,.6) 75%
      );
    background-blend-mode:color-burn,screen,soft-light;
    background-size:var(--imgsize),1100% 1100%,600% 600%,200% 200%;
    background-position:center,0% 50%,0% 50%,0% 50%;
    mix-blend-mode:color-dodge;
    opacity:.88;
    filter:brightness(.5) contrast(2.5) saturate(.6);
    animation:holoVmaxGameSweep calc(3.6s / var(--anim-speed)) linear infinite;
  }

  @keyframes holoVmaxGameSweep {
    0% { background-position:center,0% 50%,0% 50%,0% 50%; }
    50% { background-position:center,55% 42%,65% 58%,50% 50%; }
    100% { background-position:center,100% 50%,130% 50%,70% 50%; }
  }

  /* enhancement/property appearance overrides are defined with the primary element styles above */

  .gacha-opt .mini-block[data-prop=steel] .arm,.gacha-opt .mini-block[data-prop=steel] .hub{background:#c7cdd3;box-shadow:none}
  .gacha-opt .mini-block[data-prop=stone] .arm,.gacha-opt .mini-block[data-prop=stone] .hub{background:#777;box-shadow:none;background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.2) 0 1px,transparent 1px),radial-gradient(circle at 70% 65%,rgba(0,0,0,.22) 0 1px,transparent 1px);background-size:7px 6px,8px 7px}
  .gacha-opt .mini-block[data-prop=gold] .arm,.gacha-opt .mini-block[data-prop=gold] .hub{background:#f2c94c}
  .gacha-opt .mini-block[data-prop=wood] .arm,.gacha-opt .mini-block[data-prop=wood] .hub{background:#b8895a;box-shadow:none}
  .gacha-opt .mini-block[data-prop=glass] .arm,.gacha-opt .mini-block[data-prop=glass] .hub{background:transparent;border:1px solid rgba(255,255,255,.85);box-shadow:none}
  .gacha-opt .mini-block[data-prop=striped] .arm,.gacha-opt .mini-block[data-prop=striped] .hub{background:#c94848;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.16) 0 3px,transparent 3px 7px)}
  .gacha-opt .mini-block[data-prop=grid] .arm,.gacha-opt .mini-block[data-prop=grid] .hub{background:#3976b9;background-image:linear-gradient(rgba(255,255,255,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.2) 1px,transparent 1px);background-size:6px 6px}
  .gacha-opt .mini-block[data-enh=invert],.gacha-opt .mini-ball[data-enh=invert]{filter:invert(1)}
  .gacha-opt .mini-ball[data-prop=steel]{background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.8) 0 2px,transparent 22%),#c7cdd3;box-shadow:0 0 7px rgba(255,255,255,.15)}.gacha-opt .mini-ball[data-prop=stone]{background:#777;box-shadow:none;background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.2) 0 1px,transparent 1px),radial-gradient(circle at 70% 65%,rgba(0,0,0,.22) 0 1px,transparent 1px);background-size:7px 6px,8px 7px}.gacha-opt .mini-ball[data-prop=gold]{background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.8) 0 2px,transparent 22%),#f2c94c}.gacha-opt .mini-ball[data-prop=wood]{background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.78) 0 2px,transparent 22%),#b8895a;box-shadow:0 0 7px rgba(255,255,255,.12)}.gacha-opt .mini-ball[data-prop=glass]{background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.82) 0 2px,transparent 22%),transparent;border:1px solid rgba(255,255,255,.9);box-shadow:0 0 8px rgba(255,255,255,.22)}.gacha-opt .mini-ball[data-prop=striped]{background:#c94848;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.16) 0 3px,transparent 3px 7px)}.gacha-opt .mini-ball[data-prop=grid]{background:#3976b9;background-image:linear-gradient(rgba(255,255,255,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.2) 1px,transparent 1px);background-size:6px 6px}
  .gacha-opt .mini-ball[data-enh=holo]::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.78) 0 1px,rgba(255,255,255,.08) 1px 6px);mix-blend-mode:screen}

  /* Borderless ball displays in shop/gacha: keep only the ball itself visible. */
  .ball-choice-item.selected .ball-chip{ box-shadow:0 0 0 2px var(--green),0 0 10px rgba(111,207,151,.45); }

</style>
</head>
<body>
<div class="app">

  <header class="hud">
    <div class="logo">◈ connect run</div>
    <div class="stats">
      <div class="stat level"><span class="label">Màn</span><span class="value" id="levelVal">1</span></div>
      <div class="stat score"><span class="label">Điểm</span><span class="value" id="scoreVal">0</span></div>
      <div class="stat target"><span class="label">Mục tiêu</span><span class="value" id="targetVal">0</span></div>
      <div class="stat money"><span class="label">Tiền</span><span class="value" id="moneyVal">$0</span></div>
    </div>
    <div class="speed-control">
      <span class="speed-label">Tốc độ</span>
      <select id="animationSpeedSelect" aria-label="Tốc độ animation">
        <option value="0.25">0.25x</option>
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
        <option value="3">3x</option>
      </select>
    </div>
    <button id="newGameBtn">Chơi lại</button>
  </header>

  <div class="ball-queue" id="ballQueue"></div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div class="hand-row">
    <div class="hand" id="hand"></div>
    <div class="discard-row">
      <button class="discard-btn" id="discardBtn">Loại bỏ <span id="discardCount">(3/3)</span></button>
    </div>
  </div>
  <div class="bag-row">
    <div class="bag-count" id="bagCount"></div>
    <button id="inventoryBtn">Kho đồ</button>
  </div>
  <div class="card-hand" id="cardHand"></div>

</div>

<div class="target-banner hidden" id="targetBanner"></div>

<div class="overlay hidden" id="overlay">
  <div class="overlay-panel" id="overlayPanel">
    <h2 id="overlayTitle"></h2>
    <p id="overlayText"></p>
    <button id="overlayBtn">Chơi lại từ đầu</button>
  </div>
</div>

<div class="shop-layer hidden" id="shopOverlay"></div>

<div class="overlay hidden" id="gachaOverlay"></div>

<div class="overlay hidden" id="inventoryOverlay"></div>

<div class="debug-overlay hidden" id="debugOverlay">
  <div class="debug-panel">
    <div class="debug-head">
      <h2>DEBUG MENU</h2>
      <button class="debug-close" id="debugCloseBtn">Đóng</button>
    </div>
    <div class="debug-section">
      <span class="debug-label">Tiền</span>
      <div class="debug-money-row">
        <input id="debugMoneyInput" type="number" step="1" value="100">
        <button class="debug-apply" id="debugAddMoneyBtn">+ Thêm</button>
      </div>
    </div>
    <div class="debug-section">
      <span class="debug-label">Số màn</span>
      <div class="debug-money-row">
        <input id="debugLevelInput" type="number" step="1" min="1" value="1">
        <button class="debug-apply" id="debugSetLevelBtn">Đặt màn</button>
      </div>
    </div>
    <div class="debug-section">
      <span class="debug-label">Tiến trình màn</span>
      <div class="debug-actions"><button class="debug-apply" id="debugAdvanceLevelBtn">Qua màn</button></div>
    </div>
    <div class="debug-section">
      <span class="debug-label">Thẻ nâng cấp → tay</span>
