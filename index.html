  function render(){
    hideHoverTip();
    state._animateNewHoleConnections = new Set();
    if(placeAnimCell){
      const {r,c}=placeAnimCell;
      const block=state.cells[r][c].block;
      for(const d of [0,1,2,3]){
        const [dx,dy]=DIR_VEC[d], hr=r+dy, hc=c+dx;
        if(hr<0||hr>=state.rows||hc<0||hc>=state.cols || state.cells[hr][hc].type!=='hole' || !block) continue;
        const key=`${hr},${hc},${opposite(d)}`;
        if(openSides(block).includes(d) && !state.holeConnections.has(key)) state._animateNewHoleConnections.add(key);
      }
    }
    boardEl.style.gridTemplateColumns = `repeat(${state.cols}, 1fr)`;
    boardEl.style.gridTemplateRows = `repeat(${state.rows}, 1fr)`;
    boardWrapEl.style.aspectRatio = `${state.cols} / ${state.rows}`;
    boardEl.innerHTML = '';

    for(let r=0;r<state.rows;r++){
      for(let c=0;c<state.cols;c++){
        const cellData = state.cells[r][c];
        const el = document.createElement('div');
        el.dataset.r=r; el.dataset.c=c;
        el.className = 'cell ' + cellData.type + (cellData.block ? ' hasblock' : '');

        if(cellData.type==='node'){
          el.dataset.dir = DIR_NAMES[state.node.dir];
          const arm = document.createElement('div'); arm.className = 'arm arm-'+DIR_NAMES[state.node.dir];
          const hub = document.createElement('div'); hub.className='hub';
          el.appendChild(arm); el.appendChild(hub);
          el.addEventListener('click', onNodeClick);
        } else if(cellData.type==='hole'){
          const r2=document.createElement('div'); r2.className='ring r2';
          el.appendChild(r2);
          const nextConnections = new Set();
          for(const d of [0,1,2,3]){
            const [dx,dy]=DIR_VEC[d];
            const nr=r+dy, nc=c+dx;
            if(nr<0||nr>=state.rows||nc<0||nc>=state.cols) continue;
            const nb=state.cells[nr][nc].block;
            if(!nb || !openSides(nb).includes(opposite(d))) continue;
            const key=`${r},${c},${d}`;
            nextConnections.add(key);
            const connector=document.createElement('div');
            connector.className='hole-connector '+DIR_NAMES[d];
            if(state._animateNewHoleConnections?.has(key)) connector.classList.add('forming');
            el.appendChild(connector);
          }
          for(const key of [...state.holeConnections]){
            if(!key.startsWith(`${r},${c},`) || nextConnections.has(key)) continue;
            const d=+key.split(',')[2];
            const connector=document.createElement('div');
            connector.className='hole-connector '+DIR_NAMES[d]+' retracting';
            el.appendChild(connector);
            setTimeout(()=>connector.remove(),scaledDuration(290));
            state.holeConnections.delete(key);
          }
          for(const key of nextConnections) state.holeConnections.add(key);
        } else if(cellData.block){
          renderBlockArms(el, cellData.block);
          attachBoardBlockDrag(el);
          if(state.targeting && targetKindMatches(state.targeting.def, 'block')) el.classList.add('targetable');
          if(placeAnimCell && placeAnimCell.r===r && placeAnimCell.c===c){
            el.classList.add('just-placed');
            const visual = el.querySelector('.block-visual');
            if(visual) visual.style.setProperty('--place-deg', (cellData.block.rotation*90)+'deg');
          }
        }
        boardEl.appendChild(el);
      }
    }
    if(swapAnim){
      const anim=swapAnim;
      swapAnim=null;
      requestAnimationFrame(()=>{
        const sourceEl=boardEl.querySelector(`.cell[data-r="${anim.source.r}"][data-c="${anim.source.c}"]`);
        const targetEl=boardEl.querySelector(`.cell[data-r="${anim.target.r}"][data-c="${anim.target.c}"]`);
        if(sourceEl&&targetEl){
          const sFrom=anim.sourceRect, sTo=anim.targetRect, tFrom=anim.targetRect, tTo=anim.sourceRect;
          const sVis=sourceEl.querySelector('.block-visual'), tVis=targetEl.querySelector('.block-visual');
          if(sVis){ sVis.style.setProperty('--from-x', `${sFrom.left-sTo.left}px`); sVis.style.setProperty('--from-y', `${sFrom.top-sTo.top}px`); sVis.style.setProperty('--block-deg', `${(state.cells[anim.source.r][anim.source.c].block.rotation||0)*90}deg`); sVis.style.animation='blockMoveIn calc(.34s / var(--anim-speed)) cubic-bezier(.22,.8,.24,1)'; }
          if(tVis){ tVis.style.setProperty('--from-x', `${tFrom.left-tTo.left}px`); tVis.style.setProperty('--from-y', `${tFrom.top-tTo.top}px`); tVis.style.setProperty('--block-deg', `${(state.cells[anim.target.r][anim.target.c].block.rotation||0)*90}deg`); tVis.style.animation='blockMoveIn calc(.34s / var(--anim-speed)) cubic-bezier(.22,.8,.24,1)'; }
        }
      });
    }
    placeAnimCell = null;
    renderHand();
    renderBallQueue();
    renderCardHand();
    bagCountEl.textContent = `Túi khối còn lại: ${state.bag.length}`;
    discardCountEl.textContent = `(${state.discardsLeft}/3)`;
    discardBtnEl.disabled = state.discardsLeft<=0 || !state.hand.some(Boolean) || state.resolving || state.phase!=='playing' || !!state.targeting;
    refreshAnimSlots.clear();
    scoreValEl.textContent = state.score;
    targetValEl.textContent = state.target;
    moneyValEl.textContent = `$${state.money}`;
    levelValEl.textContent = state.level;
  }

  function renderHand(){
    handEl.innerHTML = '';
    for(let i=0;i<HAND_SIZE;i++){
      const slot = document.createElement('div');
      const block = state.hand[i];
      slot.className = 'hand-slot' + (block ? ' filled' : ' empty-slot');
      slot.dataset.idx = i;
      if(block){
        renderBlockArms(slot, block);
        if(refreshAnimSlots.has(i)) slot.classList.add('just-refreshed');
        attachHandBlockDrag(slot, i);
        if(state.targeting && targetKindMatches(state.targeting.def, 'block')) slot.classList.add('targetable');
      }
      handEl.appendChild(slot);
    }
  }

  function syncBallPoolFromQueue(){
    const byId = new Map(state.ballPool.map(b=>[b._id,b]));
    const ordered = [];
    for(const q of state.ballQueue){
      const b = byId.get(q._id);
      if(!b) continue;
      b.property = q.property || null;
      b.enhancement = q.enhancement || null;
      ordered.push(b);
    }
    if(ordered.length===state.ballPool.length) state.ballPool = ordered;
  }

  function syncBallMutationTargets(targets){
    const ballTargets = (targets||[]).filter(t=>t.kind==='ball').map(t=>t.obj).filter(Boolean);
    if(!ballTargets.length) return;

    // Sync by stable ball _id rather than object identity. Some game flows can
    // rebuild/reorder state.ballPool or state.ballQueue, so comparing object
    // references can miss a mutation even when it is the same logical ball.
    const changedById = new Map();
    ballTargets.forEach(ball=>{
      if(!ball._id) return;
      changedById.set(ball._id, {
        property: ball.property || null,
        enhancement: ball.enhancement || null,
      });
    });

    state.ballPool.forEach(ball=>{
      const changed = changedById.get(ball._id);
      if(!changed) return;
      ball.property = changed.property;
      ball.enhancement = changed.enhancement;
    });

    state.ballQueue.forEach(q=>{
      const changed = changedById.get(q._id);
      if(!changed) return;
      q.property = changed.property;
      q.enhancement = changed.enhancement;
    });

    renderBallQueue();
    refreshOpenShop();
    refreshOpenGachaBalls();
  }

  function syncBallQueueFromPool(){
    ensureBallIds();
    const firedIds = new Set(state.ballQueue.filter(b=>b.fired).map(b=>b._id));
    const unfired = state.ballPool.filter(b=>!firedIds.has(b._id));
    let u=0;
    state.ballQueue = state.ballQueue.map(q=>{
      if(q.fired) return q;
      const b=unfired[u++];
      return {_id:b._id, fired:false, property:b.property||null, enhancement:b.enhancement||null};
    });
  }

  let ballClickSelection = null;
  let suppressBallClickUntil = 0;

  function clearBallClickSelection(){
    ballClickSelection = null;
    ballQueueEl.querySelectorAll('.ball-chip.click-selected').forEach(el=>el.classList.remove('click-selected'));
  }

  function handleBallQueueClick(idx){
    if(state.targeting || state.resolving || state.phase!=='playing') return;
    const ball = state.ballQueue[idx];
    if(!ball || ball.fired || idx < state.ballsFired) return;

    const chip = [...ballQueueEl.children][idx];
    if(ballClickSelection===null){
      ballClickSelection = idx;
      chip?.classList.add('click-selected');
      return;
    }

    if(ballClickSelection===idx){
      clearBallClickSelection();
      return;
    }

    const sourceIdx = ballClickSelection;
    const targetIdx = idx;
    const sourceEl = [...ballQueueEl.children][sourceIdx];
    const targetEl = [...ballQueueEl.children][targetIdx];
    const sourceRect = sourceEl?.getBoundingClientRect();
    const targetRect = targetEl?.getBoundingClientRect();

    [state.ballQueue[sourceIdx], state.ballQueue[targetIdx]] = [state.ballQueue[targetIdx], state.ballQueue[sourceIdx]];
    syncBallPoolFromQueue();
    clearBallClickSelection();

    if(sourceRect && targetRect){
      ballSwapAnim={source:sourceIdx,target:targetIdx,sourceRect,targetRect};
    }
    renderBallQueue();
  }

  function renderBallQueue(){
    ballQueueEl.innerHTML = '';
    state.ballQueue.forEach((b, i)=>{
      const chip = document.createElement('div');
      chip.className = 'ball-chip' + (b.fired ? ' fired' : '');
      chip.dataset.ballIndex = i;
      if(b.property) chip.style.setProperty('--prop-color', PROP_COLOR[b.property]);
      if(b.property) chip.dataset.prop = b.property;
      if(b.enhancement) chip.dataset.enh = b.enhancement;
      chip.textContent = '';
      markDebugTarget(chip, b, 'ball');

      attachObjectTooltip(chip, b, 'ball');

      if(!b.fired && state.targeting && targetKindMatches(state.targeting.def, 'ball')){
        chip.classList.add('targetable');
        chip.addEventListener('click', ()=> handleTargetClick({obj:b, kind:'ball'}));
      }
      if(!b.fired && !state.targeting){
        chip.addEventListener('click', ()=>{
          if(performance.now() < suppressBallClickUntil) return;
          handleBallQueueClick(i);
        });
      }
      if(!b.fired) attachBallDrag(chip, i);
      ballQueueEl.appendChild(chip);
    });
    if(ballSwapAnim){
      const anim=ballSwapAnim;
      ballSwapAnim=null;
      requestAnimationFrame(()=>{
        const sourceEl=[...ballQueueEl.children][anim.source];
        const targetEl=[...ballQueueEl.children][anim.target];
        if(!sourceEl || !targetEl) return;
        const sourceRect=sourceEl.getBoundingClientRect();
        const targetRect=targetEl.getBoundingClientRect();
        const sx=anim.sourceRect.left-sourceRect.left, sy=anim.sourceRect.top-sourceRect.top;
        const tx=anim.targetRect.left-targetRect.left, ty=anim.targetRect.top-targetRect.top;
        sourceEl.style.setProperty('--from-x',`${sx}px`);
        sourceEl.style.setProperty('--from-y',`${sy}px`);
        sourceEl.style.animation='ballMoveIn calc(.34s / var(--anim-speed)) cubic-bezier(.22,.8,.24,1)';
        targetEl.style.setProperty('--from-x',`${tx}px`);
        targetEl.style.setProperty('--from-y',`${ty}px`);
        targetEl.style.animation='ballMoveIn calc(.34s / var(--anim-speed)) cubic-bezier(.22,.8,.24,1)';
      });
    }
  }

  let ballDrag = null;
  let ballSwapAnim = null;

  function attachBallDrag(chip, idx){
    chip.addEventListener('pointerdown', e=>{
      if(state.targeting){ e.preventDefault(); return; }
      if(state.resolving || state.phase!=='playing') return;
      if(idx < state.ballsFired || state.ballQueue[idx].fired) return;
      startBallDrag(e, idx);
    });
  }

  function startBallDrag(e, idx){
    e.preventDefault();
    ballDrag={idx,startX:e.clientX,startY:e.clientY,targetX:e.clientX,targetY:e.clientY,moved:false,ghostEl:null,sourceEl:null,curX:e.clientX,curY:e.clientY};
    window.addEventListener('pointermove', onBallDragMove);
    window.addEventListener('pointerup', onBallDragEnd);
  }

  function onBallDragMove(e){
    if(!ballDrag) return;
    ballDrag.targetX=e.clientX; ballDrag.targetY=e.clientY;
    const dx=e.clientX-ballDrag.startX, dy=e.clientY-ballDrag.startY;
    if(!ballDrag.moved && Math.hypot(dx,dy)>6){
      ballDrag.moved=true;
      suppressBallClickUntil = performance.now() + 120;
      ballDrag.sourceEl=ballQueueEl.querySelector(`.ball-chip[data-ball-index=\"${ballDrag.idx}\"]`);
      if(!ballDrag.sourceEl){
        ballDrag.sourceEl=[...ballQueueEl.children][ballDrag.idx];
      }
      ballDrag.ghostEl=document.createElement('div');
      ballDrag.ghostEl.className='ball-drag-ghost';
      ballDrag.ghostEl.innerHTML=ballChipMarkup(state.ballQueue[ballDrag.idx]);
      document.body.appendChild(ballDrag.ghostEl);
      if(ballDrag.sourceEl) ballDrag.sourceEl.classList.add('drag-source-fade');
      ballDrag.curX=e.clientX; ballDrag.curY=e.clientY;
      dragGhostLoop(ballDrag);
    }
    if(ballDrag.moved) updateBallDropHover(e.clientX,e.clientY);
  }


  function updateBallDropHover(x,y){
    ballQueueEl.querySelectorAll('.ball-drop-hover').forEach(el=>el.classList.remove('ball-drop-hover'));
    const el=document.elementFromPoint(x,y)?.closest?.('.ball-chip');
    if(!el || el.classList.contains('fired')) return;
    const targetIdx=[...ballQueueEl.children].indexOf(el);
    if(targetIdx>=state.ballsFired && targetIdx!==ballDrag.idx) el.classList.add('ball-drop-hover');
  }


  function onBallDragEnd(e){
    window.removeEventListener('pointermove', onBallDragMove);
    window.removeEventListener('pointerup', onBallDragEnd);
    if(!ballDrag) return;
    if(ballDrag.raf) cancelAnimationFrame(ballDrag.raf);

    const info=ballDrag;
    ballDrag=null;
    ballQueueEl.querySelectorAll('.ball-drop-hover').forEach(el=>el.classList.remove('ball-drop-hover'));

    if(!info.moved){
      info.sourceEl?.classList.remove('drag-source-fade');
      info.ghostEl?.remove();
      return;
    }

    const el=document.elementFromPoint(e.clientX,e.clientY)?.closest?.('.ball-chip');
    const targetIdx=el ? [...ballQueueEl.children].indexOf(el) : -1;
    const sourceIdx=info.idx;
    if(targetIdx>=state.ballsFired && targetIdx!==sourceIdx && !state.ballQueue[targetIdx].fired){
      const sourceRect=info.sourceEl?.getBoundingClientRect();
      const targetEl=[...ballQueueEl.children][targetIdx];
      const targetRect=targetEl?.getBoundingClientRect();
      [state.ballQueue[sourceIdx], state.ballQueue[targetIdx]]=[state.ballQueue[targetIdx],state.ballQueue[sourceIdx]];
      syncBallPoolFromQueue();
      info.sourceEl?.classList.remove('drag-source-fade');
      info.ghostEl?.remove();
      if(sourceRect && targetRect) ballSwapAnim={source:sourceIdx,target:targetIdx,sourceRect,targetRect};
      renderBallQueue();
      return;
    }
    animateDragReturn(info);
  }

  function renderCardHand(){
    cardHandEl.innerHTML = '';
    if(!state.cardHand.length){
      cardHandEl.innerHTML = '<div class="tag-empty">Chưa có thẻ nào trong tay</div>';
      return;
    }
    state.cardHand.forEach((card, idx)=>{
      const isUpgrade = card.kind==='upgrade';
      const def = isUpgrade ? UPGRADE_POOL.find(x=>x.id===card.defId) : POWER_CARD_DEFS[card.defId];
      if(!def) return;
      const chip = document.createElement('div'); chip.className='power-card-chip';
      const nameSpan = document.createElement('span'); nameSpan.className='name'; nameSpan.textContent = def.name;
      attachCardTooltip(chip, def);
      const btn = document.createElement('button'); btn.textContent='Dùng';
      btn.disabled = state.phase!=='playing' || !!state.targeting;
      if(isUpgrade){
        btn.addEventListener('click', ()=>{
          def.apply(); state.lastUpgrade=def; state.cardHand.splice(idx,1);
          setStatus(`Đã dùng: ${def.name}`, 'good');
          render(); renderTargetBanner();
        });
      } else {
        btn.addEventListener('click', ()=> startTargeting(idx, def));
      }
      chip.appendChild(nameSpan); chip.appendChild(btn);
      cardHandEl.appendChild(chip);
    });
  }

  function setStatus(text, kind){ statusStripEl.textContent = text; statusStripEl.className = 'status-strip' + (kind ? ' '+kind : ''); }

  // ---------- targeting mode (power cards) ----------
  function targetKindMatches(def, kind){
    if(def.targetKind === 'both') return true;
    if(def.targetKind === 'swap'){
      if(!state.targeting.targets.length) return true;
      return state.targeting.targets[0].kind === kind;
    }
    return def.targetKind === kind;
  }

  function startTargeting(handIdx, def){
    if(def.targetCount === 0){
      def.use([]);
      state.cardHand.splice(handIdx,1);
      setStatus(`Đã dùng: ${def.name}`, 'good');
      render();
      return;
    }
    state.targeting = { handIdx, def, need: def.targetCount, targets: [] };
    render();
    renderTargetBanner();
  }

  function cancelTargeting(){ state.targeting = null; render(); renderTargetBanner(); }

  function handleTargetClick(target){
    const t = state.targeting;
    if(!t) return;
    const def = t.def;
    if(!targetKindMatches(def, target.kind)) return;
    if(t.targets.some(x=>x.obj===target.obj)) return;
    t.targets.push(target);
    if(t.targets.length >= t.need){
      def.use(t.targets);
      syncBallMutationTargets(t.targets);
      renderBallQueue();
      state.cardHand.splice(t.handIdx,1);
      state.targeting = null;
      setStatus(`Đã dùng: ${def.name}`, 'good');
      render();
      renderTargetBanner();
    } else {
      render();
      renderTargetBanner();
    }
  }

  function renderTargetBanner(){
    if(!state.targeting){ targetBannerEl.classList.add('hidden'); targetBannerEl.innerHTML=''; return; }
    targetBannerEl.classList.remove('hidden');
    const t = state.targeting;
    targetBannerEl.innerHTML = '';
    const span = document.createElement('span'); span.textContent = `Chọn mục tiêu cho ${t.def.name} (${t.targets.length}/${t.need})`;
    const cancelBtn = document.createElement('button'); cancelBtn.textContent='Huỷ';
    cancelBtn.addEventListener('click', cancelTargeting);
    targetBannerEl.appendChild(span); targetBannerEl.appendChild(cancelBtn);
  }

  // ---------- drag & rotate ----------
  let drag = null;

  function attachHandBlockDrag(slot, idx){
    slot.addEventListener('pointerdown', e=>{
      if(state.targeting){ e.preventDefault(); handleTargetClick({obj: state.hand[idx], kind:'block'}); return; }
      if(state.resolving || state.phase!=='playing') return;
      startDrag(e, {origin:'hand', idx, block: state.hand[idx]});
    });
  }
  function attachBoardBlockDrag(cellEl){
    cellEl.addEventListener('pointerdown', e=>{
      const r=+cellEl.dataset.r, c=+cellEl.dataset.c;
      if(state.targeting){ e.preventDefault(); handleTargetClick({obj: state.cells[r][c].block, kind:'block'}); return; }
      if(state.resolving || state.phase!=='playing') return;
      startDrag(e, {origin:'board', r, c, block: state.cells[r][c].block});
    });
  }
  function startDrag(e, info){
    e.preventDefault();
    drag = Object.assign(info, {startX:e.clientX, startY:e.clientY, moved:false, ghostEl:null});
    window.addEventListener('pointermove', onDragMove);
    window.addEventListener('pointerup', onDragEnd);
  }
  function onDragMove(e){
    if(!drag) return;
    drag.targetX = e.clientX; drag.targetY = e.clientY;
    const dx=e.clientX-drag.startX, dy=e.clientY-drag.startY;
    if(!drag.moved && Math.hypot(dx,dy)>6){
      drag.moved = true;
      drag.ghostEl = document.createElement('div'); drag.ghostEl.className = 'drag-ghost';
      renderBlockArms(drag.ghostEl, drag.block);
      document.body.appendChild(drag.ghostEl);
      drag.curX = e.clientX; drag.curY = e.clientY;
      drag.sourceEl = drag.origin==='hand'
        ? handEl.querySelector(`.hand-slot[data-idx="${drag.idx}"]`)
        : boardEl.querySelector(`.cell[data-r="${drag.r}"][data-c="${drag.c}"]`);
      if(drag.sourceEl) drag.sourceEl.classList.add('drag-source-fade');
      dragGhostLoop(drag);
    }
    if(drag.moved) updateDropHover(e.clientX, e.clientY);
  }

  function dragGhostLoop(dragState){
    if(!dragState || !dragState.moved) return;
    const dx = dragState.targetX - dragState.curX, dy = dragState.targetY - dragState.curY;
    dragState.curX += dx*0.3; dragState.curY += dy*0.3;
    const tilt = Math.max(-16, Math.min(16, dx*0.15));
    dragState.ghostEl.style.left = dragState.curX+'px'; dragState.ghostEl.style.top = dragState.curY+'px';
    dragState.ghostEl.style.transform = `translate(-50%,-50%) rotate(${tilt}deg) scale(1.12)`;
    dragState.raf = requestAnimationFrame(()=>dragGhostLoop(dragState));
  }

  // board-origin drags may land on an occupied cell (swap); hand-origin drags may only land on empty cells
  function dropTargetCell(el){
    const cellEl = el && el.closest ? el.closest('.cell') : null;
    if(!cellEl || cellEl.classList.contains('node') || cellEl.classList.contains('hole')) return null;
    if(drag.origin==='hand' && cellEl.classList.contains('hasblock')) return null;
    if(drag.origin==='board' && +cellEl.dataset.r===drag.r && +cellEl.dataset.c===drag.c) return null;
    return cellEl;
  }
  function updateDropHover(x,y){
    document.querySelectorAll('.cell.drop-hover,.hand-slot.drop-hover').forEach(c=>c.classList.remove('drop-hover'));
    const el = document.elementFromPoint(x,y);
    const handSlot = el && el.closest ? el.closest('.hand-slot.filled') : null;
    if(handSlot && drag && drag.origin==='hand' && +handSlot.dataset.idx!==drag.idx){ handSlot.classList.add('drop-hover'); return; }
    const cellEl = dropTargetCell(el);
    if(cellEl) cellEl.classList.add('drop-hover');
  }

  function animateDragReturn(info){
    if(!info.ghostEl || !info.sourceEl){
      if(info.sourceEl) info.sourceEl.classList.remove('drag-source-fade');
      return;
    }
    const src=info.sourceEl.querySelector('.ball-chip')?.getBoundingClientRect() || info.sourceEl.getBoundingClientRect();
    const ghost=info.ghostEl.getBoundingClientRect();
    const dx=(src.left+src.width/2)-(ghost.left+ghost.width/2);
    const dy=(src.top+src.height/2)-(ghost.top+ghost.height/2);
    info.ghostEl.style.transition='transform calc(.24s / var(--anim-speed)) cubic-bezier(.22,.8,.24,1), opacity calc(.24s / var(--anim-speed)) ease';
    info.ghostEl.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(0deg) scale(1)`;
    setTimeout(()=>{ if(info.ghostEl) info.ghostEl.remove(); if(info.sourceEl) info.sourceEl.classList.remove('drag-source-fade'); },scaledDuration(250));
  }

  function onDragEnd(e){
    window.removeEventListener('pointermove', onDragMove);
    window.removeEventListener('pointerup', onDragEnd);
    if(!drag) return;

    if(drag.raf) cancelAnimationFrame(drag.raf);

    if(!drag.moved){
      drag.block.rotation = (drag.block.rotation+1)%4;
      const containerEl = drag.origin==='hand'
        ? handEl.querySelector(`.hand-slot[data-idx="${drag.idx}"]`)
        : boardEl.querySelector(`.cell[data-r="${drag.r}"][data-c="${drag.c}"]`);
      const visual = containerEl && containerEl.querySelector('.block-visual');
      if(visual){
        const nextDeg = parseFloat(visual.dataset.deg||'0') + 90;
        visual.dataset.deg = nextDeg;
        visual.style.transform = `rotate(${nextDeg}deg)`;
      }
      syncHoleConnectionsForBlock(drag.r, drag.c);
      drag = null;
      return;
    }

    if(drag.ghostEl) drag.ghostEl.remove();
    document.querySelectorAll('.cell.drop-hover').forEach(c=>c.classList.remove('drop-hover'));

    const el = document.elementFromPoint(e.clientX, e.clientY);

    const handSlot = el && el.closest ? el.closest('.hand-slot.filled') : null;
    if(handSlot && drag.origin==='hand'){
      const targetIdx = +handSlot.dataset.idx;
      if(targetIdx !== drag.idx){
        [state.hand[drag.idx], state.hand[targetIdx]] = [state.hand[targetIdx], state.hand[drag.idx]];
        render();
      }
      drag = null;
      return;
    }

    const cellEl = dropTargetCell(el);

    if(cellEl){
      const r=+cellEl.dataset.r, c=+cellEl.dataset.c;
      if(drag.origin==='hand'){
        state.cells[r][c] = {type:'empty', block: drag.block};
        state.hand[drag.idx] = null;
        refillHand(true);
      } else if(drag.origin==='board'){
        const targetHadBlock=!!state.cells[r][c].block;
        const sourceRect=drag.sourceEl?.getBoundingClientRect();
        const targetRect=cellEl.getBoundingClientRect();
        state.cells[drag.r][drag.c].block = state.cells[r][c].block || null;
        state.cells[r][c].block = drag.block;
        if(targetHadBlock && sourceRect && targetRect) swapAnim={source:{r,c},target:{r:drag.r,c:drag.c},sourceRect,targetRect};
      }
      placeAnimCell = {r,c};
      drag.sourceEl?.classList.remove('drag-source-fade');
    } else {
      animateDragReturn(drag);
    }
    render();
    drag = null;
  }

  function syncHoleConnectionsForBlock(r,c){
    const block=state.cells[r]?.[c]?.block;
    if(!block) return;
    for(const d of [0,1,2,3]){
      const [dx,dy]=DIR_VEC[d], hr=r+dy, hc=c+dx;
      if(hr<0||hr>=state.rows||hc<0||hc>=state.cols||state.cells[hr][hc].type!=='hole') continue;
      const key=`${hr},${hc},${opposite(d)}`;
      const connected=openSides(block).includes(d);
      const holeEl=boardEl.querySelector(`.cell.hole[data-r=\"${hr}\"][data-c=\"${hc}\"]`);
      if(connected){
        if(state.holeConnections.has(key)) continue;
        const connector=document.createElement('div');
        connector.className='hole-connector '+DIR_NAMES[opposite(d)];
        if(holeEl) holeEl.appendChild(connector);
        state.holeConnections.add(key);
      } else if(state.holeConnections.has(key)){
        const connector=holeEl?.querySelector(`.hole-connector.${DIR_NAMES[opposite(d)]}`);
        if(connector){ connector.classList.add('retracting'); setTimeout(()=>connector.remove(),scaledDuration(290)); }
        state.holeConnections.delete(key);
      }
    }
  }

  // ---------- firing / simulation ----------
  function cellPercent(r,c){ return { left:((c+0.5)/state.cols)*100, top:((r+0.5)/state.rows)*100 }; }

  function computeScoreTooltipScale(currentTotal, initialTotal, targetTotal){
    const start = Number.isFinite(initialTotal) && initialTotal > 0 ? initialTotal : 50;
    const target = Number.isFinite(targetTotal) && targetTotal > start ? targetTotal : start + 1;
    const progress = Math.max(0, (currentTotal - start) / (target - start));
    const steps = Math.floor(progress * 10 + 1e-9);
    return Math.min(3, 1 + steps * 0.05);
  }

  function animateScoreTipValue(valueEl, nextTotal, previousTotal, initialTotal, targetTotal, tip){
    if(!valueEl) return;
    const prevTotal = Number.isFinite(previousTotal) ? previousTotal : nextTotal;
    const nextScale = computeScoreTooltipScale(nextTotal, initialTotal, targetTotal);
    const previousScale = Number.isFinite(valueEl._scoreScale) ? valueEl._scoreScale : 1;
    const crossedGrowthStep = nextScale > previousScale;

    if(nextTotal <= prevTotal){
      valueEl._scoreScale = nextScale;
      valueEl.style.transform = `scale(${nextScale})`;
      if(tip){
        tip._tooltipScale = nextScale;
        tip.style.setProperty('--tooltip-scale', String(nextScale));
      }
      return;
    }

    if(valueEl._scoreAnim){
      try{ valueEl._scoreAnim.cancel(); }catch{}
      valueEl._scoreAnim = null;
    }
    if(tip?._tooltipAnim){
      try{ tip._tooltipAnim.cancel(); }catch{}
      tip._tooltipAnim = null;
    }

    valueEl._scoreScale = nextScale;
    const duration = (crossedGrowthStep ? 420 : 280) / animationSpeed;
    const fromScale = previousScale;

    const keyframes = crossedGrowthStep
      ? [
          { transform:`scale(${fromScale}) translate3d(0px,0px,0) rotate(0deg)` },
          { transform:`scale(${nextScale * 1.16}) translate3d(-2px,-1px,0) rotate(-4deg)`, offset:0.22 },
          { transform:`scale(${nextScale * 0.96}) translate3d(2px,1px,0) rotate(3.5deg)`, offset:0.48 },
          { transform:`scale(${nextScale * 1.04}) translate3d(-1px,0px,0) rotate(-1.5deg)`, offset:0.74 },
          { transform:`scale(${nextScale}) translate3d(0px,0px,0) rotate(0deg)`, offset:1 }
        ]
      : [
          { transform:`scale(${nextScale}) translate3d(0px,0px,0) rotate(0deg)` },
          { transform:`scale(${nextScale}) translate3d(-3px,-1px,0) rotate(-6deg)`, offset:0.14 },
          { transform:`scale(${nextScale}) translate3d(3px,1px,0) rotate(6deg)`, offset:0.28 },
          { transform:`scale(${nextScale}) translate3d(-2.5px,0px,0) rotate(-4.5deg)`, offset:0.42 },
          { transform:`scale(${nextScale}) translate3d(2.5px,0px,0) rotate(4.5deg)`, offset:0.56 },
          { transform:`scale(${nextScale}) translate3d(-1.5px,0px,0) rotate(-2.5deg)`, offset:0.70 },
          { transform:`scale(${nextScale}) translate3d(1.5px,0px,0) rotate(2.5deg)`, offset:0.84 },
          { transform:`scale(${nextScale}) translate3d(0px,0px,0) rotate(0deg)`, offset:1 }
        ];

    valueEl._scoreAnim = valueEl.animate(keyframes, {
      duration,
      easing:'cubic-bezier(.34,1.56,.64,1)',
      fill:'forwards',
      composite:'replace'
    });
    valueEl._scoreAnim.onfinish = ()=>{
      valueEl.style.transform = `scale(${nextScale})`;
      valueEl._scoreAnim = null;
    };

    // The frame itself zooms, but never shakes. Only the number above it receives
    // the lateral/rotational motion.
    if(tip && nextScale !== (tip._tooltipScale ?? 1)){
      const previousTooltipScale = Number.isFinite(tip._tooltipScale) ? tip._tooltipScale : 1;
      tip._tooltipScale = nextScale;
      tip.style.setProperty('--tooltip-scale', String(previousTooltipScale));
      const tooltipFrom = `translate(-50%, calc(-100% - 14px)) scale(${previousTooltipScale})`;
      const tooltipTo = `translate(-50%, calc(-100% - 14px)) scale(${nextScale})`;
      tip._tooltipAnim = tip.animate([
        { transform:tooltipFrom },
        { transform:`translate(-50%, calc(-100% - 14px)) scale(${nextScale * 1.06})`, offset:0.28 },
        { transform:`translate(-50%, calc(-100% - 14px)) scale(${nextScale * 0.98})`, offset:0.55 },
        { transform:tooltipTo, offset:1 }
      ], {
        duration:420 / animationSpeed,
        easing:'cubic-bezier(.34,1.56,.64,1)',
        fill:'forwards',
        composite:'replace'
      });
      tip._tooltipAnim.onfinish=()=>{
        tip.style.setProperty('--tooltip-scale', String(nextScale));
        tip._tooltipAnim=null;
      };
    }
  }

  function createBallEntity(r,c,ballState,animateScore=false,previousTotal=null){
    const ball = document.createElement('div'); ball.className='ball';
    if(ballState.prop){ ball.dataset.prop=ballState.prop; ball.style.setProperty('--prop-color', PROP_COLOR[ballState.prop]); }
    if(ballState.enh) ball.dataset.enh = ballState.enh;
    const p = cellPercent(r,c);
    ball.style.left=p.left+'%'; ball.style.top=p.top+'%';
    boardWrapEl.appendChild(ball);

    const tip = document.createElement('div'); tip.className='ball-tooltip';
    tip.style.left=p.left+'%'; tip.style.top=p.top+'%';
    const tipValue = document.createElement('span');
    tipValue.className='ball-tooltip-value';
    const currentTotal = Math.round(ballState.total);
    tipValue.textContent = currentTotal;
    tipValue._initialTotal = ballState.initialTotal;
    tipValue._scoreScale = 1;
    tipValue._lastTotal = Number.isFinite(previousTotal) ? Math.round(previousTotal) : currentTotal;
    tipValue.style.setProperty('--score-scale', '1');
    tipValue.style.setProperty('--score-scale-prev', '1');
    tip.appendChild(tipValue);
    tip._valueEl = tipValue;
    boardWrapEl.appendChild(tip);

    if(animateScore && currentTotal > tipValue._lastTotal){
      requestAnimationFrame(()=>animateScoreTipValue(tipValue, currentTotal, tipValue._lastTotal, ballState.initialTotal, state.target, tip));
    } else {
      const scale = computeScoreTooltipScale(currentTotal, ballState.initialTotal, state.target);
      tipValue._scoreScale = scale;
      tipValue.style.transform = `scale(${scale})`;
      tip.style.setProperty('--tooltip-scale', String(scale));
      tip._tooltipScale = scale;
    }

    return {ball, tip};
  }
  function moveEntityTo(ball,tip,r,c){
    return new Promise(resolve=>{
      void ball.offsetWidth; // force reflow so the browser commits the current position before we change it
      const p=cellPercent(r,c);
      ball.style.left=p.left+'%'; ball.style.top=p.top+'%';
      tip.style.left=p.left+'%'; tip.style.top=p.top+'%';
      setTimeout(resolve, scaledDuration(230));
    });
  }
  function updateTip(tip, ballState){
    const valueEl = tip?._valueEl || tip;
    const nextTotal = Math.round(ballState.total);
    const previousTotal = Number.isFinite(valueEl._lastTotal) ? valueEl._lastTotal : nextTotal;
    valueEl.textContent = nextTotal;
    if(nextTotal > previousTotal){
      animateScoreTipValue(valueEl, nextTotal, previousTotal, ballState.initialTotal, state.target, tip);
    }
    valueEl._lastTotal = nextTotal;
  }
  function removeEntity(ball,tip){ ball.remove(); tip.remove(); }
  function flashBlocked(r,c){
    const cellEl = boardEl.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
    if(cellEl){ cellEl.classList.remove('blocked-flash'); void cellEl.offsetWidth; cellEl.classList.add('blocked-flash'); }
  }
  function breakBlockAt(r,c){
    state.cells[r][c].block = null;
    for(const d of [0,1,2,3]){
      const [dx,dy]=DIR_VEC[d], hr=r+dy, hc=c+dx;
      if(hr<0||hr>=state.rows||hc<0||hc>=state.cols||state.cells[hr][hc].type!=='hole') continue;
      const key=`${hr},${hc},${opposite(d)}`;
      const holeEl=boardEl.querySelector(`.cell.hole[data-r=\"${hr}\"][data-c=\"${hc}\"]`);
      if(state.holeConnections.has(key)){
        const connector=holeEl?.querySelector(`.hole-connector.${DIR_NAMES[opposite(d)]}`);
        if(connector){ connector.classList.add('retracting'); setTimeout(()=>connector.remove(),scaledDuration(290)); }
        state.holeConnections.delete(key);
      }
    }
    const cellEl = boardEl.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
    if(cellEl){
      cellEl.classList.remove('hasblock');
      cellEl.querySelectorAll('.block-visual').forEach(n=>{ n.style.transition='opacity calc(.3s / var(--anim-speed))'; n.style.opacity='0'; });
      setTimeout(()=>{ cellEl.querySelectorAll('.block-visual').forEach(n=>n.remove()); }, scaledDuration(300));
    }
  }
  function wait(ms){ return new Promise(res=>setTimeout(res,scaledDuration(ms))); }

  // ballState: { total, rate, prop, enh, broke }
  function blockExitEffects(block, ballState){
    const prop = block.property, enh = block.enhancement;
    const sparkX = (enh==='spark') ? 2 : 1;
    let brokeBlock = false;

    if(prop==='steel'){ for(let i=0;i<sparkX;i++) ballState.rate *= 2; }
    if(prop==='stone'){ ballState.rate += 50*sparkX; }

    ballState.total += ballState.rate; // base (*) gain

    if(prop==='wood'){ ballState.total += 10*sparkX; }
    if(prop==='glass'){ for(let i=0;i<sparkX;i++) ballState.total *= 2; if(Math.random()<0.25) brokeBlock=true; }
    if(prop==='gold'){ state.money += 3*sparkX; moneyValEl.textContent = `$${state.money}`; }

    if(!prop && enh==='spark'){ ballState.total += ballState.rate; }
    if(enh==='holo'){ ballState.total += 50; }

    ballState.total += (state.typeBonus[block.type] || 0);
    return brokeBlock;
  }

  function ballExitEffects(ballState){
    const prop = ballState.prop, enh = ballState.enh;
    const sparkX = (enh==='spark') ? 2 : 1;
    if(prop==='striped'){ ballState.total += 10*sparkX; }
    if(prop==='grid'){ ballState.total += 100*sparkX; }
    if(prop==='glass'){ for(let i=0;i<sparkX;i++) ballState.total *= 2; }
    if(!prop && enh==='spark'){ ballState.total *= 2; }
    if(enh==='holo'){ ballState.total += 50; }
  }

  function ballGoalEffects(ballState){
    const prop = ballState.prop, enh = ballState.enh;
    const sparkX = (enh==='spark') ? 2 : 1;
    if(prop==='steel'){ for(let i=0;i<sparkX;i++) ballState.total *= 2; }
    if(prop==='gold'){ state.money += 5*sparkX; moneyValEl.textContent = `$${state.money}`; }
    if(prop==='glass' && Math.random()<0.25){ ballState.broke = true; }
  }

  async function travel(ball, tip, row, col, dir, ballState, counter){
    counter.launched++;
    const [dx,dy] = DIR_VEC[dir];
    const nr=row+dy, nc=col+dx;

    if(nr<0||nr>=state.rows||nc<0||nc>=state.cols){
      const p = cellPercent(row,col);
      const L=(p.left+dx*40)+'%', T=(p.top+dy*40)+'%';
      ball.style.left=L; ball.style.top=T; tip.style.left=L; tip.style.top=T;
      await wait(230);
      ball.classList.add('lost'); tip.style.opacity='0';
      await wait(300); removeEntity(ball,tip);
      return [];
    }

    await moveEntityTo(ball,tip,nr,nc);
    const cellData = state.cells[nr][nc];

    if(cellData.type==='hole'){
      ballGoalEffects(ballState);
      updateTip(tip, ballState);
      const goalPopup = document.createElement('div');
      goalPopup.className = 'ball-goal-popup';
      goalPopup.textContent = Math.round(ballState.total);
      const goalColor = ballState.enh ? ENH_COLOR[ballState.enh] : (ballState.prop ? PROP_COLOR[ballState.prop] : 'var(--amber)');
      goalPopup.style.color = goalColor || 'var(--amber)';
      const goalPos = cellPercent(nr,nc);
      goalPopup.style.left = goalPos.left + '%';
      goalPopup.style.top = goalPos.top + '%';
      boardWrapEl.appendChild(goalPopup);
      requestAnimationFrame(()=>goalPopup.classList.add('show'));
      ball.classList.add('scored');
      tip.style.opacity='0';
      await wait(700);
      goalPopup.remove();
      removeEntity(ball,tip);
      counter.scored++;
      if(ballState.broke){ counter.broke=(counter.broke||0)+1; return [0]; }
      const points = Math.round(ballState.total);
      state.score += points;
      counter.points = (counter.points||0) + points;
      scoreValEl.textContent = state.score;
      return [points];
    }

    if(cellData.type==='node' || (cellData.type==='empty' && !cellData.block)){
      flashBlocked(nr,nc);
      ball.classList.add('lost'); tip.style.opacity='0';
      await wait(300); removeEntity(ball,tip);
      return [];
    }

    const entrySide = opposite(dir);
    const blockRef = cellData.block;
    const sides = openSides(blockRef);
    if(!sides.includes(entrySide)){
      flashBlocked(nr,nc);
      ball.classList.add('lost'); tip.style.opacity='0';
      await wait(300); removeEntity(ball,tip);
      return [];
    }

    const previousTotal = ballState.total;
    const brokeBlock = blockExitEffects(blockRef, ballState);
    ballExitEffects(ballState);
    const invertBlock = blockRef.enhancement === 'invert';
    if(brokeBlock) breakBlockAt(nr,nc);

    // First pass in a shot: preserve the split. Later passes use one random exit.
    const allExits = sides.filter(s=>s!==entrySide);
    let exits;
    if(blockRef._splitUsed){
      exits = [pick(allExits)];
    } else {
      blockRef._splitUsed = true;
      exits = allExits;
    }
    removeEntity(ball,tip);

    const branches = [];
    exits.forEach(exitDir=>{
      const childState = { total: ballState.total, rate: ballState.rate, prop: ballState.prop, enh: ballState.enh, initialTotal: ballState.initialTotal };
      const c1 = createBallEntity(nr,nc,childState,true,previousTotal);
      branches.push(travel(c1.ball, c1.tip, nr, nc, exitDir, childState, counter));
      if(invertBlock){
        const cloneState = { total: ballState.total, rate: ballState.rate, prop: ballState.prop, enh: ballState.enh==='invert' ? null : ballState.enh, initialTotal: ballState.initialTotal };
        const c2 = createBallEntity(nr,nc,cloneState,true,previousTotal);
        branches.push(travel(c2.ball, c2.tip, nr, nc, exitDir, cloneState, counter));
      }
    });
    const results = await Promise.all(branches);
    return results.flat();
  }

  async function onNodeClick(){
    if(state.resolving || state.phase!=='playing' || state.targeting) return;
    if(state.ballsFired >= state.ballQueue.length) return;
    state.resolving = true;

    for(let r=0;r<state.rows;r++) for(let c=0;c<state.cols;c++){
      const b = state.cells[r][c].block;
      if(b) b._splitUsed = false;
    }

    const idx = state.ballsFired;
    syncBallQueueFromPool();
    const queued = state.ballQueue[idx];
    const canonical = state.ballPool.find(b=>b._id===queued._id);
    if(canonical){
      queued.property = canonical.property || null;
      queued.enhancement = canonical.enhancement || null;
    }
    queued.fired = true;
    state.ballsFired++;
    renderBallQueue();
    setStatus('Đang bắn…', '');

    const counter = {launched:0, scored:0, broke:0};
    function makeBallState(stripInvert){
      const initialTotal = 50+state.startBonus;
      return { initialTotal, total: initialTotal, rate: 10+state.baseRateBonus, prop: queued.property,
        enh: (stripInvert && queued.enhancement==='invert') ? null : queued.enhancement, broke:false };
    }
    const initialStates = [makeBallState(false)];
    if(queued.enhancement === 'invert') initialStates.push(makeBallState(true));

    const branchPromises = initialStates.map(bs=>{
      const ent = createBallEntity(state.node.r, state.node.c, bs);
      return travel(ent.ball, ent.tip, state.node.r, state.node.c, state.node.dir, bs, counter);
    });
    const resultsArrays = await Promise.all(branchPromises);
    const results = resultsArrays.flat();

    const gained = counter.points || 0;

    if(gained>0){
      let msg = `${counter.scored}/${counter.launched} bóng về đích — +${gained} điểm`;
      if(counter.broke) msg += ` (${counter.broke} bóng vỡ)`;
      setStatus(msg, 'good');
    } else {
      setStatus('Bóng rơi mất — không có bóng nào về đích', 'bad');
    }

    state.resolving = false;
    checkEndState();
  }

  function checkEndState(){
    if(state.score >= state.target){
      const unfired = state.ballQueue.length - state.ballsFired;
      const interestCap = 5 + state.interestCapBonus;
      const interest = Math.min(Math.floor(state.money/5), interestCap);
      const ballBonus = unfired*3;
      state.phase = 'reward';
      showLevelReward({unfired, ballBonus, interest});
    } else if(state.ballsFired >= state.ballQueue.length){
      state.phase = 'gameover';
      renderCardHand();
      showOverlay('lose', 'HẾT BÓNG — KẾT THÚC RUN', `Dừng lại ở màn ${state.level}, đạt ${state.score}/${state.target} điểm. Tổng tiền tích luỹ: $${state.money}.`);
    }
  }

  function collectOwnedBlocks(){
    const owned = [];
    for(const b of state.bag) owned.push({block:b,status:'available'});
    for(const b of state.hand) if(b) owned.push({block:b,status:'hand'});
    for(const b of state.discardPile) owned.push({block:b,status:'discarded'});
    if(state.cells){
      for(let r=0;r<state.rows;r++) for(let c=0;c<state.cols;c++){
        const b=state.cells[r][c].block;
        if(b) owned.push({block:b,status:'board'});
      }
    }
    const propOrder={wood:0,stone:1,gold:2,steel:3,glass:4};
    const enhOrder={holo:0,spark:1,invert:2};
    owned.sort((a,b)=>{
      const ba=a.block, bb=b.block;
      return ({straight:0,L:1,T:2,plus:3}[ba.type]-{straight:0,L:1,T:2,plus:3}[bb.type])
        || (!!ba.property-!!bb.property)
        || (!!ba.enhancement-!!bb.enhancement)
        || ((propOrder[ba.property]??99)-(propOrder[bb.property]??99))
        || ((enhOrder[ba.enhancement]??99)-(enhOrder[bb.enhancement]??99));
    });
    return owned;
  }

  function makeCommonItem(){
    const kind=pick(['upgrade','power','block']);
    if(kind==='upgrade'){ const def=pick(UPGRADE_POOL); return {kind,ref:{defId:def.id},name:def.name,desc:def.desc,price:def.cost}; }
    if(kind==='power'){ const def=pick(Object.values(POWER_CARD_DEFS)); return {kind,ref:{defId:def.id},name:def.name,desc:def.desc,price:def.cost}; }
    if(kind==='block'){ const b=specialBlock(); return {kind,ref:b,name:TYPE_LABEL[b.type],desc:(b.property?PROP_LABEL[b.property]:'')+(b.property&&b.enhancement?' · ':'')+(b.enhancement?ENH_LABEL[b.enhancement]:''),price:blockPrice(b)}; }
  }
  function makeCommonStock(){ return Array.from({length:2+Math.floor(Math.random()*2)}, makeCommonItem); }
  function makeGachaBox(){
    const type=pick(['block','ball','power','upgrade']), tier=pick(GACHA_TIERS);
    return {id:cardUid(),type,tier,options:null,selected:[],done:false};
  }
  function makeGachaStock(){ return Array.from({length:1+Math.floor(Math.random()*2)}, makeGachaBox); }

  function applyCommonItem(item){
    if(item.kind==='upgrade'){ const d=UPGRADE_POOL.find(x=>x.id===item.ref.defId); d.apply(); state.lastUpgrade=d; }
    else if(item.kind==='power'){ if(state.cardHand.length>=5) return false; state.cardHand.push({id:cardUid(),kind:item.kind,defId:item.ref.defId}); }
    else if(item.kind==='block') state.pendingBlocks.push({...item.ref});
    else state.nextBallPreset={...item.ref};
    return true;
  }

  function openShop(){
    if(!state.commonItems) state.commonItems=makeCommonStock();
    if(!state.gachaStock) state.gachaStock=makeGachaStock();
    if(!state.shopBuff) state.shopBuff={...pick(BUFF_POOL),bought:false};
    shopOverlayEl.classList.remove('hidden');

    function reroll(){ if(state.money<state.commonRerollCost) return; state.money-=state.commonRerollCost; state.commonRerollCost++; state.commonItems=makeCommonStock(); renderShop(); }
    function powerCanTargetBalls(def){
      return !!def && (def.targetKind==='ball' || def.targetKind==='both' || def.targetKind==='swap') && def.targetCount>0;
    }

    function openShopPowerChoice(item){
      const def=POWER_CARD_DEFS[item.ref.defId];
      const panel=shopOverlayEl.querySelector('.shop-panel');
      if(!panel || !def) return;
      const old=panel.querySelector('.shop-power-panel');
      if(old) old.remove();

      const choice=document.createElement('div');
      choice.className='shop-power-panel';
      choice.innerHTML=`<h3>Dùng ${def.name}</h3><p>Chọn mục tiêu để sử dụng thẻ.</p>`;
      const targetsWrap=document.createElement('div');
      targetsWrap.className='shop-power-targets';
      const selected=[];

      const ownedBlocks=collectOwnedBlocks().map(x=>x.block);
      const targets=[];
      if(def.targetKind==='block' || def.targetKind==='both' || def.targetKind==='swap') ownedBlocks.forEach(obj=>targets.push({obj,kind:'block'}));
      if(def.targetKind==='ball' || def.targetKind==='both' || def.targetKind==='swap') state.ballPool.forEach(obj=>targets.push({obj,kind:'ball'}));

      const renderSelected=()=>{
        [...targetsWrap.children].forEach((el,i)=>el.classList.toggle('selected',selected.some(t=>t.obj===targets[i].obj)));
      };

      targets.forEach((target,i)=>{

        attachObjectTooltip(el, target.obj, target.kind);

          if(pos>=0){
            selected.splice(pos,1);
          } else if(def.targetKind==='swap') {
            if(selected.length>=2) selected.shift();
            if(selected.length===0 || selected[0].kind===target.kind) selected.push(target);
          } else {
            selected.length=0;
            selected.push(target);
          }
          renderSelected();
          const valid = def.targetKind==='swap' ? selected.length===2 && selected[0].kind===selected[1].kind : selected.length===def.targetCount;
          accept.disabled=!valid;
        });
        targetsWrap.appendChild(el);

          const valid = def.targetKind==='swap' ? selected.length===2 && selected[0].kind===selected[1].kind : selected.length===def.targetCount;
          if(!valid) return;
        }
        def.use(selected);
        syncBallMutationTargets(selected);
        state.money-=item.price;

        moneyValEl.textContent=`$${state.money}`;

    function buyCommon(item){
      if(item.bought||state.money<item.price) return;
      if(item.kind==='upgrade'){
        if(state.cardHand.length>=5) return;
        state.cardHand.push({id:cardUid(),kind:item.kind,defId:item.ref.defId});
        state.money-=item.price; item.bought=true; moneyValEl.textContent=`$${state.money}`; render(); renderShop();
        return;
      }
      if(item.kind==='power'){
        if(state.cardHand.length>=5) return;
        state.cardHand.push({id:cardUid(),kind:item.kind,defId:item.ref.defId});
        state.money-=item.price; item.bought=true; moneyValEl.textContent=`$${state.money}`; render(); renderShop();
        return;
      }
      if(!applyCommonItem(item)) return;
      state.money-=item.price; item.bought=true; moneyValEl.textContent=`$${state.money}`; renderShop();
    }

    function useCommon(item){
      if(item.bought||state.money<item.price) return;
      if(item.kind==='upgrade'){
        const def=UPGRADE_POOL.find(x=>x.id===item.ref.defId);
        if(!def) return;
        def.apply(); state.lastUpgrade=def;
        state.money-=item.price; item.bought=true; moneyValEl.textContent=`$${state.money}`;
        render(); renderShop();
        return;
      }
      if(item.kind==='power'){
        const def=POWER_CARD_DEFS[item.ref.defId];
        if(powerCanTargetBalls(def)){
          openShopPowerChoice(item);
          return;
        }
        if(def.targetCount===0){
          def.use([]);
          state.money-=item.price; item.bought=true; moneyValEl.textContent=`$${state.money}`;
          render(); renderShop();

          const src=srcWrap?.querySelector('.ball-chip'), dst=dstWrap?.querySelector('.ball-chip');

    function onShopBallDragMove(e){

      shopBallDrag.targetX=e.clientX; shopBallDrag.targetY=e.clientY;

      if(!shopBallDrag.moved && Math.hypot(dx,dy)>6){
        shopBallDrag.moved=true;
        shopBallDrag.ghostEl=document.createElement('div');
        shopBallDrag.ghostEl.className='ball-drag-ghost';
        shopBallDrag.ghostEl.innerHTML=ballChipMarkup(state.ballPool[shopBallDrag.idx]);

        shopBallDrag.sourceEl.classList.add('drag-source-fade');

      if(shopBallDrag.moved){
        ballsWrapForDrag?.querySelectorAll?.('.ball-drop-hover')?.forEach(n=>n.classList.remove('ball-drop-hover'));
        const el=document.elementFromPoint(e.clientX,e.clientY)?.closest?.('.shop-ball-item');

        const targetIdx=[...ballsWrapForDrag.children].indexOf(el);

        const firedIds = state.phase==='playing' ? new Set(state.ballQueue.filter(b=>b.fired).map(b=>b._id)) : new Set();

      const sourceIdx=info.idx;

      ballsSection.appendChild(ballsWrap);
      panel.appendChild(ballsSection);

      const common=document.createElement('div'); common.className='shop-section'; common.innerHTML='<h3>Hàng hóa chung</h3>';
      const commonGrid=document.createElement('div'); commonGrid.className='shop-common-grid';
      state.commonItems.forEach(item=>{
        const row=document.createElement('div'); row.className='shop-card';
        const price=document.createElement('div'); price.className='shop-price price'; price.textContent=`$${item.price}`;
        row.appendChild(price);

        const visual=document.createElement('div'); visual.className='shop-item-visual';
        const name=document.createElement('div'); name.className='shop-item-name'; name.textContent=item.name;
        visual.appendChild(name);
        if(item.kind==='block'){
          const blockVisual=document.createElement('div');
          blockVisual.innerHTML=renderMiniBlockMarkup(item.ref);
          markDebugTarget(blockVisual, item.ref, 'block');
          attachObjectTooltip(blockVisual, item.ref, 'block');
          visual.appendChild(blockVisual);
        }
        if(item.kind==='power') attachCardTooltip(visual, POWER_CARD_DEFS[item.ref.defId]);
        if(item.kind==='upgrade') attachCardTooltip(visual, UPGRADE_POOL.find(x=>x.id===item.ref.defId));
        row.appendChild(visual);

        const actions=document.createElement('div'); actions.className='shop-item-actions';
        const buy=document.createElement('button'); buy.textContent=item.bought?'Đã mua':'Mua';
        buy.disabled=item.bought||state.money<item.price||((item.kind==='power'||item.kind==='upgrade')&&state.cardHand.length>=5);
        buy.addEventListener('click',()=>buyCommon(item));
        actions.appendChild(buy);
        if(item.kind==='power'||item.kind==='upgrade'){
          const use=document.createElement('button'); use.className='use-btn'; use.textContent='Dùng';
          use.disabled=item.bought||state.money<item.price;
          use.addEventListener('click',()=>useCommon(item));
          actions.appendChild(use);
        }
        row.appendChild(actions);
        commonGrid.appendChild(row);
      });
      common.appendChild(commonGrid);
      const rr=document.createElement('div'); rr.style.cssText='display:flex;justify-content:center;margin-top:8px;'; const rb=document.createElement('button'); rb.textContent=`Đổi hàng ($${state.commonRerollCost})`; rb.disabled=state.money<state.commonRerollCost; rb.addEventListener('click',reroll); rr.appendChild(rb); common.appendChild(rr); panel.appendChild(common);

      const lower=document.createElement('div'); lower.className='shop-lower';
      const buff=document.createElement('div'); buff.className='shop-section'; buff.innerHTML='<h3>Thẻ buff</h3>'; const br=document.createElement('div'); br.className='shop-card'; const bo=state.shopBuff; br.innerHTML=`<div class="shop-price">$${bo.cost}</div><div class="desc"><span class="name">${bo.name}</span>${bo.desc}</div>`; const buffActions=document.createElement('div'); buffActions.className='shop-item-actions'; const bb=document.createElement('button'); bb.textContent=bo.bought?'Đã mua':'Mua'; bb.disabled=bo.bought||state.money<bo.cost; bb.addEventListener('click',()=>{ state.money-=bo.cost; bo.apply(); bo.bought=true; moneyValEl.textContent=`$${state.money}`; renderShop(); }); buffActions.appendChild(bb); br.appendChild(buffActions); buff.appendChild(br); lower.appendChild(buff);
      const gach=document.createElement('div'); gach.className='shop-section'; gach.innerHTML='<h3>Các hộp gacha</h3>'; const gachGrid=document.createElement('div'); gachGrid.className='shop-gacha-grid'; state.gachaStock.forEach(g=>gachGrid.appendChild(renderGachaBox(g))); gach.appendChild(gachGrid); lower.appendChild(gach); panel.appendChild(lower);

      const cont=document.createElement('div'); cont.className='shop-continue'; const cb=document.createElement('button'); cb.className='gold'; cb.textContent='Tiếp tục →'; cb.addEventListener('click',()=>{ state.commonItems=null; state.gachaStock=null; state.commonRerollCost=3; newLevel(); }); cont.appendChild(cb); panel.appendChild(cont);
      shopOverlayEl.appendChild(panel);
    }
    activeRenderShop = renderShop;
    renderShop();
  }

  newRun();
})();
</script>
</body>
</html>
