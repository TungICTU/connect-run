  function renderBoardCell(r, c, boardReveal, boardHide){
    const cellData = state.cells[r][c];
    const el = document.createElement('div');
    el.dataset.r=r; el.dataset.c=c;
    el.className = 'cell ' + cellData.type + (cellData.block ? ' hasblock' : '') + (cellData.locked ? ' locked-cell' : '') + (cellData.debuff ? ' debuff-cell' : '');
    applyBoardCellAnimation(el, r, c, boardReveal, boardHide);

    if(cellData.type==='node'){
      renderNodeCell(el);
    } else if(cellData.type==='hole'){
      renderHoleCell(el, r, c);
    } else if(cellData.type==='black'){
      renderBlackCell(el);
    } else if(cellData.block){
      renderBlockCell(el, r, c, cellData.block);
    }

    if(cellData.locked){
      renderLockIcon(el, !!cellData.block);
      lockedCellTooltip(el);
    }
    if(cellData.debuff){
      const x=document.createElement('div');
      x.className='cell-debuff-x';
      el.appendChild(x);
      debuffCellTooltip(el);
    }
    boardEl.appendChild(el);
  }


  // Runtime-only visual feedback for debuff cells.
  function pulseDebuffBlock(cellEl){
    if(!cellEl || !cellEl.classList.contains('debuff-cell') || !cellEl.classList.contains('hasblock')) return;
    const visual = cellEl.querySelector('.block-visual');
    if(!visual) return;
    cellEl.classList.remove('debuff-block-feedback');
    void cellEl.offsetWidth;
    cellEl.classList.add('debuff-block-feedback');
    setTimeout(()=>{
      if(cellEl.isConnected) cellEl.classList.remove('debuff-block-feedback');
    }, scaledDuration(380));
  }

  function renderBoardSwapAnimation(){
    if(!swapAnim) return;
    const anim=swapAnim;
    swapAnim=null;
    requestAnimationFrame(()=>{
      const sourceEl=boardEl.querySelector(`.cell[data-r="${anim.source.r}"][data-c="${anim.source.c}"]`);
      const targetEl=boardEl.querySelector(`.cell[data-r="${anim.target.r}"][data-c="${anim.target.c}"]`);
      if(sourceEl&&targetEl){
        const sFrom=anim.sourceRect, sTo=anim.targetRect, tFrom=anim.targetRect, tTo=anim.sourceRect;
        const sVis=sourceEl.querySelector('.block-visual'), tVis=targetEl.querySelector('.block-visual');
        if(sVis){ sVis.style.setProperty('--from-x', `${sFrom.left-sTo.left}px`); sVis.style.setProperty('--from-y', `${sFrom.top-sTo.top}px`); sVis.style.setProperty('--block-deg', `${(state.cells[anim.source.r][anim.source.c].block.rotation||0)*90}deg`); sVis.style.animation='blockMoveIn calc(.34s / var(--anim-speed)) cubic-bezier(.22,.8,.24,1)'; }
        if(tVis){ tVis.style.setProperty('--from-x', `${tFrom.left-tTo.left}px`); tVis.style.setProperty('--from-y', `${tFrom.top-tTo.top}px`); tVis.style.setProperty('--block-deg', `${(state.cells[anim.target.r][anim.target.c].block.rotation||0)*90}deg`); tVis.style.animation='blockMoveIn calc(.34s / var(--anim-speed)) cubic-bezier(.22,.8,.24,1)'; }
      }
    });
  }

  function scheduleBoardAnimation(boardReveal, boardHide, revealToken, handRowEl){
    if(!boardReveal && !boardHide) return;
    const duration = ((state.rows * state.cols - 1) * 24 + 220) / animationSpeed;
    boardRevealTimer = setTimeout(()=>{
      if(revealToken !== boardRevealToken) return;
      if(boardReveal){
        boardEl.classList.remove('board-reveal-running');
        boardEl.classList.add('board-reveal-complete');
        state._boardReveal = false;
        state._handReveal = false;
        handRowEl?.classList.remove('hand-ui-reveal');
      } else {
        boardEl.classList.remove('board-hide-running');
        state._boardHide = false;
        state._handHide = false;
        handRowEl?.classList.remove('hand-ui-hide');
        if(typeof state._boardHideComplete === 'function') state._boardHideComplete();
      }
      boardRevealTimer = null;
    }, Math.max(0, duration));
  }

  function renderBoard(boardReveal, boardHide, revealToken){
    prepareBoardRender(boardReveal);

    // The board DOM is rebuilt on every render. Remember old debuff occupancy
    // so the X animates only when a block is actually added/removed.
    const previousDebuffBlocks = new Map();
    boardEl.querySelectorAll('.cell.debuff-cell').forEach(el=>{
      previousDebuffBlocks.set(`${el.dataset.r},${el.dataset.c}`, el.classList.contains('hasblock'));
    });

    boardEl.style.gridTemplateColumns = `repeat(${state.cols}, 1fr)`;
    boardEl.style.gridTemplateRows = `repeat(${state.rows}, 1fr)`;
    boardWrapEl.style.aspectRatio = `${state.cols} / ${state.rows}`;
    boardEl.innerHTML = '';

    for(let r=0;r<state.rows;r++){
      for(let c=0;c<state.cols;c++) renderBoardCell(r, c, boardReveal, boardHide);
    }

    if(!boardReveal && !boardHide){
      for(const [key, hadBlock] of previousDebuffBlocks){
        const [r,c] = key.split(',').map(Number);
        const cellData = state.cells?.[r]?.[c];
        if(!cellData?.debuff) continue;

        const hasBlock = !!cellData.block;
        const cellEl = boardEl.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
        const x = cellEl?.querySelector('.cell-debuff-x');
        if(!cellEl || !x) continue;

        if(!hadBlock && hasBlock){
          x.classList.add('debuff-x-grow');
        }else if(hadBlock && !hasBlock){
          x.classList.add('debuff-x-shrink');
        }
      }
    }

    renderBoardSwapAnimation();
    placeAnimCell = null;
  }
  function renderHUD(){
    bagCountEl.textContent = `Túi khối còn lại: ${formatNumber(state.bag.length)}`;
    discardCountEl.textContent = `(${formatNumber(state.discardsLeft)}/${formatNumber(getMaxDiscards())})`;
    discardBtnEl.disabled = state.discardsLeft<=0 || !state.hand.some(Boolean) || state.resolving || state.phase!=='playing' || !!state.targeting;
    scoreValEl.textContent = formatNumber(state.score);
    targetValEl.textContent = formatNumber(state.target);
    moneyValEl.textContent = formatMoney(state.money);
    levelValEl.textContent = formatNumber(state.level);
  }

  function render(){
    hideHoverTip();
    const boardReveal = !!state._boardReveal;
    const boardHide = !!state._boardHide;
    const revealToken = ++boardRevealToken;
    if(boardRevealTimer){
      clearTimeout(boardRevealTimer);
      boardRevealTimer = null;
    }

    boardEl.classList.toggle('board-reveal-running', boardReveal || boardHide);
    boardEl.classList.toggle('board-hide-running', boardHide);

    const handRowEl = document.querySelector('.hand-row');
    const handReveal = !!state._handReveal && boardReveal;
    const handHide = !!state._handHide && boardHide;
    handRowEl?.classList.toggle('hand-ui-reveal', handReveal);
    handRowEl?.classList.toggle('hand-ui-hide', handHide);
    handRowEl?.classList.toggle('reward-hidden', !!state._handRewardHidden || state.phase==='shop' || state.phase==='reward');
    boardEl.classList.remove('board-reveal-complete');

    renderBoard(boardReveal, boardHide, revealToken);
    handRowEl?.style.setProperty('--hand-delay-last', `${Math.max(0,getMaxHandSize()-1)*24}ms`);
    renderHand();
    scheduleBoardAnimation(boardReveal, boardHide, revealToken, handRowEl);
    renderBallQueue();
    renderCardHand();
    renderHUD();
    refreshAnimSlots.clear();
  }

  function renderHand(){
    handEl.innerHTML = '';
    for(let i=0;i<getMaxHandSize();i++){
      const slot = document.createElement('div');
      slot.style.setProperty('--hand-delay', `${i*24}ms`);
      const block = state.hand[i];
      slot.className = 'hand-slot' + (block ? ' filled' : ' empty-slot');
      slot.dataset.idx = i;
      if(block){
        renderBlockArms(slot, block);
        if(refreshAnimSlots.has(i)) slot.classList.add('just-refreshed');
        attachHandBlockDrag(slot, i);
        if(state.targeting && targetKindMatches(state.targeting.def, 'block')){
          slot.classList.add('targetable');
          if(state.targeting.targets.some(t=>t.obj===block)) slot.classList.add('target-selected');
        }
      }
      handEl.appendChild(slot);
    }
  }

  function syncBallPoolFromQueue(){
    const byId = new Map(state.ballPool.map(b=>[b._id,b]));
    const ordered = [];
    for(const q of state.ballQueue){
      const b = byId.get(q._id);
      if(!b) continue;
      b.property = q.property || null;
      b.enhancement = q.enhancement || null;
      ordered.push(b);
    }
    if(ordered.length===state.ballPool.length) state.ballPool = ordered;
  }

  function syncBallMutationTargets(targets){
    const ballTargets = (targets||[]).filter(t=>t.kind==='ball').map(t=>t.obj).filter(Boolean);
    if(!ballTargets.length) return;

    // Sync by stable ball _id rather than object identity. Some game flows can
    // rebuild/reorder state.ballPool or state.ballQueue, so comparing object
    // references can miss a mutation even when it is the same logical ball.
    const changedById = new Map();
    ballTargets.forEach(ball=>{
      if(!ball._id) return;
      changedById.set(ball._id, {
        property: ball.property || null,
        enhancement: ball.enhancement || null,
      });
    });

    state.ballPool.forEach(ball=>{
      const changed = changedById.get(ball._id);
      if(!changed) return;
      ball.property = changed.property;
      ball.enhancement = changed.enhancement;
    });

    state.ballQueue.forEach(q=>{
      const changed = changedById.get(q._id);
      if(!changed) return;
      q.property = changed.property;
      q.enhancement = changed.enhancement;
    });

    renderBallQueue();
    refreshOpenShop();
    refreshOpenGachaBalls();
  }

  function syncBallQueueFromPool(){
    ensureBallIds();
    const firedIds = new Set(state.ballQueue.filter(b=>b.fired).map(b=>b._id));
    const unfired = state.ballPool.filter(b=>!firedIds.has(b._id));
    let u=0;
    state.ballQueue = state.ballQueue.map(q=>{
      if(q.fired) return q;
      const b=unfired[u++];
      return {_id:b._id, fired:false, property:b.property||null, enhancement:b.enhancement||null};
    });
  }

  let ballClickSelection = null;
  let suppressBallClickUntil = 0;

  function clearBallClickSelection(){
    ballClickSelection = null;
    ballQueueEl.querySelectorAll('.ball-chip.click-selected').forEach(el=>el.classList.remove('click-selected'));
  }

  function handleBallQueueClick(idx){
    if(state.targeting || state.resolving || (state.phase!=='playing' && state.phase!=='shop')) return;
    const ball = state.ballQueue[idx];
    if(!ball || ball.fired || idx < state.ballsFired) return;

    const chip = [...ballQueueEl.children][idx];
    if(ballClickSelection===null){
      ballClickSelection = idx;
      chip?.classList.add('click-selected');
      return;
    }

    if(ballClickSelection===idx){
      clearBallClickSelection();
      return;
    }

    const sourceIdx = ballClickSelection;
    const targetIdx = idx;
    const sourceEl = [...ballQueueEl.children][sourceIdx];
    const targetEl = [...ballQueueEl.children][targetIdx];
    const sourceRect = sourceEl?.getBoundingClientRect();
    const targetRect = targetEl?.getBoundingClientRect();

    [state.ballQueue[sourceIdx], state.ballQueue[targetIdx]] = [state.ballQueue[targetIdx], state.ballQueue[sourceIdx]];
    syncBallPoolFromQueue();
    clearBallClickSelection();

    if(sourceRect && targetRect){
      ballSwapAnim={source:sourceIdx,target:targetIdx,sourceRect,targetRect};
    }
    renderBallQueue();
  }

  function renderBallQueue(){
    ballQueueEl.innerHTML = '';
    state.ballQueue.forEach((b, i)=>{
      const chip = document.createElement('div');
      chip.className = 'ball-chip' + (b.fired ? ' fired' : '');
      chip.dataset.ballIndex = i;
      if(b.property) chip.style.setProperty('--prop-color', PROP_COLOR[b.property]);
      if(b.property) chip.dataset.prop = b.property;
      if(b.enhancement) chip.dataset.enh = b.enhancement;
      chip.textContent = '';
      markDebugTarget(chip, b, 'ball');

      attachObjectTooltip(chip, b, 'ball');

      if(!b.fired && state.targeting && targetKindMatches(state.targeting.def, 'ball')){
        chip.classList.add('targetable');
        chip.addEventListener('click', ()=> handleTargetClick({obj:b, kind:'ball'}));
      }
      if(!b.fired && !state.targeting){
        chip.addEventListener('click', ()=>{
          if(performance.now() < suppressBallClickUntil) return;
          handleBallQueueClick(i);
        });
      }
      if(!b.fired) attachBallDrag(chip, i);
      ballQueueEl.appendChild(chip);
    });
    if(ballSwapAnim){
      const anim=ballSwapAnim;
      ballSwapAnim=null;
      requestAnimationFrame(()=>{
        const sourceEl=[...ballQueueEl.children][anim.source];
        const targetEl=[...ballQueueEl.children][anim.target];
        if(!sourceEl || !targetEl) return;
        const sourceRect=sourceEl.getBoundingClientRect();
        const targetRect=targetEl.getBoundingClientRect();
        const sx=anim.sourceRect.left-sourceRect.left, sy=anim.sourceRect.top-sourceRect.top;
        const tx=anim.targetRect.left-targetRect.left, ty=anim.targetRect.top-targetRect.top;
        sourceEl.style.setProperty('--from-x',`${sx}px`);
        sourceEl.style.setProperty('--from-y',`${sy}px`);
        sourceEl.style.animation='ballMoveIn calc(.34s / var(--anim-speed)) cubic-bezier(.22,.8,.24,1)';
        targetEl.style.setProperty('--from-x',`${tx}px`);
        targetEl.style.setProperty('--from-y',`${ty}px`);
        targetEl.style.animation='ballMoveIn calc(.34s / var(--anim-speed)) cubic-bezier(.22,.8,.24,1)';
      });
    }
  }

  let ballDrag = null;
  let ballSwapAnim = null;

  function attachBallDrag(chip, idx){
    chip.addEventListener('pointerdown', e=>{
      if(state.targeting){ e.preventDefault(); return; }
      if(state.resolving || (state.phase!=='playing' && state.phase!=='shop')) return;
      if(idx < state.ballsFired || state.ballQueue[idx].fired) return;
      startBallDrag(e, idx);
    });
  }

  function startBallDrag(e, idx){
    e.preventDefault();
    ballDrag={idx,startX:e.clientX,startY:e.clientY,targetX:e.clientX,targetY:e.clientY,moved:false,ghostEl:null,sourceEl:null,curX:e.clientX,curY:e.clientY};
    window.addEventListener('pointermove', onBallDragMove);
    window.addEventListener('pointerup', onBallDragEnd);
  }

  function onBallDragMove(e){
    if(!ballDrag) return;
    ballDrag.targetX=e.clientX; ballDrag.targetY=e.clientY;
    const dx=e.clientX-ballDrag.startX, dy=e.clientY-ballDrag.startY;
    if(!ballDrag.moved && Math.hypot(dx,dy)>6){
      ballDrag.moved=true;
      suppressBallClickUntil = performance.now() + 120;
      ballDrag.sourceEl=ballQueueEl.querySelector(`.ball-chip[data-ball-index=\"${ballDrag.idx}\"]`);
      if(!ballDrag.sourceEl){
        ballDrag.sourceEl=[...ballQueueEl.children][ballDrag.idx];
      }
      ballDrag.ghostEl=document.createElement('div');
      ballDrag.ghostEl.className='ball-drag-ghost';
      ballDrag.ghostEl.innerHTML=ballChipMarkup(state.ballQueue[ballDrag.idx]);
      document.body.appendChild(ballDrag.ghostEl);
      if(ballDrag.sourceEl) ballDrag.sourceEl.classList.add('drag-source-fade');
      ballDrag.curX=e.clientX; ballDrag.curY=e.clientY;
      dragGhostLoop(ballDrag);
    }
    if(ballDrag.moved) updateBallDropHover(e.clientX,e.clientY);
  }


  function updateBallDropHover(x,y){
    ballQueueEl.querySelectorAll('.ball-drop-hover').forEach(el=>el.classList.remove('ball-drop-hover'));
    const el=document.elementFromPoint(x,y)?.closest?.('.ball-chip');
    if(!el || el.classList.contains('fired')) return;
    const targetIdx=[...ballQueueEl.children].indexOf(el);
    if(targetIdx>=state.ballsFired && targetIdx!==ballDrag.idx) el.classList.add('ball-drop-hover');
  }


  function onBallDragEnd(e){
    window.removeEventListener('pointermove', onBallDragMove);
    window.removeEventListener('pointerup', onBallDragEnd);
    if(!ballDrag) return;
    if(ballDrag.raf) cancelAnimationFrame(ballDrag.raf);

    const info=ballDrag;
    ballDrag=null;
    ballQueueEl.querySelectorAll('.ball-drop-hover').forEach(el=>el.classList.remove('ball-drop-hover'));

    if(!info.moved){
      info.sourceEl?.classList.remove('drag-source-fade');
      info.ghostEl?.remove();
      return;
    }

    const el=document.elementFromPoint(e.clientX,e.clientY)?.closest?.('.ball-chip');
    const targetIdx=el ? [...ballQueueEl.children].indexOf(el) : -1;
    const sourceIdx=info.idx;
    if(targetIdx>=state.ballsFired && targetIdx!==sourceIdx && !state.ballQueue[targetIdx].fired){
      const sourceRect=info.sourceEl?.getBoundingClientRect();
      const targetEl=[...ballQueueEl.children][targetIdx];
      const targetRect=targetEl?.getBoundingClientRect();
      [state.ballQueue[sourceIdx], state.ballQueue[targetIdx]]=[state.ballQueue[targetIdx],state.ballQueue[sourceIdx]];
      syncBallPoolFromQueue();
      info.sourceEl?.classList.remove('drag-source-fade');
      info.ghostEl?.remove();
      if(sourceRect && targetRect) ballSwapAnim={source:sourceIdx,target:targetIdx,sourceRect,targetRect};
      renderBallQueue();
      return;
    }
    animateDragReturn(info);
  }

  function getCardSellPrice(def){
    return Math.floor((Number(def?.cost)||0) / 2);
  }

  function renderCardHand(){
    cardHandEl.innerHTML = '';
    if(!state.cardHand.length){
      cardHandEl.innerHTML = '<div class="tag-empty">Chưa có thẻ nào trong tay</div>';
      return;
    }
    state.cardHand.forEach((card, idx)=>{
      const isUpgrade = card.kind==='upgrade';
      const def = isUpgrade ? UPGRADE_POOL.find(x=>x.id===card.defId) : POWER_CARD_DEFS[card.defId];
      if(!def) return;
      const chip = document.createElement('div'); chip.className='power-card-chip';
      const nameSpan = document.createElement('span'); nameSpan.className='name'; nameSpan.textContent = def.name;
      attachCardTooltip(chip, def);

      const actions = document.createElement('div'); actions.className='card-actions';
      const btn = document.createElement('button'); btn.textContent='Dùng';
      btn.disabled = !['playing','shop'].includes(state.phase) || !!state.targeting;
      btn.addEventListener('click', ()=> activateCardFromHand(idx, def));

      const sellPrice = getCardSellPrice(def);
      const sellBtn = document.createElement('button');
      sellBtn.className='sell-card-btn';
      sellBtn.textContent=`Bán ${formatMoney(sellPrice)}`;
      sellBtn.disabled = !['playing','shop'].includes(state.phase) || !!state.targeting || sellPrice<=0;
      sellBtn.addEventListener('click', ()=>{
        if(!['playing','shop'].includes(state.phase) || state.targeting || sellPrice<=0) return;
        state.cardHand.splice(idx,1);
        state.money += sellPrice;
        moneyValEl.textContent=formatMoney(state.money);
        render();
        renderTargetBanner();
        scheduleAutoSave();
      });

      actions.appendChild(btn);
      actions.appendChild(sellBtn);
      chip.appendChild(nameSpan);
      chip.appendChild(actions);
      cardHandEl.appendChild(chip);
    });
  }


  // ---------- targeting mode (power cards) ----------
  function targetKindMatches(def, kind){
    if(def.targetKind === 'both') return true;
    if(def.targetKind === 'swap'){
      if(!state.targeting.targets.length) return true;
      return state.targeting.targets[0].kind === kind;
    }
    return def.targetKind === kind;
  }

  function rememberLastUsedCard(def){
    if(!def || def.id==='copy') return;
    state.lastUsedCard={kind:'power',defId:def.id};
  }

  function commitTargeting(){
    const t=state.targeting; if(!t) return false;
    const def=t.def, min=def.targetMinCount||def.targetCount, max=def.targetCount;
    if(t.targets.length<min || t.targets.length>max) return false;
    def.use(t.targets); rememberLastUsedCard(def); syncBallMutationTargets(t.targets); renderBallQueue();
    state.cardHand.splice(t.handIdx,1); state.targeting=null; render(); renderTargetBanner();
    if(state.phase==='shop') refreshOpenShop();
    return true;
  }

  function activateCardFromHand(handIdx, def){
    if(!def) return;
    const card=state.cardHand[handIdx];
    if(!card) return;
    if(card.kind==='upgrade'){
      def.apply();
      state.lastUpgrade=def;
      state.lastUsedCard={kind:'upgrade',defId:def.id};
      state.cardHand.splice(handIdx,1);
      render();
      renderTargetBanner();
      scheduleAutoSave();
      return;
    }
    activatePowerCardFromHand(handIdx, def);
  }

  function activatePowerCardFromHand(handIdx, def){
    if(!def) return;
    if(def.targetCount===0){
      state.cardHand.splice(handIdx,1);
      def.use([]);
      rememberLastUsedCard(def);
      render();
      return;
    }
    startTargeting(handIdx, def);
  }

  function startTargeting(handIdx, def){
    if(def.targetCount===0){
      state.cardHand.splice(handIdx,1);
      def.use([]); rememberLastUsedCard(def); render(); return;
    }
    state.targeting={handIdx,def,need:def.targetCount,targets:[]};
    render();
    renderTargetBanner();
  }

  function cancelTargeting(){
    state.targeting = null;
    inventoryOverlayEl.classList.add('hidden');
    inventoryOverlayEl.innerHTML='';
    render();
    renderTargetBanner();
    if(state.phase==='shop') refreshOpenShop();
  }

  function handleTargetClick(target){
    const t = state.targeting;
    if(!t) return;
    const def = t.def;
    if(!targetKindMatches(def, target.kind)) return;
    const existing = t.targets.findIndex(x=>x.obj===target.obj);
    if(existing>=0){
      t.targets.splice(existing,1);
    } else {
      if(t.targets.length>=t.need) return;
      t.targets.push(target);
    }
    if(t.targets.length >= t.need && !def.manualConfirm){
      commitTargeting();
    } else {
      render();
      renderTargetBanner();
    }
  }

  function renderTargetBanner(){
    const shopIsOpen = !shopOverlayEl.classList.contains('hidden');
    const shopPanel = shopIsOpen ? shopOverlayEl.querySelector('.shop-panel') : null;
    if(!state.targeting){
      targetBannerEl.classList.add('hidden');
      targetBannerEl.innerHTML='';
      shopPanel?.classList.remove('targeting-pass-through');
      return;
    }

    targetBannerEl.classList.remove('hidden');
    shopPanel?.classList.add('targeting-pass-through');
    const t=state.targeting;
    targetBannerEl.innerHTML='';

    const span=document.createElement('span');
    span.textContent=`Chọn mục tiêu cho ${t.def.name} (${t.targets.length}/${t.need})`;
    targetBannerEl.appendChild(span);

    const cancelBtn=document.createElement('button');
    cancelBtn.textContent='Huỷ';
    cancelBtn.addEventListener('click', e=>{
      e.preventDefault();
      e.stopPropagation();
      cancelTargeting();
    });
    targetBannerEl.appendChild(cancelBtn);

    if(t.def.manualConfirm){
      const confirmBtn=document.createElement('button');
      confirmBtn.className='gold';
      confirmBtn.textContent='Xác nhận';
      confirmBtn.disabled=t.targets.length<(t.def.targetMinCount||1);
      confirmBtn.addEventListener('click', e=>{
        e.preventDefault();
        e.stopPropagation();
        if(!confirmBtn.disabled) commitTargeting();
      });
      targetBannerEl.appendChild(confirmBtn);
    }
  }

  // ---------- drag & rotate ----------
  let drag = null;

  function attachHandBlockDrag(slot, idx){
    slot.addEventListener('pointerdown', e=>{
      if(state.targeting){ e.preventDefault(); handleTargetClick({obj: state.hand[idx], kind:'block'}); return; }
      if(state.resolving || state.phase!=='playing') return;
      startDrag(e, {origin:'hand', idx, block: state.hand[idx]});
    });
  }
  function pulseLockedBlock(cellEl){
    if(!cellEl) return;
    cellEl.classList.remove('locked-block-feedback');
    void cellEl.offsetWidth;
    cellEl.classList.add('locked-block-feedback');
    clearTimeout(cellEl._lockedFeedbackTimer);
    cellEl._lockedFeedbackTimer=setTimeout(()=>cellEl.classList.remove('locked-block-feedback'), scaledDuration(460));
  }

  function attachBoardBlockDrag(cellEl){
    cellEl.addEventListener('pointerdown', e=>{
      const r=+cellEl.dataset.r, c=+cellEl.dataset.c;
      if(state.targeting){ e.preventDefault(); handleTargetClick({obj: state.cells[r][c].block, kind:'block'}); return; }
      if(state.resolving || state.phase!=='playing') return;
      if(state.cells[r]?.[c]?.locked){
        e.preventDefault();
        pulseLockedBlock(cellEl);
        return;
      }
      startDrag(e, {origin:'board', r, c, block: state.cells[r][c].block});
    });
  }
  function startDrag(e, info){
    e.preventDefault();
    drag = Object.assign(info, {startX:e.clientX, startY:e.clientY, moved:false, ghostEl:null});
    window.addEventListener('pointermove', onDragMove);
    window.addEventListener('pointerup', onDragEnd);
  }
  function onDragMove(e){
    if(!drag) return;
    drag.targetX = e.clientX; drag.targetY = e.clientY;
    const dx=e.clientX-drag.startX, dy=e.clientY-drag.startY;
    if(!drag.moved && Math.hypot(dx,dy)>6){
      drag.moved = true;
      drag.ghostEl = document.createElement('div'); drag.ghostEl.className = 'drag-ghost';
      renderBlockArms(drag.ghostEl, drag.block);
      document.body.appendChild(drag.ghostEl);
      drag.curX = e.clientX; drag.curY = e.clientY;
      drag.sourceEl = drag.origin==='hand'
        ? handEl.querySelector(`.hand-slot[data-idx="${drag.idx}"]`)
        : boardEl.querySelector(`.cell[data-r="${drag.r}"][data-c="${drag.c}"]`);
      if(drag.sourceEl) drag.sourceEl.classList.add('drag-source-fade');
      dragGhostLoop(drag);
    }
    if(drag.moved) updateDropHover(e.clientX, e.clientY);
  }

  function dragGhostLoop(dragState){
    if(!dragState || !dragState.moved) return;
    const dx = dragState.targetX - dragState.curX, dy = dragState.targetY - dragState.curY;
    dragState.curX += dx*0.3; dragState.curY += dy*0.3;
    const tilt = Math.max(-16, Math.min(16, dx*0.15));
    dragState.ghostEl.style.left = dragState.curX+'px'; dragState.ghostEl.style.top = dragState.curY+'px';
    dragState.ghostEl.style.transform = `translate(-50%,-50%) rotate(${tilt}deg) scale(1.12)`;
    dragState.raf = requestAnimationFrame(()=>dragGhostLoop(dragState));
  }

  // board-origin drags may land on an occupied cell (swap); hand-origin drags may only land on empty cells
  function dropTargetCell(el){
    const cellEl = el && el.closest ? el.closest('.cell') : null;
    if(!cellEl || cellEl.classList.contains('node') || cellEl.classList.contains('hole') || cellEl.classList.contains('black-block')) return null;
    const targetLocked = cellEl.classList.contains('locked-cell');
    const targetOccupied = cellEl.classList.contains('hasblock');
    // A locked block itself can never be moved, and a normal block may not swap it
    // out of a locked cell. An empty locked cell is still a valid placement target.
    if(targetLocked && targetOccupied) return null;
    if(drag.origin==='hand' && targetOccupied) return null;
    if(drag.origin==='board' && +cellEl.dataset.r===drag.r && +cellEl.dataset.c===drag.c) return null;
    return cellEl;
  }
  function updateDropHover(x,y){
    document.querySelectorAll('.cell.drop-hover,.hand-slot.drop-hover').forEach(c=>c.classList.remove('drop-hover'));
    const el = document.elementFromPoint(x,y);
    const handSlot = el && el.closest ? el.closest('.hand-slot.filled') : null;
    if(handSlot && drag && drag.origin==='hand' && +handSlot.dataset.idx!==drag.idx){ handSlot.classList.add('drop-hover'); return; }
    const cellEl = dropTargetCell(el);
    if(cellEl) cellEl.classList.add('drop-hover');
  }

  function animateDragReturn(info){
    if(!info.ghostEl || !info.sourceEl){
      if(info.sourceEl) info.sourceEl.classList.remove('drag-source-fade');
      return;
    }
    const src=info.sourceEl.querySelector('.ball-chip')?.getBoundingClientRect() || info.sourceEl.getBoundingClientRect();
    const ghost=info.ghostEl.getBoundingClientRect();
    const dx=(src.left+src.width/2)-(ghost.left+ghost.width/2);
    const dy=(src.top+src.height/2)-(ghost.top+ghost.height/2);
    info.ghostEl.style.transition='transform calc(.24s / var(--anim-speed)) cubic-bezier(.22,.8,.24,1), opacity calc(.24s / var(--anim-speed)) ease';
    info.ghostEl.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(0deg) scale(1)`;
    setTimeout(()=>{ if(info.ghostEl) info.ghostEl.remove(); if(info.sourceEl) info.sourceEl.classList.remove('drag-source-fade'); },scaledDuration(250));
  }

  function onDragEnd(e){
    window.removeEventListener('pointermove', onDragMove);
    window.removeEventListener('pointerup', onDragEnd);
    if(!drag) return;

    if(drag.raf) cancelAnimationFrame(drag.raf);

    if(!drag.moved){
      if(drag.origin==='board' && state.cells[drag.r]?.[drag.c]?.locked){
        const lockedEl=boardEl.querySelector(`.cell[data-r="${drag.r}"][data-c="${drag.c}"]`);
        pulseLockedBlock(lockedEl);
        drag=null;
        return;
      }
      drag.block.rotation = (drag.block.rotation+1)%4;
      const containerEl = drag.origin==='hand'
        ? handEl.querySelector(`.hand-slot[data-idx="${drag.idx}"]`)
        : boardEl.querySelector(`.cell[data-r="${drag.r}"][data-c="${drag.c}"]`);
      const visual = containerEl && containerEl.querySelector('.block-visual');
      if(visual){
        const nextDeg = parseFloat(visual.dataset.deg||'0') + 90;
        visual.dataset.deg = nextDeg;
        visual.style.transform = `rotate(${nextDeg}deg)`;
      }
      syncHoleConnectionsForBlock(drag.r, drag.c);
      drag = null;
      return;
    }

    if(drag.ghostEl) drag.ghostEl.remove();
    document.querySelectorAll('.cell.drop-hover').forEach(c=>c.classList.remove('drop-hover'));

    const el = document.elementFromPoint(e.clientX, e.clientY);

    const handSlot = el && el.closest ? el.closest('.hand-slot.filled') : null;
    if(handSlot && drag.origin==='hand'){
      const targetIdx = +handSlot.dataset.idx;
      if(targetIdx !== drag.idx){
        [state.hand[drag.idx], state.hand[targetIdx]] = [state.hand[targetIdx], state.hand[drag.idx]];
        render();
      }
      drag = null;
      return;
    }

    const cellEl = dropTargetCell(el);

    if(cellEl){
      const r=+cellEl.dataset.r, c=+cellEl.dataset.c;
      if(drag.origin==='hand'){
        state.cells[r][c] = {
          type:'empty',
          block: drag.block,
          locked: !!state.cells[r][c].locked,
          debuff: !!state.cells[r][c].debuff
        };
        state.hand[drag.idx] = null;
        refillHand(true);
      } else if(drag.origin==='board'){
        const targetHadBlock=!!state.cells[r][c].block;
        const sourceRect=drag.sourceEl?.getBoundingClientRect();
        const targetRect=cellEl.getBoundingClientRect();
        state.cells[drag.r][drag.c].block = state.cells[r][c].block || null;
        state.cells[r][c].block = drag.block;
        if(targetHadBlock && sourceRect && targetRect) swapAnim={source:{r,c},target:{r:drag.r,c:drag.c},sourceRect,targetRect};
      }
      placeAnimCell = {r,c};
      drag.sourceEl?.classList.remove('drag-source-fade');
    } else {
      animateDragReturn(drag);
    }
    render();
    drag = null;
  }

  function syncHoleConnectionsForBlock(r,c){
    const block=state.cells[r]?.[c]?.block;
    if(!block) return;
    for(const d of [0,1,2,3]){
      const [dx,dy]=DIR_VEC[d], hr=r+dy, hc=c+dx;
      if(hr<0||hr>=state.rows||hc<0||hc>=state.cols||state.cells[hr][hc].type!=='hole') continue;
      const key=`${hr},${hc},${opposite(d)}`;
      const connected=openSides(block).includes(d);
      const holeEl=boardEl.querySelector(`.cell.hole[data-r=\"${hr}\"][data-c=\"${hc}\"]`);
      if(connected){
        if(state.holeConnections.has(key)) continue;
        const connector=document.createElement('div');
        connector.className='hole-connector '+DIR_NAMES[opposite(d)];
        if(holeEl) holeEl.appendChild(connector);
        state.holeConnections.add(key);
      } else if(state.holeConnections.has(key)){
        const connector=holeEl?.querySelector(`.hole-connector.${DIR_NAMES[opposite(d)]}`);
        if(connector){ connector.classList.add('retracting'); setTimeout(()=>connector.remove(),scaledDuration(290)); }
        state.holeConnections.delete(key);
      }
    }
  }

  // ---------- firing / simulation ----------
  function cellPercent(r,c){ return { left:((c+0.5)/state.cols)*100, top:((r+0.5)/state.rows)*100 }; }

  function computeScoreTooltipScale(currentTotal, initialTotal, targetTotal){
    const start = Number.isFinite(initialTotal) && initialTotal > 0 ? initialTotal : 50;
    const target = Number.isFinite(targetTotal) && targetTotal > start ? targetTotal : start + 1;
    const progress = Math.max(0, (currentTotal - start) / (target - start));
    const steps = Math.floor(progress * 10 + 1e-9);
    return Math.min(4, 1 + steps * 0.05);
  }

  function getScoreDisplayFontSize(scale=1){
    const safeScale = Number.isFinite(scale) ? scale : 1;
    return SCORE_DISPLAY_BASE_FONT_SIZE * safeScale;
  }

  function animateScoreTipValue(valueEl, nextTotal, previousTotal, initialTotal, targetTotal, tip){
    if(!valueEl) return;
    const prevTotal = Number.isFinite(previousTotal) ? previousTotal : nextTotal;
    const nextScale = computeScoreTooltipScale(nextTotal, initialTotal, targetTotal);
    const previousScale = Number.isFinite(valueEl._scoreScale) ? valueEl._scoreScale : 1;
    const crossedGrowthStep = nextScale > previousScale;

    if(valueEl._scoreAnim){ try{ valueEl._scoreAnim.cancel(); }catch{} valueEl._scoreAnim=null; }
    valueEl._scoreScale = nextScale;
    if(tip) tip.style.setProperty('--score-font-size', `${getScoreDisplayFontSize(nextScale)}px`);

    if(nextTotal <= prevTotal){
      valueEl.style.transform='scale(1)';
      return;
    }

    const duration=(crossedGrowthStep ? 420 : 280) / animationSpeed;
    const keyframes=crossedGrowthStep
      ? [
          {transform:'scale(1)'},
          {transform:'scale(1.16) translate3d(-2px,-1px,0) rotate(-4deg)',offset:.22},
          {transform:'scale(.96) translate3d(2px,1px,0) rotate(3.5deg)',offset:.48},
          {transform:'scale(1.04) translate3d(-1px,0,0) rotate(-1.5deg)',offset:.74},
          {transform:'scale(1) translate3d(0,0,0) rotate(0deg)',offset:1}
        ]
      : [
          {transform:'scale(1) translate3d(0,0,0) rotate(0deg)'},
          {transform:'scale(1) translate3d(-3px,-1px,0) rotate(-6deg)',offset:.14},
          {transform:'scale(1) translate3d(3px,1px,0) rotate(6deg)',offset:.28},
          {transform:'scale(1) translate3d(-2.5px,0,0) rotate(-4.5deg)',offset:.42},
          {transform:'scale(1) translate3d(2.5px,0,0) rotate(4.5deg)',offset:.56},
          {transform:'scale(1) translate3d(-1.5px,0,0) rotate(-2.5deg)',offset:.70},
          {transform:'scale(1) translate3d(1.5px,0,0) rotate(2.5deg)',offset:.84},
          {transform:'scale(1) translate3d(0,0,0) rotate(0deg)',offset:1}
        ];

    valueEl._scoreAnim=valueEl.animate(keyframes,{duration,easing:'cubic-bezier(.34,1.56,.64,1)',fill:'forwards',composite:'replace'});
    valueEl._scoreAnim.onfinish=()=>{ valueEl.style.transform='scale(1)'; valueEl._scoreAnim=null; };
  }

  function createBallEntity(r,c,ballState,animateScore=false,previousTotal=null){
    const ball = document.createElement('div'); ball.className='ball';
    if(ballState.prop){ ball.dataset.prop=ballState.prop; ball.style.setProperty('--prop-color', PROP_COLOR[ballState.prop]); }
    if(ballState.enh) ball.dataset.enh = ballState.enh;
    const p = cellPercent(r,c);
    ball.style.left=p.left+'%'; ball.style.top=p.top+'%';
    boardWrapEl.appendChild(ball);

    const tip = document.createElement('div'); tip.className='ball-tooltip';
    tip.style.left=p.left+'%'; tip.style.top=p.top+'%';
    const tipValue = document.createElement('span');
    tipValue.className='ball-tooltip-value';
    const currentTotal = Math.round(ballState.total);
    tipValue.textContent = formatNumber(currentTotal);
    tipValue._initialTotal = ballState.initialTotal;
    tipValue._scoreScale = 1;
    tipValue._lastTotal = Number.isFinite(previousTotal) ? Math.round(previousTotal) : currentTotal;
    tipValue.style.setProperty('--score-scale', '1');
    tipValue.style.setProperty('--score-scale-prev', '1');
    tipValue.style.transform='scale(1)';
    tip.style.setProperty('--score-font-size', `${SCORE_DISPLAY_BASE_FONT_SIZE}px`);
    tip.appendChild(tipValue);
    tip._valueEl = tipValue;
    boardWrapEl.appendChild(tip);

    if(animateScore && currentTotal > tipValue._lastTotal){
      requestAnimationFrame(()=>animateScoreTipValue(tipValue, currentTotal, tipValue._lastTotal, ballState.initialTotal, state.target, tip));
    } else {
      const scale = computeScoreTooltipScale(currentTotal, ballState.initialTotal, state.target);
      tipValue._scoreScale = scale;
      tipValue.style.transform = 'scale(1)';
      tip.style.setProperty('--score-font-size', `${getScoreDisplayFontSize(scale)}px`);
      tip.style.setProperty('--tooltip-scale', String(scale));
      tip._tooltipScale = scale;
    }

    return {ball, tip};
  }
  function moveEntityTo(ball,tip,r,c){
    return new Promise(resolve=>{
      void ball.offsetWidth; // force reflow so the browser commits the current position before we change it
      const p=cellPercent(r,c);
      ball.style.left=p.left+'%'; ball.style.top=p.top+'%';
      tip.style.left=p.left+'%'; tip.style.top=p.top+'%';
      setTimeout(resolve, scaledDuration(230));
    });
  }
  function updateTip(tip, ballState){
    const valueEl = tip?._valueEl || tip;
    const nextTotal = Math.round(ballState.total);
    const previousTotal = Number.isFinite(valueEl._lastTotal) ? valueEl._lastTotal : nextTotal;
    valueEl.textContent = formatNumber(nextTotal);
    if(nextTotal > previousTotal){
      animateScoreTipValue(valueEl, nextTotal, previousTotal, ballState.initialTotal, state.target, tip);
    }
    valueEl._lastTotal = nextTotal;
  }
  function removeEntity(ball,tip){ ball.remove(); tip.remove(); }
  function flashBlocked(r,c){
    const cellEl = boardEl.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
    if(cellEl){ cellEl.classList.remove('blocked-flash'); void cellEl.offsetWidth; cellEl.classList.add('blocked-flash'); }
  }
  function breakBlockAt(r,c){
    state.cells[r][c].block = null;
    for(const d of [0,1,2,3]){
      const [dx,dy]=DIR_VEC[d], hr=r+dy, hc=c+dx;
      if(hr<0||hr>=state.rows||hc<0||hc>=state.cols||state.cells[hr][hc].type!=='hole') continue;
      const key=`${hr},${hc},${opposite(d)}`;
      const holeEl=boardEl.querySelector(`.cell.hole[data-r=\"${hr}\"][data-c=\"${hc}\"]`);
      if(state.holeConnections.has(key)){
        const connector=holeEl?.querySelector(`.hole-connector.${DIR_NAMES[opposite(d)]}`);
        if(connector){ connector.classList.add('retracting'); setTimeout(()=>connector.remove(),scaledDuration(290)); }
        state.holeConnections.delete(key);
      }
    }
    const cellEl = boardEl.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
    if(cellEl){
      cellEl.classList.remove('hasblock');
      cellEl.querySelectorAll('.block-visual').forEach(n=>{ n.style.transition='opacity calc(.3s / var(--anim-speed))'; n.style.opacity='0'; });
      setTimeout(()=>{ cellEl.querySelectorAll('.block-visual').forEach(n=>n.remove()); }, scaledDuration(300));
    }
  }
  function wait(ms){ return new Promise(res=>setTimeout(res,scaledDuration(ms))); }

  // ---------- gameplay effects (data-driven) ----------
  // ballState: { total, rate, prop, enh, broke }
  const BLOCK_PROP_EFFECTS = {
    steel: { onExit:()=>{} },
    stone: { onExit:(bs, x)=>{ bs.total += 50*x; } },
    wood:  { onExit:(bs, x)=>{ bs.rate += 5*x; } },
    glass: { onExit:(bs, x)=>{ for(let i=0;i<x;i++) bs.total *= 1.5; }, chanceToBreak:0.10 },
    gold:  { onExit:()=>{} },
  };

  const BALL_PROP_EFFECTS = {
    striped: { onExit:()=>{} },
    grid:    { onExit:(bs, x)=>{ bs.total += 10*x; } },
    glass:   { onExit:(bs, x)=>{ for(let i=0;i<x;i++) bs.total *= 2; } },
    steel:   { onGoal:(bs, x)=>{ for(let i=0;i<x;i++) bs.total *= 1.5; } },
    gold:    { onGoal:(bs, x)=>{ state.money += 1*x; } },
  };

  const ENHANCEMENT_EFFECTS = {
    spark: { blockExit:(bs,multiplier)=>{ bs.total *= multiplier; }, ballExit:(bs,multiplier)=>{ bs.total *= multiplier; } },
    holo:  { blockExit:(bs)=>{ bs.total += 50; }, ballExit:(bs)=>{ bs.total += 50; } },
  };

  // Spark multiplier state is runtime-only and scoped to the current shot.
  // Each Spark block starts at x1.5 on the first encounter of the shot, then
  // loses 0.1 after every use during that shot, never going below x1.
  // The Map is shared by all branches of the shot and is recreated for the
  // next shot, so every Spark block resets back to x1.5 between shots.
  const SPARK_START_MULTIPLIER = 1.5;
  const SPARK_DECAY = 0.1;
  const SPARK_MIN_MULTIPLIER = 1.0;
  function getBlockSparkMultiplier(block, ballState){
    if(!block || !ballState?.shotMeta) return SPARK_MIN_MULTIPLIER;
    const meta=ballState.shotMeta;
    if(!meta.sparkBlockMultipliers) meta.sparkBlockMultipliers=new Map();
    let value=meta.sparkBlockMultipliers.get(block);
    if(!Number.isFinite(value)) value=SPARK_START_MULTIPLIER;
    value=Math.max(SPARK_MIN_MULTIPLIER, Math.round(value*10)/10);
    meta.sparkBlockMultipliers.set(block,value);
    return value;
  }
  function consumeBlockSparkMultiplier(block, ballState){
    if(!ballState?.shotMeta) return SPARK_MIN_MULTIPLIER;
    const current=getBlockSparkMultiplier(block, ballState);
    const next=Math.max(SPARK_MIN_MULTIPLIER, Math.round((current-SPARK_DECAY)*10)/10);
    ballState.shotMeta.sparkBlockMultipliers.set(block,next);
    return next;
  }
  function getBallSparkMultiplier(ballState){
    const meta=ballState?.shotMeta;
    const value=Number.isFinite(meta?.sparkMultiplier) ? meta.sparkMultiplier : SPARK_START_MULTIPLIER;
    if(meta && !Number.isFinite(meta.sparkMultiplier)) meta.sparkMultiplier=SPARK_START_MULTIPLIER;
    return Math.max(SPARK_MIN_MULTIPLIER, Math.round(value*10)/10);
  }
  function consumeBallSparkMultiplier(ballState){
    if(!ballState?.shotMeta) return SPARK_MIN_MULTIPLIER;
    ballState.shotMeta.sparkMultiplier=Math.max(
      SPARK_MIN_MULTIPLIER,
      Math.round((getBallSparkMultiplier(ballState)-SPARK_DECAY)*10)/10
    );
    return ballState.shotMeta.sparkMultiplier;
  }

  function syncMoneyHud(){
    moneyValEl.textContent = formatMoney(state.money);
  }

  function blockExitEffects(block, ballState){
    const prop = block.property, enh = block.enhancement;
    let brokeBlock = false;
    const tooltips=[];

    // Property effects are no longer doubled by Spark. Spark is its own
    // decaying multiplier applied after the normal block gain.
    const propFx = BLOCK_PROP_EFFECTS[prop];
    propFx?.onExit?.(ballState, 1);
    if(prop==='steel'){
      if(!ballState.steelBlocks) ballState.steelBlocks = new Set();
      ballState.steelBlocks.add(block);
    }

    // Striped balls multiply the score granted by this block, not the current
    // accumulated score of the ball.
    const blockGain = ballState.prop==='striped' ? ballState.rate * 1.5 : ballState.rate;
    ballState.total += blockGain;

    if(propFx?.chanceToBreak && Math.random() < propFx.chanceToBreak) brokeBlock = true;

    if(prop==='stone') tooltips.push({text:'+50',kind:'stone'});

    if(enh==='spark'){
      const multiplier=getBlockSparkMultiplier(block, ballState);
      if(multiplier>SPARK_MIN_MULTIPLIER){
        ENHANCEMENT_EFFECTS.spark.blockExit(ballState,multiplier);
        tooltips.push({text:`x${multiplier.toFixed(1)}`,kind:'spark'});
        consumeBlockSparkMultiplier(block, ballState);
      }
    }
    if(enh==='holo') ENHANCEMENT_EFFECTS.holo.blockExit(ballState);

    ballState.total += (state.typeBonus[block.type] || 0);
    return {brokeBlock, tooltips};
  }

  function ballExitEffects(ballState){
    const prop = ballState.prop, enh = ballState.enh;
    const tooltips=[];
    BALL_PROP_EFFECTS[prop]?.onExit?.(ballState, 1);
    if(enh==='spark'){
      const multiplier=getBallSparkMultiplier(ballState);
      if(multiplier>SPARK_MIN_MULTIPLIER){
        ENHANCEMENT_EFFECTS.spark.ballExit(ballState,multiplier);
        tooltips.push({text:`x${multiplier.toFixed(1)}`,kind:'spark'});
        consumeBallSparkMultiplier(ballState);
      }
    }
    if(enh==='holo') ENHANCEMENT_EFFECTS.holo.ballExit(ballState);
    return tooltips;
  }

  function createBlockExitTooltip(row,col,text,kind){
    if(!Number.isInteger(row)||!Number.isInteger(col)||!boardWrapEl) return null;
    const tip=document.createElement('div');
    tip.className=`block-exit-tooltip ${kind||''}`.trim();
    tip.textContent=text;
    const p=cellPercent(row,col);
    tip.style.left=p.left+'%';
    tip.style.top=p.top+'%';
    boardWrapEl.appendChild(tip);
    return tip;
  }

  // Non-blocking block-exit tooltip sequence. Tooltips are visual feedback only,
  // so the ball continues travelling while they appear. Multiple tooltips are
  // staggered in the requested order: property first, enhancement second.
  function animateBlockExitTooltips(row,col,tooltips,generation){
    if(!Array.isArray(tooltips)||!tooltips.length) return true;
    const sequence=tooltips.slice();
    sequence.forEach((item,index)=>{
      const delay=scaledDuration(index*190);
      setTimeout(()=>{
        if(generation!==runGeneration || !state) return;
        const tip=createBlockExitTooltip(row,col,item.text,item.kind);
        if(!tip) return;
        requestAnimationFrame(()=>tip.classList.add('show'));
        setTimeout(()=>{
          if(!tip.isConnected) return;
          if(generation!==runGeneration || !state){ tip.remove(); return; }
          tip.classList.remove('show');
          tip.classList.add('hide');
          setTimeout(()=>tip.remove(), scaledDuration(100));
        }, scaledDuration(180));
      }, delay);
    });
    return true;
  }

  function removeBallPermanently(ballId){
    if(!ballId || !state) return false;
    const qIndex=state.ballQueue.findIndex(q=>q._id===ballId);
    let changed=false;
    if(qIndex>=0){ state.ballQueue.splice(qIndex,1); state.ballsFired=Math.max(0,state.ballsFired-1); changed=true; }
    const before=state.ballPool.length;
    state.ballPool=state.ballPool.filter(b=>b._id!==ballId);
    changed=changed || state.ballPool.length!==before;
    if(changed){ renderBallQueue(); refreshOpenShop(); refreshOpenGachaBalls(); scheduleAutoSave(); }
    return changed;
  }

  function finishGlassBranch(ballState,reachedGoal){
    if(ballState?.prop!=='glass') return;
    const meta=ballState.glassShot;
    if(!meta || meta.finished) return;
    meta.active=Math.max(0,meta.active-1);
    if(meta.active!==0) return;
    if(reachedGoal && !meta.lossChecked){
      meta.lossChecked=true;
      if(Math.random()<0.10){
        meta.permanentlyLost=true;
        removeBallPermanently(meta.ballId);
      }
    }
  }

  function findBlockCell(blockRef){
    if(!blockRef || !state?.cells) return null;
    for(let r=0;r<state.rows;r++) for(let c=0;c<state.cols;c++){
      if(state.cells[r][c]?.block===blockRef) return {r,c};
    }
    return null;
  }

  function createSteelMultiplierTooltip(blockRef){
    const pos=findBlockCell(blockRef);
    if(!pos) return null;
    const tip=document.createElement('div');
    tip.className='steel-multiplier-tooltip';
    tip.textContent='x1.5';
    const p=cellPercent(pos.r,pos.c);
    tip.style.left=p.left+'%';
    tip.style.top=p.top+'%';
    boardWrapEl.appendChild(tip);
    return tip;
  }

  function createGoldRewardTooltip(blockRef){
    const pos=findBlockCell(blockRef);
    if(!pos) return null;
    const tip=document.createElement('div');
    tip.className='gold-reward-tooltip';
    tip.textContent='+3$';
    const p=cellPercent(pos.r,pos.c);
    tip.style.left=p.left+'%';
    tip.style.top=p.top+'%';
    boardWrapEl.appendChild(tip);
    return tip;
  }

  async function animateSteelGoalMultipliers(ballState, goalPopup, generation){
    const steelBlocks = Array.from(ballState.steelBlocks || []);
    let activeTip = null;

    for(let i=0;i<steelBlocks.length;i++){
      if(generation!==runGeneration || !state) return false;

      const nextTip=createSteelMultiplierTooltip(steelBlocks[i]);
      if(!nextTip){
        ballState.total*=1.5;
        updateGoalPopupScore(goalPopup, ballState);
        continue;
      }

      // Stronger chained sequence: show the next tooltip first, then hide the previous
      // one at the same time instead of fully completing one tooltip before starting the next.
      requestAnimationFrame(()=>nextTip.classList.add('show'));
      await wait(70);
      if(generation!==runGeneration || !state){ nextTip.remove(); activeTip?.remove(); return false; }

      ballState.total*=1.5;
      updateGoalPopupScore(goalPopup, ballState, {impact:true, rise:40});

      if(activeTip){
        activeTip.classList.remove('show');
        activeTip.classList.add('hide');
      }

      if(activeTip){
        await wait(100);
        if(generation!==runGeneration || !state){ nextTip.remove(); activeTip.remove(); return false; }
        activeTip.remove();
      }

      activeTip=nextTip;
      await wait(i < steelBlocks.length-1 ? 90 : 260);
    }

    if(activeTip){
      if(generation!==runGeneration || !state){ activeTip.remove(); return false; }
      activeTip.classList.remove('show');
      activeTip.classList.add('hide');
      await wait(100);
      activeTip.remove();
    }
    return true;
  }

  async function animateGoldBlockRewards(goldBlocks, generation){
    let activeTip = null;

    for(let i=0;i<goldBlocks.length;i++){
      if(generation!==runGeneration || !state) return false;

      const nextTip=createGoldRewardTooltip(goldBlocks[i]);
      if(!nextTip) continue;

      requestAnimationFrame(()=>nextTip.classList.add('show'));
      await wait(70);
      if(generation!==runGeneration || !state){ nextTip.remove(); activeTip?.remove(); return false; }

      if(activeTip){
        activeTip.classList.remove('show');
        activeTip.classList.add('hide');
      }

      if(activeTip){
        await wait(100);
        if(generation!==runGeneration || !state){ nextTip.remove(); activeTip.remove(); return false; }
        activeTip.remove();

        // Each gold block pays exactly once when its tooltip finishes disappearing.
        state.money += 3;
        syncMoneyHud();
      }

      activeTip=nextTip;
      await wait(i < goldBlocks.length-1 ? 90 : 260);
    }

    if(activeTip){
      if(generation!==runGeneration || !state){ activeTip.remove(); return false; }
      activeTip.classList.remove('show');
      activeTip.classList.add('hide');
      await wait(100);
      activeTip.remove();

      state.money += 3;
      syncMoneyHud();
    }

    return true;
  }

  function syncGoalPopupScoreSize(goalPopup, ballState){
    if(!goalPopup || !ballState || !state) return;
    const scale=computeScoreTooltipScale(ballState.total, ballState.initialTotal, state.target);
    goalPopup.style.fontSize=`${getScoreDisplayFontSize(scale)}px`;
    goalPopup._scoreScale=scale;
  }

  function getGoalPopupValueEl(goalPopup){
    return goalPopup?._valueEl || goalPopup;
  }

  function pulseGoalPopupValue(goalPopup){
    const valueEl=getGoalPopupValueEl(goalPopup);
    if(!valueEl) return;
    valueEl.classList.remove('impact');
    void valueEl.offsetWidth;
    valueEl.classList.add('impact');
  }

  // Popup flight uses one constant pixel-per-second speed for the entire life of the popup.
  // Extending the flight reuses that same speed, so there is no visible pause, jump, or acceleration.
  const GOAL_POPUP_FLIGHT_SPEED = 42; // px/s
  const GOAL_POPUP_FIRST_IMPACT_DELAY = 180; // ms: short pause after popup appears before the first extra-score source
  const GOAL_POPUP_IMPACT_RISE = 42;  // extra travel added for each new score impact
  const GOAL_POPUP_FINAL_RISE = 56;   // final travel while fading out
  const GOAL_POPUP_FINAL_FADE_DURATION = 520; // ms: quick fade after the final score impact

  function getGoalPopupCurrentTop(goalPopup){
    const computedTop=parseFloat(getComputedStyle(goalPopup).top);
    return Number.isFinite(computedTop) ? computedTop : 0;
  }

  function continueGoalPopupFlight(goalPopup, extraRise=0, {fade=false}={}){
    if(!goalPopup || !boardWrapEl) return;

    const currentTop=getGoalPopupCurrentTop(goalPopup);
    const speed=GOAL_POPUP_FLIGHT_SPEED;
    const distance=Math.max(0, Number(extraRise)||0);

    if(goalPopup._flightAnim){
      try{ goalPopup._flightAnim.cancel(); }catch{}
      goalPopup._flightAnim=null;
    }

    goalPopup.style.top=`${currentTop}px`;
    goalPopup.style.transform='translate(-50%, -50%) scale(1)';
    if(!fade) goalPopup.style.opacity='1';

    if(distance<=0) return;

    const duration=Math.max(1, scaledDuration((distance/speed)*1000));
    const nextTop=currentTop-distance;
    goalPopup._flightAnim=goalPopup.animate(
      [
        {top:`${currentTop}px`},
        {top:`${nextTop}px`}
      ],
      {duration,easing:'linear',fill:'forwards'}
    );
    goalPopup._flightAnim.onfinish=()=>{
      if(goalPopup._flightAnim) goalPopup._flightAnim=null;
    };
  }

  function startGoalPopupFlight(goalPopup, row, col){
    const boardRect=boardWrapEl.getBoundingClientRect();
    const startTop=boardRect.height*((row+0.5)/state.rows);

    goalPopup.style.top=`${startTop}px`;
    goalPopup.style.opacity='1';
    goalPopup.style.transform='translate(-50%, -50%) scale(1)';

    // The popup starts moving upward immediately, at one constant linear speed.
    continueGoalPopupFlight(goalPopup, 70);
  }

  function updateGoalPopupScore(goalPopup, ballState, {impact=true, rise=38}={}){
    if(!goalPopup || !ballState || !state) return;
    const valueEl=getGoalPopupValueEl(goalPopup);
    const nextTotal=Math.round(ballState.total);
    const previousTotal=Number.isFinite(goalPopup._lastTotal) ? goalPopup._lastTotal : nextTotal;
    if(valueEl) valueEl.textContent=formatNumber(nextTotal);
    syncGoalPopupScoreSize(goalPopup, ballState);
    goalPopup._lastTotal=nextTotal;

    if(nextTotal>previousTotal){
      // The parent never pauses: only the value itself receives the impact animation.
      if(impact) pulseGoalPopupValue(goalPopup);
      continueGoalPopupFlight(goalPopup, Number.isFinite(rise) ? rise : GOAL_POPUP_IMPACT_RISE);
    }
  }

  async function finishGoalPopup(goalPopup, generation){
    if(!goalPopup) return;
    if(generation!==runGeneration || !state){ goalPopup.remove(); return; }

    // No pause after the final score: extend the same constant-speed flight and fade
    // at the same time. The popup therefore follows one straight, uninterrupted path.
    const finalRise=GOAL_POPUP_FINAL_RISE;
    const duration=Math.max(1, scaledDuration((finalRise/GOAL_POPUP_FLIGHT_SPEED)*1000));
    continueGoalPopupFlight(goalPopup, finalRise, {fade:true});

    const fadeDuration=Math.max(1, scaledDuration(GOAL_POPUP_FINAL_FADE_DURATION));
    const fade=goalPopup.animate(
      [
        {opacity:1},
        {opacity:0}
      ],
      {duration:fadeDuration,easing:'linear',fill:'forwards'}
    );
    goalPopup._fadeAnim=fade;
    await new Promise(resolve=>{ fade.onfinish=resolve; fade.oncancel=resolve; });
    if(goalPopup._fadeAnim===fade) goalPopup._fadeAnim=null;
  }

  function ballGoalEffects(ballState){
    const prop=ballState.prop;
    // Steel block multipliers are resolved visually/sequentially in travel() so the
    // player can see exactly which steel block grants each x1.5.
    BALL_PROP_EFFECTS[prop]?.onGoal?.(ballState,1);
    if(prop==='gold' || prop==='steel') syncMoneyHud();
  }

  function createLostBallScorePopup(ballState, row, col){
    if(!ballState || !Number.isInteger(row) || !Number.isInteger(col) || !boardWrapEl) return null;

    const payoutState={
      total:Math.round(ballState.total/2),
      initialTotal:Math.round(ballState.total/2)
    };
    const popup=document.createElement('div');
    popup.className='ball-goal-popup steel-sequence';
    const value=document.createElement('span');
    value.className='ball-goal-popup-value';
    value.textContent=formatNumber(payoutState.total);
    popup._valueEl=value;
    popup._lastTotal=payoutState.total;

    const scale=computeScoreTooltipScale(payoutState.total, payoutState.initialTotal, state.target);
    popup.style.fontSize=`${getScoreDisplayFontSize(scale)}px`;
    const goalColor = ballState.enh ? ENH_COLOR[ballState.enh] : (ballState.prop ? PROP_COLOR[ballState.prop] : 'var(--amber)');
    popup.style.color=goalColor || 'var(--amber)';

    const pos=cellPercent(row,col);
    popup.style.left=pos.left+'%';
    popup.style.top=pos.top+'%';
    popup.appendChild(value);
    boardWrapEl.appendChild(popup);
    startGoalPopupFlight(popup,row,col);
    requestAnimationFrame(()=>pulseGoalPopupValue(popup));
    return {popup,payoutState};
  }

  async function animateSteelLostBallMultipliers(ballState, payoutState, popup, generation){
    const steelBlocks=Array.from(ballState.steelBlocks || []);
    let activeTip=null;

    for(let i=0;i<steelBlocks.length;i++){
      if(generation!==runGeneration || !state) return false;
      const nextTip=createSteelMultiplierTooltip(steelBlocks[i]);
      if(!nextTip){
        payoutState.total*=1.5;
        updateGoalPopupScore(popup,payoutState,{impact:true,rise:40});
        continue;
      }

      requestAnimationFrame(()=>nextTip.classList.add('show'));
      await wait(70);
      if(generation!==runGeneration || !state){ nextTip.remove(); activeTip?.remove(); return false; }

      payoutState.total*=1.5;
      updateGoalPopupScore(popup,payoutState,{impact:true,rise:40});

      if(activeTip){
        activeTip.classList.remove('show');
        activeTip.classList.add('hide');
        await wait(100);
        if(generation!==runGeneration || !state){ nextTip.remove(); activeTip.remove(); return false; }
        activeTip.remove();
      }

      activeTip=nextTip;
      await wait(i < steelBlocks.length-1 ? 90 : 260);
    }

    if(activeTip){
      if(generation!==runGeneration || !state){ activeTip.remove(); return false; }
      activeTip.classList.remove('show');
      activeTip.classList.add('hide');
      await wait(100);
      activeTip.remove();
    }
    return true;
  }

  async function awardLostInvertBall(ballState, row, col, generation=runGeneration){
    if(ballState?.enh!=='invert' || ballState.lostScorePaid) return true;
    ballState.lostScorePaid=true;

    const created=createLostBallScorePopup(ballState,row,col);
    if(!created){
      const points=Math.round((ballState.total/2));
      state.score += points;
      if(ballState.counter) ballState.counter.points=(ballState.counter.points||0)+points;
      scoreValEl.textContent=formatNumber(state.score);
      return true;
    }

    const {popup,payoutState}=created;
    await wait(GOAL_POPUP_FIRST_IMPACT_DELAY);
    if(generation!==runGeneration || !state){ popup.remove(); return false; }

    const steelResolved=await animateSteelLostBallMultipliers(ballState,payoutState,popup,generation);
    if(!steelResolved || generation!==runGeneration || !state){ popup.remove(); return false; }

    await finishGoalPopup(popup,generation);
    if(generation!==runGeneration || !state){ popup.remove(); return false; }

    popup.remove();
    const points=Math.round(payoutState.total);
    state.score += points;
    if(ballState.counter) ballState.counter.points=(ballState.counter.points||0)+points;
    scoreValEl.textContent=formatNumber(state.score);
    return true;
  }

  async function loseBall(ball, tip, r, c, ballState=null){
    if(Number.isInteger(r) && Number.isInteger(c)) flashBlocked(r,c);
    ball.classList.add('lost');
    tip.style.opacity='0';

    // Invert balls show the same upward score popup as a goal, paying half of
    // their currently accumulated score. Steel-block multipliers are still applied
    // to that 50% payout before it is added to the stage score.
    const generation=runGeneration;
    await wait(300);
    removeEntity(ball,tip);
    if(Number.isInteger(r) && Number.isInteger(c)){
      const ok=await awardLostInvertBall(ballState,r,c,generation);
      if(!ok) return [];
    } else {
      await awardLostInvertBall(ballState,
        Number.isInteger(ballState?.lastRow) ? ballState.lastRow : 0,
        Number.isInteger(ballState?.lastCol) ? ballState.lastCol : 0,
        generation);
    }

    finishGlassBranch(ballState,false);
    return [];
  }

  async function travel(ball, tip, row, col, dir, ballState, counter, generation=runGeneration){
    if(generation!==runGeneration || !state){
      removeEntity(ball,tip);
      return [];
    }
    counter.launched++;
    ballState.lastRow=row;
    ballState.lastCol=col;
    const [dx,dy] = DIR_VEC[dir];
    const nr=row+dy, nc=col+dx;

    if(nr<0||nr>=state.rows||nc<0||nc>=state.cols){
      const p = cellPercent(row,col);
      const L=(p.left+dx*40)+'%', T=(p.top+dy*40)+'%';
      ball.style.left=L; ball.style.top=T; tip.style.left=L; tip.style.top=T;
      await wait(230);
      if(generation!==runGeneration || !state){ removeEntity(ball,tip); return []; }
      return loseBall(ball, tip, undefined, undefined, ballState);
    }

    await moveEntityTo(ball,tip,nr,nc);
    if(generation!==runGeneration || !state){ removeEntity(ball,tip); return []; }
    const cellData = state.cells[nr][nc];

    if(cellData.type==='black'){
      return loseBall(ball, tip, nr, nc, ballState);
    }

    if(cellData.type==='hole'){
      const goalPopup = document.createElement('div');
      goalPopup.className='ball-goal-popup steel-sequence';
      const goalValue=document.createElement('span');
      goalValue.className='ball-goal-popup-value';
      goalValue.textContent=formatNumber(Math.round(ballState.total));
      goalPopup._valueEl=goalValue;
      goalPopup._lastTotal=Math.round(ballState.total);
      const tooltipScoreScale = Number.isFinite(tip?._valueEl?._scoreScale) ? tip._valueEl._scoreScale : 1;
      goalPopup.style.fontSize=`${getScoreDisplayFontSize(tooltipScoreScale)}px`;
      const goalColor = ballState.enh ? ENH_COLOR[ballState.enh] : (ballState.prop ? PROP_COLOR[ballState.prop] : 'var(--amber)');
      goalPopup.style.color=goalColor || 'var(--amber)';
      const goalPos=cellPercent(nr,nc);
      goalPopup.style.left=goalPos.left+'%';
      goalPopup.style.top=goalPos.top+'%';
      goalPopup.appendChild(goalValue);
      boardWrapEl.appendChild(goalPopup);
      startGoalPopupFlight(goalPopup,nr,nc);

      // Initial appearance impact: shake/zoom once as the popup first appears.
      // The impact is applied only to the inner value so the popup keeps flying
      // upward continuously without disturbing its parent flight path.
      requestAnimationFrame(()=>pulseGoalPopupValue(goalPopup));

      ball.classList.add('scored');
      tip.style.opacity='0';

      // Let the popup establish itself visually before any secondary score source is applied.
      await wait(GOAL_POPUP_FIRST_IMPACT_DELAY);
      if(generation!==runGeneration || !state){ goalPopup.remove(); removeEntity(ball,tip); return []; }

      // Every score increase while the popup is alive extends its upward flight
      // and triggers a strong zoom/shake on the score itself.
      const steelResolved=await animateSteelGoalMultipliers(ballState,goalPopup,generation);
      if(!steelResolved || generation!==runGeneration || !state){ goalPopup.remove(); removeEntity(ball,tip); return []; }

      const beforeGoalEffects=ballState.total;
      ballGoalEffects(ballState);
      updateTip(tip, ballState);
      updateGoalPopupScore(goalPopup, ballState, {impact:ballState.total>beforeGoalEffects, rise:GOAL_POPUP_IMPACT_RISE});

      await finishGoalPopup(goalPopup,generation);
      if(generation!==runGeneration || !state){ removeEntity(ball,tip); return []; }
      goalPopup.remove();
      removeEntity(ball,tip);
      counter.scored++;
      if(ballState.broke) counter.broke=(counter.broke||0)+1;
      const points=ballState.broke ? 0 : Math.round(ballState.total);
      state.score += points;
      counter.points=(counter.points||0) + points;
      scoreValEl.textContent=formatNumber(state.score);
      finishGlassBranch(ballState,true);

      return [points];
    }

    if(cellData.type==='node' || (cellData.type==='empty' && !cellData.block)){
      return loseBall(ball, tip, nr, nc, ballState);
    }

    const entrySide = opposite(dir);
    const blockRef = cellData.block;
    const sides = openSides(blockRef);
    if(!sides.includes(entrySide)){
      return loseBall(ball, tip, nr, nc, ballState);
    }

    if(cellData.debuff){
      // Keep the same ball entity and continue immediately; no re-spawn means no visible pause.
      const exits=sides.filter(s=>s!==entrySide);
      if(!exits.length) return loseBall(ball,tip,nr,nc,ballState);

      const debuffCellEl = boardEl.querySelector(`.cell.debuff-cell[data-r="${nr}"][data-c="${nc}"]`);
      pulseDebuffBlock(debuffCellEl);

      const exitDir=pick(exits);
      return travel(ball,tip,nr,nc,exitDir,ballState,counter,generation);
    }

    const previousTotal = ballState.total;
    const blockExitResult = blockExitEffects(blockRef, ballState);
    const ballExitTooltips = ballExitEffects(ballState);
    const invertBlock = blockRef.enhancement === 'invert';

    // Property tooltip first, then enhancement tooltip(s).
    const exitTooltips = [...(blockExitResult?.tooltips || []), ...ballExitTooltips];
    // Tooltips are non-blocking visual feedback; do not pause the ball.
    animateBlockExitTooltips(nr,nc,exitTooltips,generation);

    const brokeBlock = !!blockExitResult?.brokeBlock;
    if(brokeBlock) breakBlockAt(nr,nc);

    // A glass ball checks its 10% break chance after every block exit. If it breaks,
    // it stops at this block immediately and loses all accumulated score.
    if(ballState.prop==='glass' && Math.random() < 0.10){
      ballState.broke=true;
      counter.broke=(counter.broke||0)+1;
      ball.classList.add('lost');
      tip.style.opacity='0';
      await wait(300);
      removeEntity(ball,tip);
      if(ballState.enh==='invert'){
        const ok=await awardLostInvertBall(ballState,nr,nc,generation);
        if(!ok) return [];
      }
      if(ballState.glassShot?.spawnedExtra){
        finishGlassBranch(ballState,false);
      } else {
        if(ballState.glassShot) ballState.glassShot.finished=true;
        removeBallPermanently(ballState._ballId);
      }
      return [0];
    }

    // Normal first pass splits across every valid exit; later passes choose one exit.
    // Invert gives the shot up to two additional split opportunities. Each such
    // opportunity uses the same exit fan-out as T / Plus blocks.
    const allExits = sides.filter(s=>s!==entrySide);
    const canInvertSplit = invertBlock && ballState.shotMeta && ballState.shotMeta.invertSpawns < ballState.shotMeta.maxInvertSpawns;
    let exits;
    if(!blockRef._splitUsed){
      blockRef._splitUsed = true;
      exits = allExits;
      if(invertBlock) ballState.shotMeta.invertSpawns++;
    } else if(canInvertSplit){
      ballState.shotMeta.invertSpawns++;
      exits = allExits;
    } else {
      exits = [pick(allExits)];
    }
    removeEntity(ball,tip);

    const branches = [];
    if(ballState.prop==='glass' && ballState.glassShot){
      const childCount=exits.length;
      ballState.glassShot.active += childCount-1;
      if(childCount>1) ballState.glassShot.spawnedExtra=true;
    }
    exits.forEach(exitDir=>{
      const childState={
        total:ballState.total, rate:ballState.rate, prop:ballState.prop, enh:ballState.enh,
        initialTotal:ballState.initialTotal, _ballId:ballState._ballId, broke:ballState.broke,
        steelBlocks:new Set(ballState.steelBlocks||[]), glassShot:ballState.glassShot,
        shotMeta:ballState.shotMeta, counter:ballState.counter, lostScorePaid:false
      };
      const c1=createBallEntity(nr,nc,childState,true,previousTotal);
      branches.push(travel(c1.ball,c1.tip,nr,nc,exitDir,childState,counter));
    });
    const results = await Promise.all(branches);
    return results.flat();
  }

  async function onNodeClick(){
    if(state.resolving || state.phase!=='playing' || state.targeting) return;
    if(state.ballsFired >= state.ballQueue.length) return;
    const generation = runGeneration;
    state.resolving = true;

    for(let r=0;r<state.rows;r++) for(let c=0;c<state.cols;c++){
      const b = state.cells[r][c].block;
      if(b) b._splitUsed = false;
    }

    const idx = state.ballsFired;
    syncBallQueueFromPool();
    const queued = state.ballQueue[idx];
    const canonical = state.ballPool.find(b=>b._id===queued._id);
    if(canonical){
      queued.property = canonical.property || null;
      queued.enhancement = canonical.enhancement || null;
    }
    queued.fired = true;
    state.ballsFired++;
    renderBallQueue();

    const counter = {launched:0, scored:0, broke:0, points:0};
    const shotMeta = {
      invertSpawns:0,
      maxInvertSpawns:2,
      counter,
      sparkMultiplier:SPARK_START_MULTIPLIER,
      sparkBlockMultipliers:new Map()
    };
    const glassShot = queued.property==='glass' ? {
      ballId:queued._id, active:1,
      spawnedExtra:false, lossChecked:false, finished:false
    } : null;
    function makeBallState(){
      const initialTotal=50+state.startBonus;
      return {
        initialTotal, total:initialTotal, rate:10+state.baseRateBonus, prop:queued.property, _ballId:queued._id,
        enh:queued.enhancement,
        broke:false, steelBlocks:new Set(), glassShot, shotMeta, counter, lostScorePaid:false
      };
    }
    // Ball Invert no longer duplicates the ball on launch; its effect is paid on loss.
    const initialStates=[makeBallState(false)];

    const branchPromises = initialStates.map(bs=>{
      const ent = createBallEntity(state.node.r, state.node.c, bs);
      return travel(ent.ball, ent.tip, state.node.r, state.node.c, state.node.dir, bs, counter, generation);
    });
    const resultsArrays = await Promise.all(branchPromises);
    if(generation!==runGeneration || !state){
      return;
    }
    const results = resultsArrays.flat();

    const gained = counter.points || 0;

    if(gained>0){
      let msg = `${counter.scored}/${counter.launched} bóng về đích — +${gained} điểm`;
      if(counter.broke) msg += ` (${counter.broke} bóng vỡ)`;
    } else {
    }

    state.resolving = false;
    await checkEndState();
    saveGame({silent:true});
  }

  function getWinBonus(){
    const minBoardSize = Math.min(Number(state.rows)||0, Number(state.cols)||0);
    return Math.max(0, minBoardSize - 1);
  }

  async function checkEndState(){
    if(state.score >= state.target){
      const unfired = state.ballQueue.length - state.ballsFired;
      const interestCap = 5 + state.interestCapBonus;
      const interest = Math.min(Math.floor(state.money/5), interestCap);
      const ballBonus = unfired*2;

      const goldBlocks = [];
      if(state.cells) for(let r=0;r<state.rows;r++) for(let c=0;c<state.cols;c++){
        const b = state.cells[r][c]?.block;
        if(b?.property==='gold') goldBlocks.push(b);
      }

      // The last scoring ball has finished. Show each gold-block reward
      // while the board is still fully visible, then start board hide.
      const generation = runGeneration;
      const goldResolved = await animateGoldBlockRewards(goldBlocks, generation);
      if(!goldResolved || generation!==runGeneration || !state) return;

      state.phase = 'reward';
      runBoardHideAnimation(()=>showLevelReward({winBonus:getWinBonus(), unfired, ballBonus, interest}));
    } else if(state.ballsFired >= state.ballQueue.length){
      state.phase = 'gameover';
      renderCardHand();
      showOverlay('lose', 'GAME OVER', `Dừng lại ở màn ${formatNumber(state.level)}, đạt ${formatNumber(state.score)}/${formatNumber(state.target)} điểm. Tổng tiền tích luỹ: ${formatMoney(state.money)}.`);
    }
  }

  function runBoardHideAnimation(onComplete){
    if(!state?.cells || !state.rows || !state.cols){
      onComplete?.();
      return;
    }
    if(boardRevealTimer){
      clearTimeout(boardRevealTimer);
      boardRevealTimer=null;
    }
    state._boardReveal = false;
    state._boardHide = true;
    state._handReveal = false;
    state._handHide = true;
    state._boardHideComplete = typeof onComplete === 'function' ? onComplete : null;
    render();
  }

  function recycleCurrentLevelBlocksToBag(){
    if(!state) return;
    if(state.cells){
      for(let r=0;r<state.rows;r++) for(let c=0;c<state.cols;c++){
        const b=state.cells[r][c]?.block;
        if(b){ state.bag.push(b); state.cells[r][c].block=null; }
      }
    }
    state.bag.push(...state.hand.filter(Boolean));
    state.bag.push(...state.discardPile.filter(Boolean));
    state.hand=[];
    state.discardPile=[];
    state.discardsLeft=getMaxDiscards();
    state.bag.forEach(block=>{ if(block) block.rotation=0; });
    shuffle(state.bag);
  }

  function showLevelReward(info){
    const rewardId = ++rewardGeneration;
    shopOverlayEl.classList.add('hidden');
    shopOverlayEl.innerHTML='';
    const winBonus = Number.isFinite(info.winBonus) ? info.winBonus : getWinBonus();
    // Gold-block money has already been awarded during each +3$ tooltip sequence.
    const total = winBonus + info.ballBonus + info.interest;
    state._handRewardHidden = true;
    document.querySelector('.hand-row')?.classList.add('reward-hidden');

    overlayEl.classList.add('reward-clear');
    overlayPanelEl.className='overlay-panel win reward-anim-in';
    overlayTitleEl.innerHTML='<span class="reward-step">Qua màn!</span>';
    overlayTextEl.style.textAlign='left';
    overlayTextEl.style.lineHeight='1.6';
    overlayTextEl.innerHTML=`
      <div class="reward-layout">
        <div class="reward-row"><span class="reward-label reward-win-label reward-step">- Thưởng thắng:</span><span class="reward-value reward-step">${formatNumber(winBonus)}$</span></div>
        <div class="reward-row"><span class="reward-label reward-step">- ${formatNumber(info.unfired)} bóng còn sót (${formatNumber(2)}$ mỗi bóng):</span><span class="reward-value reward-step">${formatNumber(info.ballBonus)}$</span></div>
        <div class="reward-row"><span class="reward-label reward-step">- Tiền lãi (Mỗi 5$ nhận thêm 1$, tối đa ${formatMoney(5 + state.interestCapBonus)}):</span><span class="reward-value reward-step">${formatNumber(info.interest)}$</span></div>
      </div>`;

    const btn=document.getElementById('overlayBtn');
    // The reward button is shared with the lose overlay/restart flow.
    // Reset every transient state and bind this button to a unique reward cycle.
    btn.className='gold reward-step';
    delete btn.dataset.busy;
    btn.disabled=false;
    btn.textContent=`Nhận tiền: ${formatNumber(total)}$`;
    btn.onclick=()=>{
      // Ignore stale handlers from an older reward/run and prevent double collection.
      if(rewardId!==rewardGeneration || btn.dataset.busy==='1' || state.phase!=='reward') return;
      btn.dataset.busy='1';
      btn.disabled=true;

      // No scale/zoom-out animation when collecting the reward.
      state.money += total;
      state.phase='shop';
      state._boardHideComplete=null;
      state._handRewardHidden=true;
      document.querySelector('.hand-row')?.classList.add('reward-hidden');
      state.score=0;
      recycleCurrentLevelBlocksToBag();
      state.ballsFired=0;
      state.ballQueue=makeBallQueue();
      document.querySelectorAll('.ball, .ball-tooltip, .ball-goal-popup, .block-exit-tooltip').forEach(el=>el.remove());
      moneyValEl.textContent=formatMoney(state.money);
      scoreValEl.textContent=formatNumber(state.score);
      renderBallQueue();
      renderHand();
      renderCardHand();
      bagCountEl.textContent=`Túi khối còn lại: ${formatNumber(state.bag.length)}`;
      discardCountEl.textContent=`(${formatNumber(state.discardsLeft)}/${formatNumber(getMaxDiscards())})`;
      discardBtnEl.disabled=true;
      hideOverlay();
      overlayEl.classList.remove('reward-clear');
      openShop();
      // The reward has been consumed; while the shop is active the shared button
      // must not retain a stale reward handler.
      btn.dataset.busy='';
      btn.disabled=false;
      btn.onclick=newRun;
      scheduleAutoSave();
    };
    overlayEl.classList.remove('hidden');

    requestAnimationFrame(()=>{
      const title=overlayPanelEl.querySelector('#overlayTitle .reward-step');
      if(title) setTimeout(()=>title.classList.add('reward-show'),0);
      const labels=[...overlayPanelEl.querySelectorAll('.reward-row .reward-label')];
      const values=[...overlayPanelEl.querySelectorAll('.reward-row .reward-value')];
      // Keep the reward reveal timings consistent with the selected animation speed.
      // CSS animation durations already use --anim-speed, so the JS delays must
      // use the same scale as well.
      let delay=scaledDuration(500);
      for(let i=0;i<labels.length;i++){
        setTimeout(()=>labels[i].classList.add('reward-show'),delay);
        delay += scaledDuration(220);
        setTimeout(()=>values[i]?.classList.add('reward-show'),delay);
        delay += scaledDuration(260);
      }
      setTimeout(()=>btn.classList.add('reward-show'),delay+scaledDuration(500));
    });
  }
